<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DMI Boardgame</title>
<link rel="icon" href="/brand/mark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap">
<style>
/* Nền gradient xanh chéo (chàm dưới-trái → cyan trên-phải), thẻ người chơi dạng lưới 3 cột trên nền kính tối */
:root {
  --g1: #1A4FE0;
  --g2: #1E88F0;
  --g3: #2EC5F5;
  --card: rgba(7, 20, 66, .62);
  --card-2: rgba(255, 255, 255, .16);
  --field: rgba(3, 10, 40, .45);
  --sheet: #0e2a8c;
  --line: rgba(255, 255, 255, .2);
  --text: #ffffff;
  --muted: #d9e8ff;
  --accent: #ffffff;
  --on-accent: #1A4FE0;
  --civ: #5cf2a5;
  --spy: #ff6b7a;
  --white: #f1f5f9;
  --gold: #ffd84d;
  --on-gold: #0b1e63;
  --radius: 16px;
  --font: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { height: 100%; }

html, body {
  margin: 0;
  min-height: 100%;
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.45;
}

html { background: var(--g1); }

body {
  display: flex;
  flex-direction: column;
  background: var(--g2) linear-gradient(to top right, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);
}

#app {
  flex: 1;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding-block: 20px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}

h1, h2, h3, p { margin: 0; }
h2 { font-size: 1.35rem; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.center { text-align: center; }
.grow { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }

/* Buttons */
button, select { font: inherit; color: inherit; cursor: pointer; border: 0; }
.btn {
  width: 100%;
  padding: 16px;
  border-radius: var(--radius);
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 800;
  font-size: 1.05rem;
  box-shadow: 0 6px 18px rgba(4, 16, 70, .28);
  transition: transform .08s, opacity .15s;
}
.btn:active { transform: scale(.98); opacity: .9; }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.ghost { background: var(--card-2); color: var(--text); box-shadow: none; }
.link { background: none; color: var(--muted); padding: 8px; text-decoration: underline; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}

/* Home */
.hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.hero .logo { font-size: 5.5rem; line-height: 1; filter: drop-shadow(0 10px 24px rgba(4, 16, 70, .45)); }
.hero h1 { font-size: 2.8rem; letter-spacing: .08em; font-weight: 900; }
.hero h1 span { color: var(--gold); }

.topbar { display: flex; align-items: center; gap: 8px; }
.topbar h2 { flex: 1; }
.back { width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--card); font-size: 1.2rem; }

.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 40px; border-radius: 12px; background: var(--card-2); font-size: 1.3rem; font-weight: 700; }
.stepper button:disabled { opacity: .3; }
.stepper b { min-width: 36px; text-align: center; font-size: 1.2rem; font-variant-numeric: tabular-nums; }

input[type="text"], .guess input {
  flex: 1; min-width: 0; width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--text);
  font: inherit; font-size: 16px;
}
input:focus { outline: 2px solid var(--gold); outline-offset: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 12px;
  border-radius: 999px;
  background: var(--field);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: .9rem;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }

.role-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.role-dot.civ { background: var(--civ); }
.role-dot.spy { background: var(--spy); }
.role-dot.white { background: var(--white); }

/* Lưới thẻ người chơi */
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-content: start; }
.pcard {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  min-width: 0;
  padding: 22px 6px 10px;
  border-radius: var(--radius);
  background: var(--card);
  border: 2px solid transparent;
  text-align: center;
}
.pcard .seat {
  position: absolute; top: 6px; left: 9px;
  font-size: .72rem; font-weight: 700; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.pcard .pname { max-width: 100%; font-weight: 700; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .score { font-size: .85rem; font-weight: 800; color: var(--gold); }
.pcard.sel { border-color: var(--spy); background: rgba(90, 10, 40, .6); }
.pcard.first { border-color: var(--gold); }
.pcard.out { opacity: .5; }
.pcard.out .pname { text-decoration: line-through; }
.pcard select {
  width: 100%;
  padding: 7px 4px;
  border-radius: 10px;
  background: var(--card-2);
  font-size: 16px;
  font-weight: 600;
  text-align: center;
  text-align-last: center;
  appearance: none;
  -webkit-appearance: none;
}
.pcard.empty .avatar { background: var(--card-2) !important; }

.avatar {
  width: 54px; height: 54px; flex: none;
  border-radius: 50%;
  display: grid; place-items: center;
  color: #fff;
  font-weight: 700; font-size: 1.05rem; letter-spacing: .02em;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .22);
}
.avatar.big { width: 96px; height: 96px; font-size: 1.9rem; }

.tag { padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 700; white-space: nowrap; }
.tag.civ { background: rgba(92, 242, 165, .16); color: var(--civ); }
.tag.spy { background: rgba(255, 107, 122, .2); color: var(--spy); }
.tag.white { background: rgba(241, 245, 249, .18); color: var(--white); }
.tag.first { background: var(--gold); color: var(--on-gold); }

/* Deal & reveal */
.secret {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 28px 20px;
  min-height: 340px;
}
.secret .emoji { font-size: 4rem; line-height: 1; }
.secret .who { font-size: 1.9rem; font-weight: 800; }
.secret .word {
  font-size: 2.3rem;
  font-weight: 900;
  color: var(--gold);
  word-break: break-word;
  animation: pop .25s ease-out;
}
.progress { height: 6px; border-radius: 3px; background: var(--card); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--gold); transition: width .3s; }

@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.reveal .role { font-size: 2rem; font-weight: 900; animation: pop .3s ease-out; }
.role.civ { color: var(--civ); }
.role.spy { color: var(--spy); }
.role.white { color: var(--white); }

.guess { display: flex; gap: 8px; width: 100%; }
.guess .btn { width: auto; padding: 14px 18px; }

.words { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.words .card { text-align: center; padding: 14px 8px; }
.words b { display: block; font-size: 1.25rem; margin-top: 4px; word-break: break-word; }

/* Modal */
.modal {
  position: fixed; inset: 0;
  background: rgba(3, 10, 40, .72);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 10;
}
.modal[hidden] { display: none; }
.sheet {
  width: 100%; max-width: 480px; max-height: 88dvh;
  overflow-y: auto;
  background: var(--sheet);
  border-radius: 24px 24px 0 0;
  padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.rules li { margin-bottom: 8px; }
.rules ul { margin: 0; padding-left: 20px; }

/* Trang chủ & bảng xếp hạng */
.brand { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding-block: 18px 6px; }
.brand .logo { font-size: 4rem; line-height: 1; filter: drop-shadow(0 10px 24px rgba(4, 16, 70, .45)); }
.brand h1 { font-size: 2.1rem; font-weight: 900; letter-spacing: .06em; }
.brand h1 span { color: var(--gold); }

.games { display: flex; flex-direction: column; gap: 12px; }
.gcard {
  display: flex; align-items: center; gap: 14px;
  width: 100%;
  padding: 16px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--line);
  text-align: left;
}
.gcard .gicon { font-size: 2.6rem; line-height: 1; flex: none; }
.gcard .gbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.gcard .gname { font-size: 1.2rem; font-weight: 800; }
.gcard .go { font-size: 1.6rem; color: var(--gold); }
.gcard.soon { opacity: .7; border-style: dashed; }

.list { display: flex; flex-direction: column; gap: 8px; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--card); }
.lrow .rank { width: 26px; flex: none; text-align: center; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.lrow .avatar { width: 40px; height: 40px; font-size: .85rem; }
.lrow .lname { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lrow .lname b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .pts { font-weight: 800; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hrow { display: flex; gap: 10px; align-items: baseline; font-size: .9rem; }
.hrow time { flex: none; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.hrow span { min-width: 0; }

/* Ma Sói */
.switch {
  flex: none;
  min-width: 64px;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--field);
  border: 1px solid var(--line);
  color: var(--muted);
  font-weight: 700; font-size: .85rem;
}
.switch.on { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.tag.wolf { background: rgba(255, 107, 122, .2); color: var(--spy); }
.tag.special { background: rgba(255, 216, 77, .18); color: var(--gold); }
.tag.villager { background: rgba(92, 242, 165, .16); color: var(--civ); }
.role.wolf { color: var(--spy); }
.role.special { color: var(--gold); }
.role.villager { color: var(--civ); }
.secret.night { background: rgba(4, 10, 44, .78); }
.info { padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: .95rem; }
.info .switch { align-self: flex-start; }
.result { font-size: 1.5rem; font-weight: 800; color: var(--gold); text-wrap: balance; }

/* Chơi nhiều máy */
.code { font-size: 2.8rem; font-weight: 900; letter-spacing: .25em; color: var(--gold); font-variant-numeric: tabular-nums; }
.field { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--field); font-size: 16px; }
button.lrow { width: 100%; text-align: left; }

/* Ảnh vai, timeline của đêm và vai đang được gọi */
.role-art { display: block; width: 168px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 18px; border: 2px solid var(--line); box-shadow: 0 10px 28px rgba(4, 16, 70, .45); margin: 0 auto; }
.role-art.emoji { display: grid; place-items: center; background: var(--card); font-size: 4.5rem; line-height: 1; }
.role-art.small { width: 56px; border-radius: 12px; }
.role-art.small.emoji { font-size: 1.9rem; }
.role-mini .role-art { width: 44px; border-radius: 10px; box-shadow: none; }
.role-mini .role-art.emoji { font-size: 1.5rem; }
.role-card { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
/* Timeline ngang: mỗi bước một vòng tròn, nối với bước trước bằng một vạch */
.timeline { list-style: none; margin: 0; padding: 6px 0 2px; display: flex; }
.timeline li { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); font-size: .7rem; font-weight: 600; text-align: center; }
.timeline li + li::before { content: ''; position: absolute; top: 19px; right: 50%; width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.timeline li.done::before, .timeline li.now::before { background: var(--civ); }
.timeline .dot { position: relative; z-index: 1; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: var(--sheet); border: 2px solid var(--line); font-size: 1.15rem; transition: transform .2s; }
.timeline .dot img { width: 100%; height: 100%; object-fit: cover; }
.timeline li.done { color: var(--civ); }
.timeline li.done .dot { border-color: var(--civ); background: #0f5a3c; color: var(--civ); font-weight: 900; }
.timeline li.now { color: var(--gold); font-weight: 800; }
.timeline li.now .dot { border-color: var(--gold); transform: scale(1.18); box-shadow: 0 0 0 4px rgba(255, 216, 77, .28); }
.calling { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); font-size: 1.15rem; }
.calling.wolf { border-color: var(--spy); }
.calling.special { border-color: var(--gold); }
.calling .role-art { margin: 0; }

/* Vòng tròn đếm ngược: vạch chạy hết vòng trong --total, bắt đầu từ chỗ đã trôi qua (--delay âm) */
.ring { position: relative; flex: none; width: 58px; height: 58px; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--gold); stroke-linecap: round; stroke-dasharray: 100; animation: ring-run var(--total) linear var(--delay) forwards; }
.ring span { position: relative; font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; }
@keyframes ring-run {
  0% { stroke-dashoffset: 0; stroke: var(--gold); }
  75% { stroke: var(--gold); }
  100% { stroke-dashoffset: 100; stroke: var(--spy); }
}

/* Làng 3D (village.js): cảnh phủ cả màn hình, bảng game thành khung kéo ở dưới, cần gạt ở góc trái */
.v-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; z-index: 0; touch-action: none; }
body.in-village { background: #0b1030; }
body.in-village #app {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
  max-height: 46dvh; overflow-y: auto; overscroll-behavior: contain;
  padding-top: 0; gap: 12px;
  background: rgba(7, 20, 66, .88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, .35);
  transition: max-height .25s;
}
body.in-village.v-night #app { max-height: 80dvh; }
body.in-village.sheet-min #app { max-height: 86px; overflow: hidden; }
.sheet-handle { display: none; }
body.in-village .sheet-handle { display: block; flex: none; width: 100%; height: 20px; background: none; position: relative; }
body.in-village .sheet-handle::before { content: ''; position: absolute; left: 50%; top: 8px; width: 46px; height: 5px; margin-left: -23px; border-radius: 3px; background: rgba(255, 255, 255, .45); }
.v-stick { position: fixed; z-index: 3; left: 18px; bottom: calc(46dvh + 18px); width: 112px; height: 112px; border-radius: 50%; background: rgba(255, 255, 255, .14); border: 2px solid rgba(255, 255, 255, .4); touch-action: none; }
body.sheet-min .v-stick { bottom: 104px; }
body.v-night .v-stick, .v-stick[hidden] { display: none; }
/* Ban đêm đến lượt mình: đi lại được nên bảng thu bớt và hiện cần gạt */
body.in-village.v-night.v-roam #app { max-height: 46dvh; }
body.v-night.v-roam .v-stick { display: block; }
body.v-night.v-roam.sheet-min .v-stick { bottom: 104px; }
.v-knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; border-radius: 50%; background: rgba(255, 255, 255, .8); box-shadow: 0 4px 12px rgba(0, 0, 0, .3); pointer-events: none; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>
<body>
<main id="app"></main>
<div id="modal" class="modal" hidden></div>
<script>
// Phần dùng chung của DMI Boardgame: lưu trữ, bàn chơi (danh sách thành viên), bảng điểm, khung giao diện.
// Mỗi game tự đăng ký vào GAMES, views, modals, actions, forms.
const MAX_PLAYERS = 20;
// Danh sách dự phòng, chỉ dùng khi chưa lấy được danh sách nhân viên từ DMI Workspace (xem phần Dữ liệu online)
const DEFAULT_ROSTER = [
  'Aeris', 'Alfie', 'Annie', 'Arthur', 'Bang', 'Brian', 'Duke', 'Dylan', 'Ed', 'Editor',
  'Fender', 'Jason', 'Jesse', 'Kris', 'Maelyn', 'Maxx', 'Ryan', 'Steve', 'Vincent',
];
const AVATAR_COLORS = ['#6b5bc2', '#b5551d', '#2456c8', '#8a3a6e', '#45506b', '#3f8457', '#35657d', '#a2342a'];
const NEW_NAME = '__new';
const LOG_LIMIT = 50;

const app = document.querySelector('#app');
const modalEl = document.querySelector('#modal');

const load = (key, fallback) => {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v ?? fallback;
  } catch {
    return fallback;
  }
};
const save = (key, value) => {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch {}
};

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const rand = (n) => Math.floor(Math.random() * n);
const shuffle = (arr) => {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = rand(i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
};

const GAMES = [];
const views = {};
const modals = {};
const actions = {};
const forms = {};
// Việc cần làm mỗi khi mở một màn (tải dữ liệu mới nhất), theo tên màn
const ENTER = {};
let view = 'home';
let modal = null;

/* ---------- Dữ liệu dùng chung ---------- */

// Chuyển dữ liệu từ bản Gián Điệp cũ (khóa gd.*) sang hệ thống mới
const oldCfg = load('gd.cfg', null);
const oldScores = load('gd.scores', {});
let table = load('dmi.table', null) || { n: oldCfg?.n || 5, names: oldCfg?.names || [], extra: oldCfg?.extra || [] };
// stats[gameId][tên] = { p: điểm, g: số ván, w: số ván thắng }
let stats = load('dmi.stats', null) || {
  spy: Object.fromEntries(Object.entries(oldScores).map(([name, p]) => [name, { p, g: 0, w: 0 }])),
};
let gameLog = load('dmi.log', []);

// Danh sách nhân viên DMI Workspace (null khi chưa lấy được), cộng thêm các tên khác thêm trên máy này
let sharedRoster = null;
const baseRoster = () => sharedRoster || DEFAULT_ROSTER;
const roster = () => [...new Set([...baseRoster(), ...table.extra])];
const seatName = (i) => table.names[i] || `Người ${i + 1}`;
const tableNames = () => Array.from({ length: table.n }, (_, i) => seatName(i));

function fixTable(min) {
  table.n = Math.min(MAX_PLAYERS, Math.max(min, table.n));
  save('dmi.table', table);
}

// Gán tên cho một ghế; nếu tên đang ở ghế khác thì ghế đó bị bỏ trống
function assignName(seat, name) {
  table.names = Array.from({ length: MAX_PLAYERS }, (_, i) => (table.names[i] === name ? '' : table.names[i] || ''));
  table.names[seat] = name;
  save('dmi.table', table);
}

// results: [{ name, pts, win }]
function addResults(gameId, results) {
  const board = (stats[gameId] ||= {});
  results.forEach(({ name, pts, win }) => {
    const row = (board[name] ||= { p: 0, g: 0, w: 0 });
    row.p += pts;
    row.g += 1;
    row.w += win ? 1 : 0;
  });
}

function recordGame(gameId, text, results) {
  const t = Date.now();
  addResults(gameId, results);
  gameLog.unshift({ t, game: gameId, text, n: results.length });
  gameLog = gameLog.slice(0, LOG_LIMIT);
  // Có bảng xếp hạng online thì ghi lên đó, không thì chỉ lưu trên máy này
  if (online) return void saveGame({ t, game: gameId, text, results });
  save('dmi.stats', stats);
  save('dmi.log', gameLog);
}

// Số ghế trong phòng Ma Sói (người và bot), dùng để tính số vai
const seatCount = () => (mp?.room ? Math.max(mpCount(), WW_MIN) : WW_MIN);

const pointsOf = (gameId, name) => stats[gameId]?.[name]?.p || 0;

/* ---------- Thành phần giao diện ---------- */

const stepper = (act, key, value, min, max) => `
  <div class="stepper">
    <button data-act="${act}" data-key="${key}" data-d="-1" ${value <= min ? 'disabled' : ''}>−</button>
    <b>${value}</b>
    <button data-act="${act}" data-key="${key}" data-d="1" ${value >= max ? 'disabled' : ''}>+</button>
  </div>`;

// Mỗi tên một màu cố định (avatar và áo của nhân vật 3D)
const avatarColor = (name) => AVATAR_COLORS[[...name].reduce((h, c) => (h * 31 + c.codePointAt(0)) >>> 0, 7) % AVATAR_COLORS.length];

function avatar(name, cls = '') {
  const initials = /^Người \d+$/.test(name) ? name.slice(6) : name.slice(0, 2).toUpperCase();
  return `<span class="avatar ${cls}" style="background:${avatarColor(name)}">${esc(initials)}</span>`;
}

// Thẻ người chơi trong lưới: số thứ tự, avatar, tên và phần phụ (vai, điểm...)
function playerCard(name, { seat = 0, cls = '', extra = '', act = '', i = '' } = {}) {
  const tag = act ? 'button' : 'div';
  return `
    <${tag} class="pcard ${cls}" ${act ? `data-act="${act}" data-i="${i}"` : ''}>
      ${seat ? `<span class="seat">#${seat}</span>` : ''}
      ${avatar(name)}
      <span class="pname">${esc(name)}</span>
      ${extra}
    </${tag}>`;
}

function seatCard(i) {
  const current = table.names[i] || '';
  const taken = table.names.slice(0, table.n).filter((name, k) => name && k !== i);
  const options = roster().filter((name) => !taken.includes(name));
  if (current && !options.includes(current)) options.unshift(current);
  return `
    <div class="pcard ${current ? '' : 'empty'}">
      <span class="seat">#${i + 1}</span>
      ${avatar(seatName(i))}
      <select id="seat-${i}" data-seat="${i}" aria-label="Tên người chơi ${i + 1}">
        <option value="">Chọn tên</option>
        ${options.map((name) => `<option ${name === current ? 'selected' : ''}>${esc(name)}</option>`).join('')}
        <option value="${NEW_NAME}">＋ Tên khác…</option>
      </select>
    </div>`;
}

// Khối chọn số người và tên từng ghế, dùng chung cho màn thiết lập của mọi game
function tableSection(min) {
  fixTable(min);
  return `
    <div class="card row between"><b>Số người chơi</b>${stepper('tstep', 'n', table.n, min, MAX_PLAYERS)}</div>
    <div class="pgrid">${Array.from({ length: table.n }, (_, i) => seatCard(i)).join('')}</div>
    <p class="muted small center">Danh sách thành viên được lưu lại cho các ván sau.</p>`;
}

function go(name) {
  view = name;
  window.scrollTo(0, 0);
  ENTER[name]?.();
}

// Việc cần làm sau mỗi lần vẽ lại (đưa trạng thái sang làng 3D)
const AFTER_RENDER = [];

function render() {
  app.innerHTML = views[view]();
  modalEl.hidden = !modal;
  modalEl.innerHTML = modal ? `<div class="sheet">${modals[modal.type]()}</div>` : '';
  AFTER_RENDER.forEach((fn) => fn());
}

/* ---------- Modal & action dùng chung ---------- */

modals.rules = () => `
  ${GAMES.find((game) => game.id === modal.game).rules()}
  <button class="btn" data-act="close">Đã hiểu</button>`;

// modal = { type: 'confirm', title, text, yes, act }: act là action chạy khi đồng ý
modals.confirm = () => `
  <h2>${modal.title}</h2>
  <p class="muted">${modal.text}</p>
  <button class="btn" data-act="${modal.act}">${modal.yes}</button>
  <button class="btn ghost" data-act="close">Hủy</button>`;

modals.newname = () => `
  <h2>Thêm tên mới</h2>
  <p class="muted">Tên sẽ được lưu vào danh sách để chọn cho các ván sau.</p>
  <form class="guess" data-form="newname">
    <input id="newname-input" name="name" type="text" maxlength="16" autocomplete="off" placeholder="Tên người chơi">
    <button class="btn">Thêm</button>
  </form>
  <button class="btn ghost" data-act="close">Hủy</button>`;

actions.go = (el) => go(el.dataset.view);
actions.close = () => (modal = null);
actions.rules = (el) => (modal = { type: 'rules', game: el.dataset.game });
actions.tstep = (el) => {
  table.n += Number(el.dataset.d);
  save('dmi.table', table);
};

forms.newname = (form) => {
  const typed = form.elements.name.value.trim();
  if (!typed) return;
  // Trùng tên có sẵn (không phân biệt hoa/thường) thì dùng lại tên đó
  const name = roster().find((r) => r.toLowerCase() === typed.toLowerCase()) || typed;
  if (!roster().includes(name)) table.extra.push(name);
  assignName(modal.seat, name);
  modal = null;
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  actions[el.dataset.act](el);
  render();
});

document.addEventListener('change', (e) => {
  const seat = e.target.dataset.seat;
  if (seat === undefined) return;
  if (e.target.value === NEW_NAME) modal = { type: 'newname', seat: Number(seat) };
  else assignName(Number(seat), e.target.value);
  render();
  if (modal) document.querySelector('#newname-input')?.focus();
});

document.addEventListener('submit', (e) => {
  const handler = forms[e.target.dataset.form];
  if (!handler) return;
  e.preventDefault();
  handler(e.target);
  render();
});

</script>

<script>
// Game Gián Điệp: Dân và Gián điệp nhận 2 từ khóa na ná nhau, Mũ trắng không có từ.
const SPY_MIN = 3;
const SPY_ROLES = {
  civ: { label: 'Dân thường', emoji: '🧑‍🌾' },
  spy: { label: 'Gián điệp', emoji: '🕵️' },
  white: { label: 'Mũ trắng', emoji: '🎩' },
};
const SPY_POINTS = { civ: 2, spy: 10, white: 6 };
const SPY_CATS = WORD_PACKS.map((p) => p.id);
const SPY_TOTAL = WORD_PACKS.reduce((sum, p) => sum + p.pairs.length, 0);

let spyCfg = {
  spies: oldCfg?.spies ?? 1,
  whites: oldCfg?.whites ?? 0,
  cats: oldCfg?.cats || SPY_CATS,
  ...load('dmi.spy', {}),
};
let spyUsed = load('gd.used', []);
let sg = null;

// So khớp lời đoán của Mũ trắng: bỏ dấu, hoa/thường, khoảng trắng
const spyNorm = (s) =>
  s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]/g, '');
const spyMaxHidden = (n) => Math.floor((n - 1) / 2);

function fixSpy() {
  const max = spyMaxHidden(table.n);
  spyCfg.spies = Math.min(max, Math.max(0, spyCfg.spies));
  spyCfg.whites = Math.min(max - spyCfg.spies, Math.max(0, spyCfg.whites));
  if (spyCfg.spies + spyCfg.whites === 0) spyCfg.spies = 1;
  spyCfg.cats = spyCfg.cats.filter((id) => SPY_CATS.includes(id));
  if (!spyCfg.cats.length) spyCfg.cats = [...SPY_CATS];
  save('dmi.spy', spyCfg);
}

/* ---------- Game logic ---------- */

// Không ra lại cặp đã chơi (danh sách đồng bộ online, xem loadSpyUsed) cho tới khi dùng hết các chủ đề đang chọn.
// Ưu tiên cặp mà cả 2 từ chưa từng xuất hiện, vì một từ có thể nằm trong nhiều cặp (Ổi|Cóc và Ếch|Cóc).
function spyPickPair() {
  const all = WORD_PACKS.filter((p) => spyCfg.cats.includes(p.id)).flatMap((p) => p.pairs);
  const usedWords = new Set(spyUsed.flatMap((pair) => pair.split('|')));
  const fresh = all.filter((pair) => !spyUsed.includes(pair));
  let pool = fresh.filter((pair) => pair.split('|').every((word) => !usedWords.has(word)));
  if (!pool.length) pool = fresh;
  let forget = [];
  if (!pool.length) {
    forget = all;
    spyUsed = spyUsed.filter((pair) => !all.includes(pair));
    pool = all;
  }
  const pair = pool[rand(pool.length)];
  spyUsed.push(pair);
  save('gd.used', spyUsed);
  saveSpyUsed(pair, forget);
  return pair;
}

function spyNewGame() {
  fixTable(SPY_MIN);
  fixSpy();
  const n = table.n;
  const words = spyPickPair().split('|');
  if (Math.random() < 0.5) words.reverse();
  const roles = shuffle([
    ...Array(spyCfg.spies).fill('spy'),
    ...Array(spyCfg.whites).fill('white'),
    ...Array(n - spyCfg.spies - spyCfg.whites).fill('civ'),
  ]);
  // Mũ trắng không bao giờ phải nói đầu tiên
  const starters = roles.map((r, i) => (r === 'white' ? -1 : i)).filter((i) => i >= 0);
  sg = {
    names: tableNames(),
    civWord: words[0],
    spyWord: words[1],
    roles,
    alive: Array(n).fill(true),
    start: starters[rand(starters.length)],
    dealIdx: 0,
    shown: false,
    round: 1,
    sel: null,
    out: null,
    guess: null,
    winner: null,
    winnerIdx: null,
  };
  go('spy.deal');
}

const spyWordOf = (i) => (sg.roles[i] === 'civ' ? sg.civWord : sg.roles[i] === 'spy' ? sg.spyWord : null);
const spyAlive = (...roles) => sg.roles.filter((r, i) => sg.alive[i] && roles.includes(r)).length;
const spyOrder = () => sg.roles.map((_, k) => (sg.start + k) % sg.roles.length).filter((i) => sg.alive[i]);

function spyCheckWin() {
  if (spyAlive('spy', 'white') === 0) return 'civ';
  if (spyAlive('civ') <= 1) return 'inf';
  return null;
}

function spyFinish(winner, winnerIdx = null) {
  sg.winner = winner;
  sg.winnerIdx = winnerIdx;
  const results = sg.roles.map((role, i) => {
    const win =
      (winner === 'civ' && role === 'civ') || (winner === 'inf' && role !== 'civ') || (winner === 'white' && i === winnerIdx);
    return { name: sg.names[i], pts: win ? SPY_POINTS[role] : 0, win };
  });
  const who = { civ: 'Phe Dân thắng', inf: 'Phe Gián điệp thắng', white: `Mũ trắng ${sg.names[winnerIdx]} thắng` }[winner];
  recordGame('spy', `${who} · ${sg.civWord} / ${sg.spyWord}`, results);
  go('spy.end');
}

/* ---------- Views ---------- */

const spyTag = (role) => `<span class="tag ${role}">${SPY_ROLES[role].label}</span>`;

views['spy.setup'] = () => {
  const tableHtml = tableSection(SPY_MIN);
  fixSpy();
  const max = spyMaxHidden(table.n);
  const civs = table.n - spyCfg.spies - spyCfg.whites;
  const selected = WORD_PACKS.filter((p) => spyCfg.cats.includes(p.id)).reduce((s, p) => s + p.pairs.length, 0);
  return `
    <div class="topbar">
      <button class="back" data-act="go" data-view="home">←</button>
      <h2>🕵️ Gián Điệp</h2>
      <button class="link small" data-act="rules" data-game="spy">Luật chơi</button>
    </div>
    ${tableHtml}

    <div class="card stack">
      <div class="row between">
        <span><i class="role-dot civ"></i><b>Dân thường</b></span><b>${civs}</b>
      </div>
      <div class="row between">
        <span><i class="role-dot spy"></i><b>Gián điệp</b><br><span class="muted small">Nhận từ khóa na ná phe Dân</span></span>
        ${stepper('spy.step', 'spies', spyCfg.spies, spyCfg.whites ? 0 : 1, max - spyCfg.whites)}
      </div>
      <div class="row between">
        <span><i class="role-dot white"></i><b>Mũ trắng</b><br><span class="muted small">Không có từ khóa, phải đoán mò</span></span>
        ${stepper('spy.step', 'whites', spyCfg.whites, spyCfg.spies ? 0 : 1, max - spyCfg.spies)}
      </div>
    </div>

    <div class="card stack">
      <div class="row between">
        <b>Chủ đề</b>
        <button class="link small" data-act="spy.allcats">Chọn tất cả</button>
      </div>
      <div class="chips">
        ${WORD_PACKS.map((p) => `
          <button class="chip ${spyCfg.cats.includes(p.id) ? 'on' : ''}" data-act="spy.cat" data-id="${p.id}">
            ${p.icon} ${p.name} · ${p.pairs.length}
          </button>`).join('')}
      </div>
      <p class="muted small">Đang chọn ${selected} cặp từ khóa</p>
    </div>

    <button class="btn" data-act="spy.start">Bắt đầu chia từ</button>`;
};

views['spy.deal'] = () => {
  const i = sg.dealIdx;
  const n = sg.roles.length;
  const name = sg.names[i];
  const word = spyWordOf(i);
  const body = !sg.shown
    ? `<p class="muted">Đưa máy cho</p>
       ${avatar(name, 'big')}
       <div class="who">${esc(name)}</div>
       <p class="muted small">Đừng để ai khác nhìn thấy màn hình!</p>`
    : word
      ? `<p class="muted">Từ khóa của ${esc(name)}</p>
         <div class="word">${esc(word)}</div>
         <p class="muted small">Ghi nhớ rồi bấm ẩn trước khi chuyền máy.</p>`
      : `<div class="emoji">🎩</div>
         <div class="word">MŨ TRẮNG</div>
         <p class="muted">Bạn không có từ khóa. Hãy lắng nghe, nói thật mơ hồ và đoán từ của mọi người!</p>`;
  return `
    <div class="topbar">
      <h2>Chia từ khóa</h2>
      <span class="muted">${i + 1}/${n}</span>
      <button class="back" data-act="spy.quit">✕</button>
    </div>
    <div class="progress"><i style="width:${(i / n) * 100}%"></i></div>
    <div class="secret">${body}</div>
    ${sg.shown
      ? `<button class="btn ghost" data-act="spy.hide">Đã nhớ, ẩn đi</button>`
      : `<button class="btn" data-act="spy.show">Xem từ khóa</button>`}`;
};

views['spy.discuss'] = () => {
  const order = spyOrder();
  const outs = sg.roles.map((_, i) => i).filter((i) => !sg.alive[i]);
  const spies = spyAlive('spy');
  const whites = spyAlive('white');
  const hidden = [spies && `${spies} gián điệp`, whites && `${whites} mũ trắng`].filter(Boolean).join(', ');
  return `
    <div class="topbar">
      <h2>Vòng ${sg.round} · Mô tả</h2>
      <button class="back" data-act="spy.quit">✕</button>
    </div>
    <div class="card stack">
      <p>Lần lượt mỗi người mô tả từ của mình bằng <b>một từ hoặc một câu ngắn</b>, không nói thẳng từ khóa.</p>
      <p class="small muted">Còn ẩn nấp: <b>${hidden}</b></p>
    </div>
    <div class="pgrid grow">
      ${order.map((i, k) => playerCard(sg.names[i], {
        seat: k + 1,
        cls: k === 0 ? 'first' : '',
        extra: k === 0 ? '<span class="tag first">Nói trước</span>' : '',
      })).join('')}
      ${outs.map((i) => playerCard(sg.names[i], { cls: 'out', extra: spyTag(sg.roles[i]) })).join('')}
    </div>
    <button class="btn" data-act="spy.tovote">🗳️ Bỏ phiếu</button>
    <button class="btn ghost" data-act="spy.peek">👁️ Quên từ? Xem lại</button>`;
};

views['spy.vote'] = () => `
  <div class="topbar">
    <button class="back" data-act="go" data-view="spy.discuss">←</button>
    <h2>Ai bị loại?</h2>
  </div>
  <div class="card"><p>Cả nhóm đếm 3-2-1 rồi cùng chỉ tay. Chọn người nhận nhiều phiếu nhất.</p></div>
  <div class="pgrid grow">
    ${sg.roles.map((_, i) => (sg.alive[i]
      ? playerCard(sg.names[i], { seat: i + 1, cls: sg.sel === i ? 'sel' : '', act: 'spy.select', i })
      : '')).join('')}
  </div>
  <button class="btn" data-act="spy.eliminate" ${sg.sel === null ? 'disabled' : ''}>
    ${sg.sel === null ? 'Chọn một người' : `Loại ${esc(sg.names[sg.sel])}`}
  </button>`;

views['spy.reveal'] = () => {
  const i = sg.out;
  const role = sg.roles[i];
  const canGuess = role === 'white' && !sg.guess;
  return `
    <div class="topbar"><h2>Kết quả bỏ phiếu</h2></div>
    <div class="secret reveal">
      <div class="emoji">${SPY_ROLES[role].emoji}</div>
      <p class="muted">${esc(sg.names[i])} là</p>
      <div class="role ${role}">${SPY_ROLES[role].label.toUpperCase()}</div>
      ${canGuess ? `
        <p class="muted">Cơ hội cuối: đoán đúng từ của phe Dân để thắng ngay!</p>
        <form class="guess" data-form="spy.guess">
          <input id="guess-input" name="guess" type="text" autocomplete="off" placeholder="Từ của phe Dân là...">
          <button class="btn">Đoán</button>
        </form>` : ''}
      ${sg.guess ? `<p>Đoán "<b>${esc(sg.guess)}</b>" là sai rồi! 😅</p>` : ''}
    </div>
    ${canGuess ? '' : `<button class="btn" data-act="spy.continue">Tiếp tục</button>`}`;
};

views['spy.end'] = () => {
  const title = {
    civ: ['🎉', 'Phe Dân thắng!', 'Đã lôi hết kẻ ẩn nấp ra ánh sáng.'],
    inf: ['🕵️', 'Phe Gián điệp thắng!', 'Kẻ ẩn nấp đã trụ lại đến cuối cùng.'],
    white: ['🎩', 'Mũ trắng thắng!', `${esc(sg.names[sg.winnerIdx ?? 0])} đã đoán trúng từ khóa.`],
  }[sg.winner];
  return `
    <div class="center stack">
      <div style="font-size:4rem;line-height:1">${title[0]}</div>
      <h2>${title[1]}</h2>
      <p class="muted">${title[2]}</p>
    </div>
    <div class="words">
      <div class="card"><span class="muted small">Từ của Dân</span><b style="color:var(--civ)">${esc(sg.civWord)}</b></div>
      <div class="card"><span class="muted small">Từ của Gián điệp</span><b style="color:var(--spy)">${esc(sg.spyWord)}</b></div>
    </div>
    <div class="pgrid grow">
      ${sg.roles.map((role, i) => playerCard(sg.names[i], {
        seat: i + 1,
        extra: `${spyTag(role)}<span class="score">${pointsOf('spy', sg.names[i])} điểm</span>`,
      })).join('')}
    </div>
    <button class="btn" data-act="spy.start">Ván mới</button>
    <button class="btn ghost" data-act="go" data-view="spy.setup">Đổi người chơi / thiết lập</button>
    <button class="btn ghost" data-act="go" data-view="home">Về trang chủ</button>`;
};

modals['spy.peek'] = () => {
  if (modal.idx === null) {
    return `
      <h2>Ai muốn xem lại từ?</h2>
      <div class="pgrid">
        ${sg.roles.map((_, i) => (sg.alive[i] ? playerCard(sg.names[i], { act: 'spy.peekwho', i }) : '')).join('')}
      </div>
      <button class="btn ghost" data-act="close">Đóng</button>`;
  }
  const word = spyWordOf(modal.idx);
  return `
    <div class="secret" style="min-height:220px">
      <p class="muted">${esc(sg.names[modal.idx])}</p>
      <div class="word">${word ? esc(word) : '🎩 MŨ TRẮNG'}</div>
    </div>
    <button class="btn" data-act="close">Ẩn đi</button>`;
};

/* ---------- Actions ---------- */

Object.assign(actions, {
  'spy.step': (el) => {
    spyCfg[el.dataset.key] += Number(el.dataset.d);
    fixSpy();
  },
  'spy.cat': (el) => {
    const id = el.dataset.id;
    const on = spyCfg.cats.includes(id);
    if (on && spyCfg.cats.length === 1) return;
    spyCfg.cats = on ? spyCfg.cats.filter((c) => c !== id) : [...spyCfg.cats, id];
    save('dmi.spy', spyCfg);
  },
  'spy.allcats': () => {
    spyCfg.cats = [...SPY_CATS];
    save('dmi.spy', spyCfg);
  },
  'spy.start': () => spyNewGame(),
  'spy.quit': () =>
    (modal = {
      type: 'confirm',
      title: 'Thoát ván đang chơi?',
      text: 'Ván này sẽ bị hủy và không tính điểm.',
      yes: 'Thoát ván',
      act: 'spy.quitnow',
    }),
  'spy.quitnow': () => {
    modal = null;
    sg = null;
    go('spy.setup');
  },
  'spy.show': () => (sg.shown = true),
  'spy.hide': () => {
    sg.shown = false;
    if (++sg.dealIdx >= sg.roles.length) go('spy.discuss');
  },
  'spy.peek': () => (modal = { type: 'spy.peek', idx: null }),
  'spy.peekwho': (el) => (modal.idx = Number(el.dataset.i)),
  'spy.tovote': () => {
    sg.sel = null;
    go('spy.vote');
  },
  'spy.select': (el) => (sg.sel = Number(el.dataset.i)),
  'spy.eliminate': () => {
    sg.out = sg.sel;
    sg.alive[sg.out] = false;
    sg.sel = null;
    sg.guess = null;
    go('spy.reveal');
  },
  'spy.continue': () => {
    const winner = spyCheckWin();
    if (winner) return spyFinish(winner);
    sg.round++;
    go('spy.discuss');
  },
});

forms['spy.guess'] = (form) => {
  const text = form.elements.guess.value.trim();
  if (!text) return;
  if (spyNorm(text) === spyNorm(sg.civWord)) spyFinish('white', sg.out);
  else sg.guess = text;
};

  name: 'Gián Điệp',
  icon: '🕵️',
  desc: 'Ai đang giữ từ khóa khác với mọi người?',
  meta: `${SPY_MIN}–${MAX_PLAYERS} người · ${SPY_TOTAL} cặp từ khóa`,
  setup: 'spy.setup',
  rules: () => `
    <h2>Luật chơi Gián Điệp</h2>
    <div class="rules">
      <ul>
        <li>Mỗi người bí mật nhận một từ khóa. <b>Dân thường</b> có chung một từ, <b>Gián điệp</b> nhận một từ na ná, còn <b>Mũ trắng</b> không có từ nào.</li>
        <li>Không ai biết mình thuộc phe nào (trừ Mũ trắng), hãy suy luận qua lời mô tả của người khác.</li>
        <li>Mỗi vòng, từng người mô tả từ của mình bằng một từ hoặc một câu ngắn. Đừng lộ quá rõ, cũng đừng mơ hồ quá!</li>
        <li>Sau mỗi vòng, cả nhóm bỏ phiếu loại một người và vai của người đó được lật.</li>
        <li>Mũ trắng bị loại được đoán từ của phe Dân, đoán đúng là thắng ngay.</li>
        <li><b>Phe Dân thắng</b> khi loại hết Gián điệp và Mũ trắng. <b>Phe Gián điệp thắng</b> khi chỉ còn lại 1 Dân thường.</li>
        <li>Điểm: Dân thắng +${SPY_POINTS.civ}, Gián điệp thắng +${SPY_POINTS.spy}, Mũ trắng thắng +${SPY_POINTS.white}.</li>
      </ul>
    </div>`,
});

</script>
<script>
// Ma Sói: mỗi người dùng điện thoại riêng, cùng vào một phòng có mã 4 số (API /api/boardgame/rooms).
// Điện thoại của chủ phòng là quản trò: đọc lời dẫn, gọi lần lượt từng vai thức dậy theo timeline của đêm, xử lý đêm và
// ghi kết quả bỏ phiếu ban ngày. Vai được gọi hành động trên máy của mình và ghi lựa chọn vào phần của mình (nhiều người
// không ghi đè nhau); vai đã chết vẫn được gọi và chờ như thật để không ai biết vai đó đã chết.
// Thiếu người thì chủ phòng thêm bot: bot chọn ngẫu nhiên ngay đầu đêm và không được tính điểm.
// Mỗi máy hỏi máy chủ khoảng 1,5 giây một lần. Vai nằm chung trong dữ liệu phòng, mỗi máy chỉ hiện vai của mình:
// đủ cho chơi vui trong team, không chặn được người cố tình mở công cụ lập trình của trình duyệt để xem.
const WW_MIN = 5;
// img: tranh minh hoạ của vai (roles/<vai>.svg); không có ảnh thì hiện emoji
const WW_ROLES = {
  wolf: { label: 'Ma Sói', emoji: '🐺', img: 'roles/wolf.svg', tag: 'wolf', desc: 'Mỗi đêm cùng bầy chọn cắn một người' },
  seer: { label: 'Tiên tri', emoji: '🔮', img: 'roles/seer.svg', tag: 'special', desc: 'Mỗi đêm soi một người có phải Sói không' },
  guard: { label: 'Bảo vệ', emoji: '🛡️', img: 'roles/guard.svg', tag: 'special', desc: 'Mỗi đêm bảo vệ một người, không lặp lại 2 đêm liền' },
  witch: { label: 'Phù thủy', emoji: '🧪', img: 'roles/witch.svg', tag: 'special', desc: 'Có 1 thuốc cứu và 1 thuốc độc cho cả ván' },
  hunter: { label: 'Thợ săn', emoji: '🏹', img: 'roles/hunter.svg', tag: 'special', desc: 'Khi chết được bắn một người đi cùng' },
  villager: { label: 'Dân làng', emoji: '🧑‍🌾', img: 'roles/villager.svg', tag: 'villager', desc: 'Không có chức năng, tìm Sói bằng suy luận' },
};
const WW_SPECIALS = ['seer', 'guard', 'witch', 'hunter'];
const WW_POINTS = { village: 2, wolf: 6 };
// Thứ tự quản trò gọi vai trong đêm; Phù thủy luôn sau Sói để biết ai bị cắn
const WW_CALLS = ['guard', 'wolf', 'seer', 'witch'];
// Mỗi lượt gọi vai ban đêm và lượt bỏ phiếu có 30 giây; hết giờ thì quản trò sang lượt kế
const WW_TIMES = { turn: 30 * 1000 };

// Lời dẫn của quản trò (voice/*.mp3, đoạn cắt từ file dài nằm trong voice/cuts/). Chỉ giữ câu khớp với cách chơi bằng
// điện thoại: không nhắc thẻ bài hay lật bài, không nhắc luật mà máy đã tự chặn, không kể chuyện dài mỗi đêm.
const WW_VOICE = {
  // Giữ bí mật nhé · Ván chơi bắt đầu · Đêm đầu tiên · Màn đêm buông xuống ngôi làng · Cả làng đi ngủ · Tất cả nhắm mắt lại
  firstNight: ['voice_08', 'voice_09', 'voice_10', 'voice_12', 'voice_13', 'voice_14'],
  nights: ['voice_12', 'voice_13', 'voice_14'],
  calls: {
    guard: { wake: ['voice_24', 'voice_25'], sleep: ['voice_27'] },
    wolf: { wake: ['voice_28', 'voice_30'], sleep: ['voice_31'] },
    seer: { wake: ['voice_32', 'voice_33'], sleep: ['voice_34'] },
    witch: { wake: ['voice_35'], heal: ['voice_36'], poison: ['voice_38'], sleep: ['voice_39'] },
  },
  dawn: ['voice_41'],
  deaths: [['voice_43'], ['voice_45'], ['voice_48']],
  hanged: ['cuts/da-quyet-dinh'],
  noHang: ['cuts/khong-treo'],
  hunter: ['voice_57', 'cuts/tho-san'],
  shot: ['cuts/phang'],
  // Bây giờ là lúc cả làng ngồi bàn… · Còn một phút nữa… · Hết giờ thảo luận!
  talk: ['cuts/thao-luan'],
  oneMin: ['cuts/con-1-phut'],
  timeUp: ['cuts/het-gio'],
  // Kết thúc ván chỉ nói bên nào thắng
  village: ['cuts/dan-lang-thang'],
  wolf: ['voice_61'],
};

// talk: số phút thảo luận ban ngày trước khi bỏ phiếu
let wwCfg = { wolves: 0, seer: true, guard: true, witch: false, hunter: false, reveal: true, talk: 3, ...load('dmi.ww', {}) };
// Giọng quản trò bật/tắt trên từng máy (chỉ máy chủ phòng đọc)
let wwVoiceOn = load('dmi.voice', true);

/* ---------- Giọng quản trò ---------- */

const wwAudio = new Audio();
let wwQueue = [];
let wwDone = null;

// Đọc lần lượt các đoạn (ngắt đoạn đang đọc dở), đọc xong hoặc khi tắt giọng thì chạy done
function wwSay(clips, done = null) {
  wwQueue = wwVoiceOn ? [clips].flat(Infinity) : [];
  wwDone = done;
  wwAudio.pause();
  wwSayNext();
}

function wwSayNext() {
  const clip = wwQueue.shift();
  if (clip) {
    wwAudio.src = `voice/${clip}.mp3`;
    // Trình duyệt chặn phát tự động thì bỏ qua đoạn đó để đêm không bị kẹt
    wwAudio.play().catch((e) => e.name === 'NotAllowedError' && wwSayNext());
    return;
  }
  const done = wwDone;
  wwDone = null;
  done?.();
}

wwAudio.addEventListener('ended', wwSayNext);
wwAudio.addEventListener('error', wwSayNext);

/* ---------- Luật ---------- */

const wwMaxWolves = (n) => Math.floor((n - 1) / 2);
const wwSeats = (g) => g.roles.map((_, i) => i);
const wwAlive = (g) => wwSeats(g).filter((i) => g.alive[i]);
const wwIsWolf = (g, i) => g.roles[i] === 'wolf';

function fixWW() {
  if (!wwCfg.wolves) wwCfg.wolves = Math.max(1, Math.floor(seatCount() / 4));
  save('dmi.ww', wwCfg);
}

// Số người tối thiểu cho thiết lập hiện tại: đủ ghế cho các vai, và Sói ít hơn số còn lại
const wwNeed = () =>
  Math.max(WW_MIN, 2 * wwCfg.wolves + 1, wwCfg.wolves + WW_SPECIALS.filter((r) => wwCfg[r]).length);

function wwDeal(n) {
  fixWW();
  const specials = WW_SPECIALS.filter((r) => wwCfg[r]);
  return shuffle([
    ...Array(wwCfg.wolves).fill('wolf'),
    ...specials,
    ...Array(n - wwCfg.wolves - specials.length).fill('villager'),
  ]);
}

function wwTargets(g, i) {
  const role = g.roles[i];
  if (role === 'wolf') return wwAlive(g).filter((k) => !wwIsWolf(g, k));
  if (role === 'guard') return wwAlive(g).filter((k) => k !== g.lastGuard);
  if (role === 'witch') return g.poisonUsed ? [] : wwAlive(g).filter((k) => k !== i);
  return wwAlive(g).filter((k) => k !== i);
}

// Nạn nhân của bầy sói: người được chọn nhiều nhất; nếu hòa, Sói chọn sau cùng quyết định
function wwVictim(votes) {
  if (!votes.length) return null;
  const tally = {};
  votes.forEach((t) => (tally[t] = (tally[t] || 0) + 1));
  const top = Math.max(...Object.values(tally));
  const tied = Object.keys(tally).filter((t) => tally[t] === top).map(Number);
  const last = votes[votes.length - 1];
  return tied.includes(last) ? last : tied[0];
}

function wwKill(g, i) {
  g.alive[i] = false;
  if (g.reveal) g.shown[i] = true;
  if (g.roles[i] === 'hunter' && !g.hunterShot) {
    g.hunterPending = i;
    g.shown[i] = true;
  }
}

function wwCheckWin(g) {
  const wolves = wwAlive(g).filter((i) => wwIsWolf(g, i)).length;
  if (wolves === 0) return 'village';
  if (wolves >= wwAlive(g).length - wolves) return 'wolf';
  return null;
}

/* ---------- Thành phần giao diện ---------- */

const wwTag = (role) => `<span class="tag ${WW_ROLES[role].tag}">${WW_ROLES[role].label}</span>`;
// Ảnh minh hoạ của vai, hoặc emoji khi chưa có ảnh
const wwArt = (role, cls = '') =>
  WW_ROLES[role].img
    ? `<img class="role-art ${cls}" src="${WW_ROLES[role].img}" alt="${WW_ROLES[role].label}">`
    : `<div class="role-art emoji ${cls}">${WW_ROLES[role].emoji}</div>`;
const wwSwitch = (key, on, act = 'ww.toggle') => `
  <button class="switch ${on ? 'on' : ''}" data-act="${act}" data-key="${key}" aria-pressed="${on}">${on ? 'Bật' : 'Tắt'}</button>`;

// Thẻ chỉnh số vai, lật vai, bot và giọng quản trò (phòng chờ, chỉ chủ phòng thấy)
function wwCfgCards() {
  fixWW();
  const n = seatCount();
  const specials = WW_SPECIALS.filter((r) => wwCfg[r]).length;
  const villagers = Math.max(0, n - wwCfg.wolves - specials);
  const humans = mpMembers().length;
  const roleRow = (role, control) => `
    <div class="row between">
      <span class="row"><span class="role-mini">${wwArt(role)}</span><span><b>${WW_ROLES[role].label}</b><br><span class="muted small">${WW_ROLES[role].desc}</span></span></span>
      ${control}
    </div>`;
  return `
    <div class="card stack">
      ${roleRow('wolf', stepper('ww.step', 'wolves', wwCfg.wolves, 1, wwMaxWolves(MAX_PLAYERS)))}
      ${WW_SPECIALS.map((role) => roleRow(role, wwSwitch(role, wwCfg[role]))).join('')}
      ${roleRow('villager', `<b>${villagers}</b>`)}
    </div>
    <div class="card stack">
      <div class="row between">
        <span><b>🤖 Bot</b><br><span class="muted small">Thêm cho đủ người. Bot tự chọn ban đêm, không biết nói và không được tính điểm.</span></span>
        ${stepper('mp.bot', 'bots', mpBots().length, 0, MAX_PLAYERS - humans)}
      </div>
      <div class="row between">
        <span><b>⏱️ Thảo luận ban ngày</b><br><span class="muted small">${wwCfg.talk} phút, hết giờ thì cả làng bỏ phiếu trên máy (30 giây)</span></span>
        ${stepper('ww.num', 'talk', wwCfg.talk, 1, 10)}
      </div>
      <div class="row between">
        <span><b>Lật vai khi chết</b><br><span class="muted small">Công khai vai của người bị loại</span></span>
        ${wwSwitch('reveal', wwCfg.reveal)}
      </div>
      <div class="row between">
        <span><b>🔊 Giọng quản trò</b><br><span class="muted small">Máy này đọc lời dẫn và gọi từng vai; nên đặt máy giữa bàn</span></span>
        ${wwSwitch('voice', wwVoiceOn, 'mww.voice')}
      </div>
    </div>`;
}

/* ---------- Phòng ---------- */

let openRooms = [];
let roomsTimer = null;
let mp = null; // phòng đang ở: { id, room, players, v, join, ready, key, timer }
let mpName = load('dmi.me', '');
let mpMsg = '';
// Lựa chọn tạm trên máy này, xóa khi ván sang bước hoặc lượt mới
let mpSel = null;
let mpPick = null;
let mpHeal = false;
let mpShow = false;
let mpResolved = '';
// Các lần ghi chạy lần lượt; trong lúc ghi, kết quả hỏi phòng (có thể đã cũ) bị bỏ qua
let mpWriting = Promise.resolve();
let mpBusy = 0;
let mpSeq = 0;

// Người thật trong phòng theo thứ tự vào phòng, và các bot chủ phòng đã thêm
const mpMembers = () => (mp ? Object.entries(mp.players).sort((a, b) => a[1].at - b[1].at) : []);
const mpBots = () => mp?.room?.bots || [];
const mpCount = () => mpMembers().length + mpBots().length;
const mpJoined = () => mpMembers().some(([uid]) => uid === myId);
const mpIsHost = () => mp?.room?.host === myId;
const mpNames = () => mp.room.seats.map((s) => s.name);
const mpSeat = () => mp.room.seats.findIndex((s) => s.uid === myId);
const mpSetName = (name) => {
  mpName = name;
  save('dmi.me', name);
};
const mpFail = (e) => {
  mpMsg = e?.status && e.status < 500 ? e.message : 'Không lưu được thao tác. Kiểm tra mạng rồi thử lại.';
  renderIfIdle();
};

// Danh sách phòng, hỏi lại mỗi 4 giây khi đang ở màn chọn phòng
async function loadRooms() {
  try {
    openRooms = (await api('GET', '/rooms')).rooms;
  } catch {}
  if (view !== 'mp.home') return;
  renderIfIdle();
  clearTimeout(roomsTimer);
  roomsTimer = setTimeout(loadRooms, 4000);
}

// Đang ở trong phòng thì vào thẳng phòng
ENTER['mp.home'] = () => {
  if (mp) view = 'mp.room';
  else loadRooms();
};

// Tải lại trang giữa ván thì vào lại phòng cũ
async function mpResume() {
  const last = load('dmi.room', null);
  if (!last || mp) return;
  try {
    openRooms = (await api('GET', '/rooms')).rooms;
  } catch {}
  if (openRooms.some((r) => r.id === last)) mpEnter(last);
  else save('dmi.room', null);
}

async function mpCreate() {
  for (let k = 0; k < 5; k++) {
    const id = String(1000 + rand(9000));
    try {
      await api('PUT', `/rooms/${id}`, { create: true, state: { host: myId, hostName: mpName, phase: 'lobby', seats: [], bots: [], g: null } });
      return mpEnter(id, true);
    } catch (e) {
      // Mã đang có phòng khác dùng thì thử mã khác
      if (e.status !== 409) return mpFail(e);
    }
  }
}

function mpEnter(id, join = false) {
  mpStop();
  const state = (mp = { id, room: null, players: {}, v: -1, join, ready: false, key: '' });
  save('dmi.room', id);
  mpMsg = '';
  go('mp.room');
  renderIfIdle();
  mpPoll(state);
}

function mpStop() {
  clearTimeout(mp?.timer);
  wwSay([]);
  mp = null;
  save('dmi.room', null);
}

async function mpPoll(state) {
  if (mp !== state) return;
  const seq = mpSeq;
  try {
    const r = await api('GET', `/rooms/${state.id}?v=${state.v}`);
    if (mp === state && !r.same && !mpBusy && seq === mpSeq) {
      Object.assign(state, { v: r.v, room: r.room, players: r.players, ready: true });
      mpChanged();
    }
  } catch (e) {
    if (mp === state && e.status === 404) {
      Object.assign(state, { room: null, ready: true });
      mpChanged();
    }
  }
  if (mp === state) state.timer = setTimeout(() => mpPoll(state), document.hidden ? 5000 : 1500);
}

function mpChanged() {
  if (!mp.ready) return;
  const room = mp.room;
  if (room && mp.join) {
    mp.join = false;
    if (!mpJoined()) mpJoin();
  }
  const g = room?.g;
  const key = g ? `${g.id}:${g.night}:${g.step}:${g.turn}` : room?.phase;
  if (key !== mp.key) {
    mp.key = key;
    mpSel = null;
    mpPick = null;
    mpHeal = false;
    mpShow = false;
  }
  mwwNarrate();
  renderIfIdle();
}

function mpJoin() {
  const taken = mpMembers().some(([uid, p]) => uid !== myId && p.name.toLowerCase() === mpName.toLowerCase());
  if (taken) return void (mpMsg = `Đã có người tên ${mpName} trong phòng. Chọn tên khác rồi bấm Vào phòng.`);
  mpMsg = '';
  mpWritePlayer({ name: mpName, at: Date.now(), act: null });
}

function mpSend(write) {
  mpBusy++;
  mpSeq++;
  mpWriting = mpWriting
    .then(write)
    .catch(mpFail)
    .finally(() => {
      mpBusy--;
      mpSeq++;
    });
}

// Mỗi máy chỉ ghi phần của mình; hiện ngay trên máy này rồi ghi lần lượt
function mpWritePlayer(data) {
  mp.players = { ...mp.players, [myId]: data };
  const id = mp.id;
  mpSend(() => api('PUT', `/rooms/${id}/players/me`, { data }));
}

// Đổi trạng thái phòng bằng fn trên một bản sao, rồi ghi cả phòng
function mpUpdate(fn) {
  const room = structuredClone(mp.room);
  fn(room);
  mp.room = room;
  const id = mp.id;
  mpSend(() => api('PUT', `/rooms/${id}`, { state: room }));
}

/* ---------- Ván Ma Sói trong phòng ---------- */

// seats: [{ uid, name, bot? }], theo thứ tự ghế
function mwwNew(seats) {
  const n = seats.length;
  const roles = wwDeal(n);
  const g = {
    id: Date.now(),
    roles,
    calls: WW_CALLS.filter((role) => roles.includes(role)),
    reveal: wwCfg.reveal,
    talk: wwCfg.talk * 60 * 1000,
    // Giờ hết lượt hiện tại (lượt gọi vai, thảo luận, bỏ phiếu), theo đồng hồ máy chủ phòng
    deadline: null,
    alive: Array(n).fill(true),
    shown: Array(n).fill(false),
    night: 0,
    lastGuard: null,
    healUsed: false,
    poisonUsed: false,
    hunterShot: false,
    hunterPending: null,
    deaths: [],
    notes: [],
    out: null,
    back: null,
    winner: null,
  };
  mwwNight(g, seats);
  return g;
}

// Sang đêm mới: quản trò đọc lời dẫn (turn -1) rồi gọi từng vai; bot chọn luôn từ đầu đêm
function mwwNight(g, seats, prelude = null) {
  g.night++;
  g.step = 'night';
  g.turn = -1;
  g.prelude = prelude;
  g.deadline = null;
  g.deaths = [];
  g.notes = [];
  g.out = null;
  g.ballots = null;
  g.accused = null;
  g.spared = null;
  g.verdicts = null;
  g.botActs = mwwBotActs(g, seats);
}

// Bắt đầu giờ thảo luận ban ngày, trừ khi Thợ săn còn chờ bắn hoặc ván đã ngã ngũ
function mwwTalk(g) {
  g.deadline = g.hunterPending === null && !wwCheckWin(g) ? Date.now() + g.talk : null;
}

// Bot bỏ phiếu ngẫu nhiên một người còn sống khác mình (Sói bot không treo Sói)
function mwwBotVotes(g, seats) {
  const votes = {};
  seats.forEach((s, i) => {
    if (!s.bot || !g.alive[i]) return;
    const pool = wwAlive(g).filter((k) => k !== i && !(wwIsWolf(g, i) && wwIsWolf(g, k)));
    votes[i] = pool.length ? pool[rand(pool.length)] : -1;
  });
  return votes;
}

// Phiếu hôm nay của từng ghế còn sống: số ghế bị chọn, -1 là bỏ qua, undefined là chưa bỏ phiếu
function mwwVotes() {
  const g = mp.room.g;
  return mp.room.seats.map((s, i) => {
    if (!g.alive[i]) return undefined;
    if (s.bot) return g.botVotes?.[i];
    const vote = mp.players[s.uid]?.vote;
    return vote?.game === g.id && vote.night === g.night ? vote.target : undefined;
  });
}

// Chủ phòng mở bỏ phiếu: 30 giây, bot bỏ phiếu ngay
function mwwStartVote() {
  if (mp.room.g.step !== 'day') return;
  mpUpdate((r) => {
    r.g.step = 'vote';
    r.g.deadline = Date.now() + WW_TIMES.turn;
    r.g.botVotes = mwwBotVotes(r.g, r.seats);
  });
  mwwNarrate();
}

// Phán xử của từng ghế còn sống (trừ người trên giàn): true treo, false tha, undefined chưa chọn
function mwwVerdicts() {
  const g = mp.room.g;
  return mp.room.seats.map((s, i) => {
    if (!g.alive[i] || i === g.accused) return undefined;
    if (s.bot) return g.botVerdicts?.[i];
    const verdict = mp.players[s.uid]?.verdict;
    return verdict?.game === g.id && verdict.night === g.night ? verdict.kill : undefined;
  });
}

// Bot phán xử: Sói bot tha đồng bọn và treo người khác, bot dân làng nghiêng về treo
function mwwBotVerdicts(g, seats) {
  const verdicts = {};
  seats.forEach((s, i) => {
    if (!s.bot || !g.alive[i] || i === g.accused) return;
    verdicts[i] = wwIsWolf(g, i) ? !wwIsWolf(g, g.accused) : Math.random() < 0.6;
  });
  return verdicts;
}

// Kết thúc phán xử (một lần mỗi ngày): Treo nhiều hơn Tha thì bị treo cổ thành hồn ma; hòa hoặc Tha nhiều hơn thì
// được tha, chơi tiếp
function mwwJudge() {
  const g = mp.room.g;
  const key = `${g.id}:${g.night}:trial`;
  if (g.step !== 'trial' || mpResolved === key) return;
  mpResolved = key;
  const verdicts = mwwVerdicts();
  mpUpdate((r) => {
    const g = r.g;
    const kill = verdicts.filter((v) => v === true).length;
    const save = verdicts.filter((v) => v === false).length;
    g.verdicts = verdicts.map((v) => v ?? null);
    if (kill > save) {
      g.out = g.accused;
      wwKill(g, g.out);
    } else {
      g.spared = g.accused;
    }
    g.deadline = null;
    g.step = 'reveal';
  });
  mwwNarrate();
}

// Kiểm phiếu (một lần mỗi ngày): người nhiều phiếu nhất lên giàn treo cổ chờ phán xử; hòa hoặc không ai bị chọn thì
// không ai lên giàn
function mwwTally() {
  const g = mp.room.g;
  const key = `${g.id}:${g.night}:vote`;
  if (g.step !== 'vote' || mpResolved === key) return;
  mpResolved = key;
  const votes = mwwVotes();
  mpUpdate((r) => {
    const g = r.g;
    const count = {};
    votes.forEach((t) => t >= 0 && (count[t] = (count[t] || 0) + 1));
    const top = Math.max(0, ...Object.values(count));
    const leaders = Object.keys(count).filter((t) => count[t] === top).map(Number);
    g.ballots = votes.map((t) => t ?? null);
    g.notes = [];
    if (top > 0 && leaders.length === 1) {
      g.accused = leaders[0];
      g.step = 'trial';
      g.deadline = Date.now() + WW_TIMES.turn;
      g.botVerdicts = mwwBotVerdicts(g, r.seats);
    } else {
      g.out = null;
      g.deadline = null;
      g.step = 'reveal';
    }
  });
  mwwNarrate();
}

// Bot: Sói cắn ngẫu nhiên một người không phải Sói, Bảo vệ che ngẫu nhiên, Phù thủy không dùng thuốc.
// Ghi giờ sớm hơn mọi người thật, nên khi hòa phiếu Sói người thật quyết định.
function mwwBotActs(g, seats) {
  const acts = {};
  seats.forEach((s, i) => {
    if (!s.bot || !g.alive[i]) return;
    const targets = g.roles[i] === 'witch' ? [] : wwTargets(g, i);
    acts[i] = { game: g.id, night: g.night, pick: targets.length ? targets[rand(targets.length)] : null, heal: false, at: 0 };
  });
  return acts;
}

// Lựa chọn đêm nay của từng ghế, null nếu người đó chưa chọn
function mwwActs() {
  const g = mp.room.g;
  return mp.room.seats.map((s, i) => {
    if (s.bot) return g.botActs?.[i] ?? null;
    const act = mp.players[s.uid]?.act;
    return act?.game === g.id && act.night === g.night ? act : null;
  });
}

const mwwVictim = (g, acts) =>
  wwVictim(acts
    .filter((a, i) => a && g.alive[i] && g.roles[i] === 'wolf' && a.pick !== null)
    .sort((a, b) => a.at - b.at)
    .map((a) => a.pick));

// Những ghế còn sống giữ vai đang được gọi
const mwwHolders = (g, role) => wwAlive(g).filter((i) => g.roles[i] === role);
const mwwTurnDone = (g, acts) => mwwHolders(g, g.calls[g.turn]).every((i) => acts[i]);

// Xử lý đêm (một lần mỗi đêm) rồi sang ngày
function mwwResolve() {
  const g = mp.room.g;
  const acts = mwwActs();
  const night = `${g.id}:${g.night}`;
  if (mpResolved === night) return;
  mpResolved = night;
  mpUpdate((r) => {
    const g = r.g;
    const victim = mwwVictim(g, acts);
    const actOf = (role) => acts.find((a, i) => a && g.alive[i] && g.roles[i] === role);
    const guard = actOf('guard')?.pick ?? null;
    const witch = actOf('witch');
    const heal = Boolean(witch?.heal) && victim !== null && !g.healUsed;
    const poison = g.poisonUsed ? null : witch?.pick ?? null;
    g.healUsed ||= heal;
    g.poisonUsed ||= poison !== null;
    const dead = [];
    if (victim !== null && victim !== guard && !heal) dead.push(victim);
    if (poison !== null && !dead.includes(poison)) dead.push(poison);
    g.lastGuard = guard;
    dead.forEach((i) => wwKill(g, i));
    g.deaths = shuffle(dead);
    g.notes = [];
    g.step = 'day';
    mwwTalk(g);
  });
}

function mwwFinish(r, winner) {
  const g = r.g;
  g.winner = winner;
  g.step = 'end';
  // Bot không được tính điểm
  const results = g.roles
    .map((role, i) => {
      const win = (role === 'wolf') === (winner === 'wolf');
      return { name: r.seats[i].name, pts: win ? WW_POINTS[winner] : 0, win, bot: r.seats[i].bot };
    })
    .filter((x) => !x.bot)
    .map(({ name, pts, win }) => ({ name, pts, win }));
  recordGame('ww', `${winner === 'wolf' ? 'Ma Sói thắng' : 'Dân làng thắng'} sau ${g.night} đêm`, results);
}

function mwwShoot(g, target) {
  g.notes.push({ hunter: g.hunterPending, target });
  g.hunterShot = true;
  g.hunterPending = null;
  g.deadline = null;
  wwKill(g, target);
}

// Sau màn ban ngày hoặc sau khi treo cổ: Thợ săn bắn (bot thì bắn ngẫu nhiên ngay), kết thúc ván, hoặc sang đêm mới
function mwwAfter(r) {
  const g = r.g;
  if (g.hunterPending !== null) {
    if (!r.seats[g.hunterPending].bot) {
      g.back = g.step;
      g.step = 'hunter';
      return;
    }
    const targets = wwAlive(g);
    mwwShoot(g, targets[rand(targets.length)]);
    if (g.step === 'day') mwwTalk(g);
    return;
  }
  const winner = wwCheckWin(g);
  if (winner) mwwFinish(r, winner);
  else if (g.step === 'reveal') mwwNight(g, r.seats);
}

// Nhãn nút chính của chủ phòng tùy theo việc sắp xảy ra
function mwwAfterLabel(g, normal) {
  if (g.hunterPending !== null) return '🏹 Thợ săn ra tay';
  return wwCheckWin(g) ? 'Xem kết quả' : normal;
}

/* ---------- Quản trò (chỉ máy chủ phòng) ---------- */

let nar = { key: '', phase: '', waited: false };
const narSpoken = new Set();

function mwwWakeClips(g, role, acts) {
  const c = WW_VOICE.calls[role];
  if (role === 'witch') return [c.wake, mwwVictim(g, acts) !== null && !g.healUsed ? c.heal : [], g.poisonUsed ? [] : c.poison];
  return c.wake;
}

// Gọi mỗi khi phòng đổi: đọc lời dẫn và đưa đêm qua từng lượt
function mwwNarrate() {
  const g = mp?.room?.g;
  if (!g || !mpIsHost() || mp.room.phase !== 'play') return;
  if (g.step !== 'night') {
    // Ngoài đêm: mỗi bước, mỗi phát súng của Thợ săn đọc một lần
    const clips = [];
    const shot = `${g.id}:${g.night}:shot:${g.notes.length}`;
    if (g.notes.length && !narSpoken.has(shot)) clips.push(WW_VOICE.shot);
    narSpoken.add(shot);
    const step = `${g.id}:${g.night}:${g.step}`;
    if (!narSpoken.has(step)) {
      narSpoken.add(step);
      if (g.step === 'day') clips.push(WW_VOICE.dawn, WW_VOICE.deaths[Math.min(g.deaths.length, 2)]);
      if (g.step === 'vote') clips.push(WW_VOICE.timeUp);
      if (g.step === 'reveal') clips.push(g.out === null ? WW_VOICE.noHang : WW_VOICE.hanged);
      if (g.step === 'hunter') clips.push(WW_VOICE.hunter);
      if (g.step === 'end') clips.push(WW_VOICE[g.winner]);
    }
    // Mời thảo luận khi giờ thảo luận bắt đầu (có thể sau khi Thợ săn bắn xong)
    const talk = `${g.id}:${g.night}:talk`;
    if (g.step === 'day' && g.deadline && !narSpoken.has(talk)) {
      narSpoken.add(talk);
      clips.push(WW_VOICE.talk);
    }
    if (clips.length) wwSay(clips);
    return;
  }
  const key = `${g.id}:${g.night}:${g.turn}`;
  const acts = mwwActs();
  if (nar.key !== key) {
    nar = { key, phase: 'speak', waited: false };
    if (g.turn < 0) {
      const intro = g.night === 1 ? WW_VOICE.firstNight : WW_VOICE.nights;
      return wwSay([WW_VOICE[g.prelude] || [], intro], () => mwwTurn(g, 0));
    }
    if (g.turn >= g.calls.length) return mwwResolve();
    const role = g.calls[g.turn];
    const people = mwwHolders(g, role).filter((i) => !mp.room.seats[i].bot);
    return wwSay(mwwWakeClips(g, role, acts), () => {
      if (nar.key !== key) return;
      nar.phase = 'wait';
      // Đọc xong lời gọi thì bắt đầu đếm 30 giây (vai đã chết cũng vậy, để không ai đoán ra)
      mpUpdate((r) => {
        r.g.deadline = Date.now() + WW_TIMES.turn;
      });
      renderIfIdle();
      // Vai đã chết hoặc chỉ có bot: vẫn chờ một lúc như có người đang chọn
      setTimeout(() => {
        if (nar.key !== key) return;
        nar.waited = true;
        mwwNarrate();
      }, people.length ? 0 : 4000 + rand(4000));
    });
  }
  if (nar.phase === 'wait' && nar.waited && mwwTurnDone(g, acts)) mwwSleep(g);
}

// Vai đang được gọi đi ngủ, rồi gọi vai tiếp theo
function mwwSleep(g) {
  nar.phase = 'sleep';
  const role = g.calls[g.turn];
  wwSay(role ? WW_VOICE.calls[role].sleep : [], () => mwwTurn(g, g.turn + 1));
}

function mwwTurn(g, turn) {
  const now = mp?.room?.g;
  if (now?.id !== g.id || now.night !== g.night || now.turn !== g.turn) return;
  mpUpdate((r) => {
    r.g.turn = turn;
    r.g.deadline = null;
  });
  mwwNarrate();
  renderIfIdle();
}

// Mỗi giây: cập nhật số giây trên các vòng đếm ngược; máy chủ phòng chuyển lượt khi hết giờ hoặc khi ai cũng đã bỏ phiếu
function mwwTick() {
  document.querySelectorAll('[data-deadline]').forEach((el) => (el.textContent = mwwClock(Number(el.dataset.deadline) - Date.now())));
  const g = mp?.room?.g;
  if (!g || !mpIsHost() || mp.room.phase !== 'play') return;
  const left = g.deadline ? g.deadline - Date.now() : Infinity;
  if (g.step === 'night' && nar.phase === 'wait' && left <= 0) mwwSleep(g);
  if (g.step === 'day' && g.deadline) {
    const warn = `${g.id}:${g.night}:oneMin`;
    if (g.talk > 60 * 1000 && left <= 60 * 1000 && !narSpoken.has(warn)) {
      narSpoken.add(warn);
      wwSay(WW_VOICE.oneMin);
    }
    if (left <= 0) mwwStartVote();
  }
  if (g.step === 'vote' && (left <= 0 || mwwVotes().every((v, i) => !g.alive[i] || v !== undefined))) mwwTally();
  if (g.step === 'trial' && (left <= 0 || mwwVerdicts().every((v, i) => !g.alive[i] || i === g.accused || v !== undefined))) mwwJudge();
}
setInterval(mwwTick, 1000);

const mwwClock = (ms) => {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : String(s);
};

// Vòng tròn đếm ngược tới deadline (tổng thời gian total). Vòng chạy bằng CSS, số giây do mwwTick cập nhật.
function mwwRing(deadline, total) {
  const left = Math.max(0, deadline - Date.now());
  return `
    <div class="ring" style="--total:${total}ms;--delay:${left - total}ms" role="timer" aria-label="Thời gian còn lại">
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" class="track"/><circle cx="22" cy="22" r="19" class="bar" pathLength="100"/></svg>
      <span data-deadline="${deadline}">${mwwClock(left)}</span>
    </div>`;
}

/* ---------- Views ---------- */

function mpBar(title) {
  const room = mp?.room;
  const hostGone = room && mpJoined() && !mpMembers().some(([uid]) => uid === room.host);
  const quit = mpIsHost() && room.phase === 'play' && room.g?.step !== 'end';
  return `
    <button class="sheet-handle" data-act="v.sheet" aria-label="Thu gọn hoặc mở bảng để nhìn làng"></button>
    <div class="topbar">
      <h2>${title}</h2>
      ${quit ? '<button class="link small" data-act="mp.quit">Hủy ván</button>' : `<span class="muted small">Phòng ${esc(mp?.id || '')}</span>`}
      <button class="back" data-act="mp.leave" aria-label="Rời phòng">✕</button>
    </div>
    ${hostGone ? '<button class="btn ghost" data-act="mp.takehost">Chủ phòng đã rời, nhận làm chủ phòng</button>' : ''}

}

function mpNamePicker() {
  const names = roster();
  const options = mpName && !names.includes(mpName) ? [mpName, ...names] : names;
  return `

        ${options.map((name) => `<option ${name === mpName ? 'selected' : ''}>${esc(name)}</option>`).join('')}
        <option value="${NEW_NAME}">＋ Tên khác…</option>
      </select>
    </label>`;
}

const mwwTag = (g, i) => (g.shown[i] ? wwTag(g.roles[i]) : '');
const mwwNotes = (g, names) =>
  g.notes
    .map(({ hunter, target }) =>
      `<p>🏹 Thợ săn <b>${esc(names[hunter])}</b> đã bắn <b>${esc(names[target])}</b>. ${mwwTag(g, target)}</p>`)
    .join('');

// Lưới người chơi; select: chủ phòng / thợ săn chọn một người còn sống
function mwwGrid(g, names, select = false) {
  return `
    <div class="pgrid grow">
      ${wwAlive(g).map((i) => playerCard(names[i], {
        seat: i + 1,

        i,
      })).join('')}
      ${select ? '' : wwSeats(g).filter((i) => !g.alive[i]).map((i) => playerCard(names[i], { seat: i + 1, cls: 'out', extra: mwwTag(g, i) })).join('')}
    </div>`;
}

// Timeline ngang của đêm: lời dẫn, từng vai theo thứ tự gọi (vòng tròn là ảnh của vai), trời sáng
function mwwTimeline(g) {
  const steps = [
    ['🌙', 'Màn đêm'],
    ...g.calls.map((role) => [`<img src="${WW_ROLES[role].img}" alt="">`, WW_ROLES[role].label]),
    ['☀️', 'Trời sáng'],
  ];
  const at = g.turn + 1;
  return `
    <div class="card">
      <ol class="timeline" aria-label="Thứ tự gọi vai đêm nay">
        ${steps.map(([icon, label], k) => `
          <li class="${k < at ? 'done' : k === at ? 'now' : ''}" ${k === at ? 'aria-current="step"' : ''}>
            <span class="dot">${k < at ? '✓' : icon}</span>${label}
          </li>`).join('')}
      </ol>
    </div>`;
}
