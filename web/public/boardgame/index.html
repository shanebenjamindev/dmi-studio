    <div class="rules">
      <ul>
        <li>Mỗi người bí mật nhận một từ khóa. <b>Dân thường</b> có chung một từ, <b>Gián điệp</b> nhận một từ na ná, còn <b>Mũ trắng</b> không có từ nào.</li>
        <li>Không ai biết mình thuộc phe nào (trừ Mũ trắng), hãy suy luận qua lời mô tả của người khác.</li>
        <li>Mỗi vòng, từng người mô tả từ của mình bằng một từ hoặc một câu ngắn. Đừng lộ quá rõ, cũng đừng mơ hồ quá!</li>
        <li>Sau mỗi vòng, cả nhóm bỏ phiếu loại một người và vai của người đó được lật.</li>
        <li>Mũ trắng bị loại được đoán từ của phe Dân, đoán đúng là thắng ngay.</li>
        <li><b>Phe Dân thắng</b> khi loại hết Gián điệp và Mũ trắng. <b>Phe Gián điệp thắng</b> khi chỉ còn lại 1 Dân thường.</li>
        <li>Điểm: Dân thắng +${SPY_POINTS.civ}, Gián điệp thắng +${SPY_POINTS.spy}, Mũ trắng thắng +${SPY_POINTS.white}.</li>
      </ul>
    </div>`,
});

</script>
<script>
// Ma Sói: mỗi người dùng điện thoại riêng, cùng vào một phòng có mã 4 số (API /api/boardgame/rooms).
// Điện thoại của chủ phòng là quản trò: đọc lời dẫn, gọi lần lượt từng vai thức dậy theo timeline của đêm, xử lý đêm và
// ghi kết quả bỏ phiếu ban ngày. Vai được gọi hành động trên máy của mình và ghi lựa chọn vào phần của mình (nhiều người
// không ghi đè nhau); vai đã chết vẫn được gọi và chờ như thật để không ai biết vai đó đã chết.
// Thiếu người thì chủ phòng thêm bot: bot chọn ngẫu nhiên ngay đầu đêm và không được tính điểm.
// Mỗi máy hỏi máy chủ khoảng 1,5 giây một lần. Vai nằm chung trong dữ liệu phòng, mỗi máy chỉ hiện vai của mình:
// đủ cho chơi vui trong team, không chặn được người cố tình mở công cụ lập trình của trình duyệt để xem.
const WW_MIN = 5;
// img: tranh minh hoạ của vai (roles/<vai>.svg); không có ảnh thì hiện emoji
const WW_ROLES = {
  wolf: { label: 'Ma Sói', emoji: '🐺', img: 'roles/wolf.svg', tag: 'wolf', desc: 'Mỗi đêm cùng bầy chọn cắn một người' },
  cursewolf: { label: 'Sói nguyền', emoji: '🌑', img: 'roles/cursewolf.svg', tag: 'wolf', desc: 'Là một con Sói; một lần mỗi ván được nguyền người bị cắn hóa thành Sói thay vì chết' },
  seer: { label: 'Tiên tri', emoji: '🔮', img: 'roles/seer.svg', tag: 'special', desc: 'Mỗi đêm soi một người có phải Sói không' },
  guard: { label: 'Bảo vệ', emoji: '🛡️', img: 'roles/guard.svg', tag: 'special', desc: 'Mỗi đêm bảo vệ một người, không lặp lại 2 đêm liền' },
  witch: { label: 'Phù thủy', emoji: '🧪', img: 'roles/witch.svg', tag: 'special', desc: 'Có 1 thuốc cứu và 1 thuốc độc cho cả ván' },
  hunter: { label: 'Thợ săn', emoji: '🏹', img: 'roles/hunter.svg', tag: 'special', desc: 'Mỗi đêm được gọi dậy, chỉ ra một người: sáng ra người đó chết' },
  cursed: { label: 'Bán sói', emoji: '🌗', img: 'roles/cursed.svg', tag: 'special', desc: 'Phe dân, Tiên tri soi ra dân; bị Sói cắn thì không chết mà hóa thành Sói' },
  villager: { label: 'Dân làng', emoji: '🧑‍🌾', img: 'roles/villager.svg', tag: 'villager', desc: 'Không có chức năng, tìm Sói bằng suy luận' },
};
const WW_SPECIALS = ['seer', 'guard', 'witch', 'hunter', 'cursed'];
const WW_POINTS = { village: 2, wolf: 6 };
// Thứ tự quản trò gọi vai trong đêm; Phù thủy luôn sau Sói để biết ai bị cắn
const WW_CALLS = ['guard', 'wolf', 'seer', 'hunter', 'witch'];
// Mỗi lượt gọi vai ban đêm và lượt bỏ phiếu có 30 giây; hết giờ thì quản trò sang lượt kế
// turn: mỗi lượt đêm, bỏ phiếu, phán xử · next: xem kết quả trước khi ván tự đi tiếp
// late: hết giờ bỏ phiếu, phán xử thì vẫn nhận phiếu thêm chừng này (máy chủ phòng hỏi phòng mỗi 1,5 giây)
// trip: chọn xong lượt đêm thì chờ chừng này để người chọn đi tới nhà kia và xem hết hoạt ảnh
// roles: đầu ván chờ mọi người xem vai tối đa chừng này rồi mới vào đêm đầu tiên
const WW_TIMES = { turn: 30 * 1000, next: 10 * 1000, ready: 20 * 1000, late: 2500, trip: 5000, roles: 30 * 1000 };

// Lời dẫn của quản trò (voice/*.mp3, đoạn cắt từ file dài nằm trong voice/cuts/). Chỉ giữ câu khớp với cách chơi bằng
// điện thoại: không nhắc thẻ bài hay lật bài, không nhắc luật mà máy đã tự chặn, không kể chuyện dài mỗi đêm.
const WW_VOICE = {
  // Giữ bí mật nhé · Ván chơi bắt đầu · Đêm đầu tiên · Màn đêm buông xuống ngôi làng · Cả làng đi ngủ · Tất cả nhắm mắt lại
  firstNight: ['voice_08', 'voice_09', 'voice_10', 'voice_12', 'voice_13', 'voice_14'],
  nights: ['voice_12', 'voice_13', 'voice_14'],
  calls: {
    guard: { wake: ['voice_24', 'voice_25'], sleep: ['voice_27'] },
    wolf: { wake: ['voice_28', 'voice_30'], sleep: ['voice_31'] },
    seer: { wake: ['voice_32', 'voice_33'], sleep: ['voice_34'] },
    witch: { wake: ['voice_35'], heal: ['voice_36'], poison: ['voice_38'], sleep: ['voice_39'] },
    // Thợ săn thức dậy, đêm nay Thợ săn muốn bắn ai? · Thợ săn đi ngủ (cắt từ voice/thosan.mp3)
    hunter: { wake: ['cuts/tho-san-thuc'], sleep: ['cuts/tho-san-ngu'] },
  },
  // Trời đã sáng (bỏ đoạn gà gáy và phần sau)
  dawn: ['cuts/troi-sang'],
  deaths: [['voice_43'], ['voice_45'], ['voice_48']],
  hanged: ['cuts/da-quyet-dinh'],
  noHang: ['cuts/khong-treo'],
  // Còn một phút nữa… · Hết giờ thảo luận! (bỏ câu mời thảo luận "Bây giờ là lúc cả làng ngồi bàn…")
  oneMin: ['cuts/con-1-phut'],
  timeUp: ['cuts/het-gio'],
  // Kết thúc ván chỉ nói bên nào thắng
  village: ['cuts/dan-lang-thang'],
  wolf: ['voice_61'],
};

// talk: số phút thảo luận ban ngày trước khi bỏ phiếu
let wwCfg = { wolves: 0, seer: true, guard: true, witch: false, hunter: false, cursed: false, cursewolf: false, reveal: true, hideVotes: false, talk: 3, ...load('dmi.ww', {}) };
// Giọng quản trò bật/tắt trên từng máy (chỉ máy chủ phòng đọc)
let wwVoiceOn = load('dmi.voice', true);
// Nhạc nền (music.js) bật/tắt trên từng máy
let wwMusicOn = load('dmi.music', true);
Music.enable(wwMusicOn);

/* ---------- Giọng quản trò ---------- */

const wwAudio = new Audio();
let wwQueue = [];
let wwDone = null;

// Đọc lần lượt các đoạn (ngắt đoạn đang đọc dở), đọc xong hoặc khi tắt giọng thì chạy done
function wwSay(clips, done = null) {
  wwQueue = wwVoiceOn ? [clips].flat(Infinity) : [];
  wwDone = done;
  wwAudio.pause();
  wwSayNext();
}

function wwSayNext() {
  const clip = wwQueue.shift();
  if (clip) {
    wwAudio.src = `voice/${clip}.mp3`;
    // Trình duyệt chặn phát tự động thì bỏ qua đoạn đó để đêm không bị kẹt
    wwAudio.play().catch((e) => e.name === 'NotAllowedError' && wwSayNext());
    return;
  }
  const done = wwDone;
  wwDone = null;
  done?.();
}

// Điện thoại chỉ cho phát tiếng sau một lần chạm: chạm đầu tiên vào trang phát thử không tiếng, để máy nào cũng sẵn sàng
// làm quản trò khi được nhận làm chủ phòng
document.addEventListener('pointerdown', () => {
  if (wwAudio.src) return;
  wwAudio.muted = true;
  wwAudio.src = 'voice/cuts/troi-sang.mp3';
  wwAudio.play().catch(() => {}).finally(() => {
    if (!wwAudio.src.endsWith('cuts/troi-sang.mp3') || wwQueue.length || wwDone) return void (wwAudio.muted = false);
    wwAudio.pause();
    wwAudio.muted = false;
  });
}, { once: true });

wwAudio.addEventListener('ended', wwSayNext);
wwAudio.addEventListener('error', wwSayNext);
// Quản trò đọc thì nhạc nền nhỏ lại
wwAudio.addEventListener('playing', () => Music.duck(!wwAudio.muted));
['pause', 'ended', 'error'].forEach((type) => wwAudio.addEventListener(type, () => Music.duck(false)));

/* ---------- Luật ---------- */

const wwMaxWolves = (n) => Math.floor((n - 1) / 2);
const wwSeats = (g) => g.roles.map((_, i) => i);
const wwAlive = (g) => wwSeats(g).filter((i) => g.alive[i]);
// Sói nguyền thức dậy và đi săn cùng bầy Sói
const wwWakes = (role) => (role === 'cursewolf' ? 'wolf' : role);
const wwIsWolf = (g, i) => wwWakes(g.roles[i]) === 'wolf';

function fixWW() {
  if (!wwCfg.wolves) wwCfg.wolves = Math.max(1, Math.floor(seatCount() / 4));
  save('dmi.ww', wwCfg);
}

// Số người tối thiểu cho thiết lập hiện tại: đủ ghế cho các vai, và Sói ít hơn số còn lại
// wwCfg.wolves là số Sói thường; Sói nguyền (bật riêng) là một con Sói nữa
const wwWolfCount = () => wwCfg.wolves + (wwCfg.cursewolf ? 1 : 0);
const wwNeed = () =>
  Math.max(WW_MIN, 2 * wwWolfCount() + 1, wwWolfCount() + WW_SPECIALS.filter((r) => wwCfg[r]).length);

function wwDeal(n) {
  fixWW();
  const specials = WW_SPECIALS.filter((r) => wwCfg[r]);
  return shuffle([
    // Bật Sói nguyền thì có thêm một con Sói là Sói nguyền, ngoài số Sói thường
    ...(wwCfg.cursewolf ? ['cursewolf'] : []),
    ...Array(wwCfg.wolves).fill('wolf'),
    ...specials,
    ...Array(n - wwWolfCount() - specials.length).fill('villager'),
  ]);
}

function wwTargets(g, i) {
  const role = g.roles[i];
  if (wwIsWolf(g, i)) return wwAlive(g).filter((k) => !wwIsWolf(g, k));
  if (role === 'guard') return wwAlive(g).filter((k) => k !== g.lastGuard);
  if (role === 'witch') return g.poisonUsed ? [] : wwAlive(g).filter((k) => k !== i);
  return wwAlive(g).filter((k) => k !== i);
}

// Nạn nhân của bầy sói: người được chọn nhiều nhất; nếu hòa, Sói chọn sau cùng quyết định
function wwVictim(votes) {
  if (!votes.length) return null;
  const tally = {};
  votes.forEach((t) => (tally[t] = (tally[t] || 0) + 1));
  const top = Math.max(...Object.values(tally));
  const tied = Object.keys(tally).filter((t) => tally[t] === top).map(Number);
  const last = votes[votes.length - 1];
  return tied.includes(last) ? last : tied[0];
}

function wwKill(g, i) {
  g.alive[i] = false;
  if (g.reveal) g.shown[i] = true;
}

function wwCheckWin(g) {
  const wolves = wwAlive(g).filter((i) => wwIsWolf(g, i)).length;
  if (wolves === 0) return 'village';
  if (wolves >= wwAlive(g).length - wolves) return 'wolf';
  return null;
}

/* ---------- Thành phần giao diện ---------- */

const wwTag = (role) => `<span class="tag ${WW_ROLES[role].tag}">${WW_ROLES[role].label}</span>`;
// Ảnh minh hoạ của vai, hoặc emoji khi chưa có ảnh
const wwArt = (role, cls = '') =>
  WW_ROLES[role].img
    ? `<img class="role-art ${cls}" src="${WW_ROLES[role].img}" alt="${WW_ROLES[role].label}">`
    : `<div class="role-art emoji ${cls}">${WW_ROLES[role].emoji}</div>`;
// Công tắc trượt kiểu iPhone; label (nếu có) nằm bên trái công tắc
const iosSwitch = (on, act, { label = '', attrs = '', cls = '', name = label } = {}) => `
  <button class="ios ${cls} ${on ? 'on' : ''}" role="switch" aria-checked="${on}" ${name ? `aria-label="${name}"` : ''} data-act="${act}" ${attrs}>${label ? `<span>${label}</span>` : ''}<i></i></button>`;
const wwSwitch = (key, on, act = 'ww.toggle') => iosSwitch(on, act, { attrs: `data-key="${key}"`, name: WW_ROLES[key]?.label || { reveal: 'Lật vai người chết', hideVotes: 'Ẩn phiếu', voice: 'Giọng quản trò' }[key] || key });

// Thẻ chỉnh số vai, lật vai, bot và giọng quản trò (phòng chờ, chỉ chủ phòng thấy)
function wwCfgCards() {
  fixWW();
  // Bắt đầu ván thì thêm bot cho đủ số người các vai cần (mpStart)
  const n = Math.max(seatCount(), mp?.room ? wwNeed() : 0);
  const short = mp?.room ? n - mpCount() : 0;
  const specials = WW_SPECIALS.filter((r) => wwCfg[r]);
  const villagers = Math.max(0, n - wwWolfCount() - specials.length);
  const humans = mpMembers().length;
  // Khung đếm vai của ván: phe Sói (Sói thường + Sói chức năng), các vai chức năng, Dân làng
  const chip = (role, count) => `<span class="rc-chip rl-${WW_ROLES[role].tag}">${WW_ROLES[role].emoji} ${WW_ROLES[role].label}<b>×${count}</b></span>`;
  const counts = `
    <div class="card stack role-count">
      <div class="row between"><b>Vai trong ván</b><span class="muted small">${n} người${short > 0 ? ` · thêm ${short} bot khi bắt đầu` : ''}</span></div>
      <div class="rc-team"><span>🐺 Phe Sói <b>${wwWolfCount()}</b></span>${chip('wolf', wwCfg.wolves)}${wwCfg.cursewolf ? chip('cursewolf', 1) : ''}</div>
      <div class="rc-team"><span>🏘️ Phe Dân <b>${specials.length + villagers}</b></span>${specials.map((r) => chip(r, 1)).join('')}${chip('villager', villagers)}</div>
    </div>`;
  const roleRow = (role, control) => `
    <div class="row between">
      <span class="row"><span class="role-mini">${wwArt(role)}</span><span><b>${WW_ROLES[role].label}</b><br><span class="muted small">${WW_ROLES[role].desc}</span></span></span>
      ${control}
    </div>`;
  return `
    ${counts}
    <div class="card stack">
      ${roleRow('wolf', stepper('ww.step', 'wolves', wwCfg.wolves, 1, wwMaxWolves(MAX_PLAYERS) - (wwCfg.cursewolf ? 1 : 0)))}
      ${roleRow('cursewolf', wwSwitch('cursewolf', wwCfg.cursewolf))}
      ${WW_SPECIALS.map((role) => roleRow(role, wwSwitch(role, wwCfg[role]))).join('')}
      ${roleRow('villager', `<b>${villagers}</b>`)}
    </div>
    <div class="card stack">
      <div class="row between">
        <span><b>🤖 Bot</b><br><span class="muted small">Thêm cho đủ người. Bot tự chọn ban đêm, không biết nói và không được tính điểm.</span></span>
        ${stepper('mp.bot', 'bots', mpBots().length, 0, MAX_PLAYERS - humans)}
      </div>
      <div class="row between">
        <span><b>⏱️ Thảo luận ban ngày</b><br><span class="muted small">${wwCfg.talk} phút, hết giờ thì cả làng bỏ phiếu trên máy (30 giây)</span></span>
        ${stepper('ww.num', 'talk', wwCfg.talk, 1, 10)}
      </div>
      <div class="row between">
        <span><b>Lật vai khi chết</b><br><span class="muted small">Công khai vai của người bị loại</span></span>
        ${wwSwitch('reveal', wwCfg.reveal)}
      </div>
      <div class="row between">
        <span><b>🙈 Ẩn phiếu</b><br><span class="muted small">Không ai thấy ai bầu ai, số phiếu chỉ hiện khi có kết quả</span></span>
        ${wwSwitch('hideVotes', wwCfg.hideVotes)}
      </div>
      <div class="row between">
        <span><b>🔊 Giọng quản trò</b><br><span class="muted small">Máy này đọc lời dẫn và gọi từng vai; nên đặt máy giữa bàn</span></span>
        ${wwSwitch('voice', wwVoiceOn, 'mww.voice')}
      </div>
    </div>`;
}

/* ---------- Phòng ---------- */

let openRooms = [];
let roomsTimer = null;
let mp = null; // phòng đang ở: { id, room, players, v, join, ready, key, timer }
let mpName = load('dmi.me', '');
let mpMsg = '';
// Lựa chọn tạm trên máy này, xóa khi ván sang bước hoặc lượt mới
let mpSel = null;
let mpPick = null;
let mpHeal = false;
let mpShow = false;
let mpCurse = false;
// Chuyển giữa làng 3D và giao diện 2D (chỉ bảng), nhớ trên máy này
let mww3d = load('dmi.3d', true);
let mpResolved = '';
// Các lần ghi chạy lần lượt; trong lúc ghi, kết quả hỏi phòng (có thể đã cũ) bị bỏ qua
let mpWriting = Promise.resolve();
let mpBusy = 0;
let mpSeq = 0;

// Người thật trong phòng theo thứ tự vào phòng, và các bot chủ phòng đã thêm
const mpMembers = () => (mp ? Object.entries(mp.players).sort((a, b) => a[1].at - b[1].at) : []);
const mpBots = () => mp?.room?.bots || [];
const mpCount = () => mpMembers().length + mpBots().length;
const mpLast = () => mpMembers().every(([uid]) => uid === myId);
const mpJoined = () => mpMembers().some(([uid]) => uid === myId);
const mpIsHost = () => mp?.room?.host === myId;
const mpNames = () => mp.room.seats.map((s) => s.name);
const mpSeat = () => mp.room.seats.findIndex((s) => s.uid === myId);
// Sẵn sàng ở phòng chờ và khi hết ván. round tăng mỗi lần bắt đầu ván hay về phòng chờ, nên mỗi lần phải bấm lại.
const mpRound = () => mp.room.round || 0;
const mpReadyCount = () => mpMembers().filter(([, p]) => p.ready === mpRound()).length;
// Ai còn sống (người thật) đã bấm xong thảo luận trong ngày này
const mwwDoneKey = (g) => `${g.id}:${g.night}`;
const mpSetName = (name) => {
  mpName = name;
  save('dmi.me', name);
};
const mpFail = (e) => {
  mpMsg = e?.status && e.status < 500 ? e.message : 'Không lưu được thao tác. Kiểm tra mạng rồi thử lại.';
  renderIfIdle();
};

// Danh sách phòng, hỏi lại mỗi 4 giây khi đang ở màn chọn phòng
async function loadRooms() {
  try {
    openRooms = (await api('GET', '/rooms')).rooms;
  } catch {}
  if (view !== 'mp.home') return;
  renderIfIdle();
  clearTimeout(roomsTimer);
  roomsTimer = setTimeout(loadRooms, 4000);
}

// Đang ở trong phòng thì vào thẳng phòng
ENTER['mp.home'] = () => {
  if (mp) view = 'mp.room';
  else loadRooms();
};

// Tải lại trang giữa ván thì vào lại phòng cũ
async function mpResume() {
  const last = load('dmi.room', null);
  if (!last || mp) return;
  try {
    openRooms = (await api('GET', '/rooms')).rooms;
  } catch {}
  if (openRooms.some((r) => r.id === last)) mpEnter(last);
  else save('dmi.room', null);
}

async function mpCreate() {
  for (let k = 0; k < 5; k++) {
    const id = String(1000 + rand(9000));
    try {
      await api('PUT', `/rooms/${id}`, { create: true, state: { host: myId, hostName: mpName, phase: 'lobby', seats: [], bots: [], g: null } });
      return mpEnter(id, true);
    } catch (e) {
      // Mã đang có phòng khác dùng thì thử mã khác
      if (e.status !== 409) return mpFail(e);
    }
  }
}

function mpEnter(id, join = false) {
  mpStop();
  // polledAt: lần cuối lấy được phòng; seenAt: lần cuối phòng đổi
  const state = (mp = { id, room: null, players: {}, v: -1, join, ready: false, key: '', polledAt: performance.now(), seenAt: performance.now() });
  save('dmi.room', id);
  mpMsg = '';
  go('mp.room');
  renderIfIdle();
  mpPoll(state);
}

function mpStop() {
  clearTimeout(mp?.timer);
  wwSay([]);
  mp = null;
  save('dmi.room', null);
}

async function mpPoll(state) {
  if (mp !== state) return;
  const seq = mpSeq;
  try {
    const r = await api('GET', `/rooms/${state.id}?v=${state.v}`);
    if (mp === state) state.polledAt = performance.now();
    if (mp === state && !r.same && !mpBusy && seq === mpSeq) {
      Object.assign(state, { v: r.v, room: r.room, players: r.players, ready: true, seenAt: performance.now() });
      mpChanged();
    }
  } catch (e) {
    if (mp === state && e.status === 404) {
      Object.assign(state, { room: null, ready: true });
      mpChanged();
    }
  }
  if (mp === state) state.timer = setTimeout(() => mpPoll(state), document.hidden ? 5000 : 1500);
}

function mpChanged() {
  if (!mp.ready) return;
  const room = mp.room;
  if (room && mp.join) {
    mp.join = false;
    if (!mpJoined()) mpJoin();
  }
  const g = room?.g;
  const key = g ? `${g.id}:${g.night}:${g.step}:${g.turn}` : room?.phase;
  if (key !== mp.key) {
    mp.key = key;
    mpSel = null;
    mpPick = null;
    mpHeal = false;
    mpCurse = false;
  }
  // Đã mở máy thì giữ suốt đêm, sang lượt vai khác vẫn mở; sang bước khác (trời sáng, đêm mới) thì nhắm lại
  const night = g ? `${g.id}:${g.night}:${g.step}` : room?.phase;
  if (night !== mp.showKey) {
    mp.showKey = night;
    mpShow = false;
  }
  mwwNarrate();
  renderIfIdle();
}

function mpJoin() {
  if (!wsUser) return;
  const taken = mpMembers().some(([uid, p]) => uid !== myId && p.name.toLowerCase() === mpName.toLowerCase());
  if (taken) return void (mpMsg = `Đã có người tên ${mpName} trong phòng. Chọn tên khác rồi bấm Vào phòng.`);
  mpMsg = '';
  // Màu đã chọn lần trước, nếu chưa ai trong phòng lấy
  const color = mpColorsTaken().has(mpColor) ? null : mpColor;
  mpWritePlayer({ name: mpName, at: Date.now(), act: null, color });
}

// Màu nhân vật (và mái nhà): mỗi người chọn trong phòng chờ, màu người khác đã lấy thì không chọn được; máy nhớ màu cho
// lần sau. Bot và người chưa chọn lấy lần lượt màu còn trống, nên cả làng không ai trùng màu.
const MWW_COLORS = ['#d64541', '#e8822a', '#e2b82a', '#7cb342', '#2e9e5b', '#1fa3a3', '#2f6fd6', '#7b52c7', '#d9569b', '#8d5a3b', '#e9e4d8', '#3a3a42'];
let mpColor = load('dmi.ww.color', null);
// Chỉ nhận màu trong bảng: dữ liệu người chơi do máy khác ghi, không đưa thẳng vào trang
const mpColorOf = (p) => (MWW_COLORS.includes(p?.color) ? p.color : null);
// Ghế trong làng lúc này: đang chơi thì theo ván, ở phòng chờ thì người trong phòng rồi tới bot (như mpLobby)
const mwwSeatsNow = () => (mp.room?.phase === 'play' && mp.room.g
  ? mp.room.seats
  : [...mpMembers().map(([uid, p]) => ({ uid, name: p.name })), ...mpBots().map((b) => ({ uid: b.id, name: b.name }))]);
// Màu từng ghế: người đã chọn giữ màu mình (hai người lỡ chọn cùng lúc thì người ngồi trước giữ), còn lại lấy màu trống
function mwwColors(seats) {
  const used = new Set();
  const mine = seats.map((s) => {
    const c = mpColorOf(mp.players[s.uid]);
    if (!c || used.has(c)) return null;
    used.add(c);
    return c;
  });
  const free = MWW_COLORS.filter((c) => !used.has(c));
  return mine.map((c, k) => c || free.shift() || avatarColor(seats[k].name));
}
const mwwColor = (s) => {
  const seats = mwwSeatsNow();
  const k = seats.findIndex((x) => x.uid === s.uid);
  return k < 0 ? avatarColor(s.name) : mwwColors(seats)[k];
};
const mpColorsTaken = () => new Set(mpMembers().filter(([uid]) => uid !== myId).map(([, p]) => mpColorOf(p)).filter(Boolean));

function mpColorPicker() {
  const mine = mp.players[myId]?.color;
  const taken = mpColorsTaken();
  return `
    <div class="stack colors">
      <span class="muted small">Màu nhân vật của bạn</span>
      <div class="swatches">
        ${MWW_COLORS.map((c) => `<button class="swatch ${c === mine ? 'on' : ''}" style="--c:${c}" data-act="mp.color" data-c="${c}" ${taken.has(c) ? 'disabled title="Đã có người chọn"' : ''} aria-label="Màu ${c}${taken.has(c) ? ', đã có người chọn' : ''}" aria-pressed="${c === mine}"></button>`).join('')}
      </div>
    </div>`;
}

function mpSend(write) {
  mpBusy++;
  mpSeq++;
  mpWriting = mpWriting
    .then(write)
    .catch(mpFail)
    .finally(() => {
      mpBusy--;
      mpSeq++;
    });
}

// Mỗi máy chỉ ghi phần của mình; hiện ngay trên máy này rồi ghi lần lượt
function mpWritePlayer(data) {
  mp.players = { ...mp.players, [myId]: data };
  const id = mp.id;
  mpSend(() => api('PUT', `/rooms/${id}/players/me`, { data }));
}

// Đổi trạng thái phòng bằng fn trên một bản sao, rồi ghi cả phòng. rev đếm số lần phòng đổi; máy chủ chỉ nhận bản ghi
// dựa trên đúng rev đang có. Máy khác đã ghi trước (máy này cầm bản cũ, hoặc không còn là chủ phòng) thì bản này bị bỏ
// và máy lấy lại phòng, thay vì đưa ván về chỗ cũ.
function mpUpdate(fn) {
  const base = mp.room.rev || 0;
  const room = structuredClone(mp.room);
  fn(room);
  room.rev = base + 1;
  mp.room = room;
  mp.seenAt = performance.now();
  const state = mp;
  mpSend(() => api('PUT', `/rooms/${state.id}`, { state: room, base }).catch((e) => {
    if (e.status !== 409) throw e;
    if (mp !== state) return;
    state.v = -1;
    mpResolved = '';
  }));
}

/* ---------- Ván Ma Sói trong phòng ---------- */

// seats: [{ uid, name, bot? }], theo thứ tự ghế
function mwwNew(seats) {
  const n = seats.length;
  const roles = wwDeal(n);
  const g = {
    id: Date.now(),
    roles,
    calls: WW_CALLS.filter((role) => roles.some((r) => wwWakes(r) === role)),
    reveal: wwCfg.reveal,
    // Ẩn phiếu: lúc bỏ phiếu, phán xử không hiện số phiếu; kết quả chỉ ghi tổng, không ghi tên người bầu
    hideVotes: wwCfg.hideVotes,
    talk: wwCfg.talk * 60 * 1000,
    // Giờ hết lượt hiện tại (lượt gọi vai, thảo luận, bỏ phiếu), theo đồng hồ máy chủ phòng
    deadline: null,
    alive: Array(n).fill(true),
    shown: Array(n).fill(false),
    night: 0,
    lastGuard: null,
    healUsed: false,
    poisonUsed: false,
    curseUsed: false,
    // Người bị nguyền hóa Sói: { ghế: vai cũ }
    turned: {},
    // Phát bắn của Thợ săn { hunter, target, night }: không ai thấy trong ván, chỉ kể ở điểm nhấn cuối ván
    shots: [],
    deaths: [],
    out: null,
    winner: null,
  };
  mwwNight(g, seats);
  return g;
}

// Sang đêm mới: quản trò đọc lời dẫn (turn -1) rồi gọi từng vai; bot chọn luôn từ đầu đêm
function mwwNight(g, seats, prelude = null) {
  g.night++;
  mwwRecord(g, { kind: 'night' });
  g.step = 'night';
  g.turn = -1;
  g.prelude = prelude;
  g.deadline = null;
  g.deaths = [];
  g.out = null;
  g.ballots = null;
  g.accused = null;
  g.spared = null;
  g.verdicts = null;
  g.botActs = mwwBotActs(g, seats);
}

// Bắt đầu giờ thảo luận ban ngày. Ván đã ngã ngũ thì chỉ dừng một lúc để đọc tin rồi tự đi tiếp, không cần chủ phòng bấm.
function mwwTalk(g) {
  g.talking = !wwCheckWin(g);
  g.deadline = Date.now() + (g.talking ? g.talk : WW_TIMES.next);
}

// Bot bỏ phiếu ngẫu nhiên một người còn sống khác mình (Sói bot không treo Sói)
// Bot bỏ phiếu theo số đông để phiếu không bị chia nhỏ rồi hòa: theo người đang bị người thật bầu nhiều nhất (hòa thì
// người bị bầu sớm nhất); chưa ai bầu thì cả bầy bot cùng bầu botTarget, chọn ngẫu nhiên lúc mở bỏ phiếu.
// Bot không bầu chính mình, Sói bot không bầu đồng bọn: khi đó bỏ qua.
function mwwBotVote(g, i, lead) {
  const t = lead ?? g.botTarget;
  return t === undefined || t === i || (wwIsWolf(g, i) && wwIsWolf(g, t)) ? -1 : t;
}

// Phiếu hôm nay của từng ghế còn sống: số ghế bị chọn, -1 là bỏ qua, undefined là chưa bỏ phiếu
function mwwVotes() {
  const g = mp.room.g;
  const human = mp.room.seats.map((s, i) => {
    if (!g.alive[i] || s.bot) return undefined;
    const vote = mp.players[s.uid]?.vote;
    return vote?.game === g.id && vote.night === g.night ? vote : undefined;
  });
  const count = {};
  const first = {};
  human.forEach((v) => {
    if (!v || v.target < 0) return;
    count[v.target] = (count[v.target] || 0) + 1;
    first[v.target] = Math.min(first[v.target] ?? Infinity, v.at);
  });
  const lead = Object.keys(count).map(Number).sort((a, b) => count[b] - count[a] || first[a] - first[b])[0];
  return mp.room.seats.map((s, i) => {
    if (!g.alive[i]) return undefined;
    // botVotes: phiếu bot của ván bắt đầu trước khi có botTarget
    if (s.bot) return g.botTarget === undefined ? g.botVotes?.[i] : mwwBotVote(g, i, lead);
    return human[i]?.target;
  });
}

// Chủ phòng mở bỏ phiếu: 30 giây, bot bỏ phiếu ngay
function mwwStartVote() {
  if (mp.room.g.step !== 'day') return;
  mpUpdate((r) => {
    r.g.step = 'vote';
    r.g.deadline = Date.now() + WW_TIMES.turn;
    const alive = wwAlive(r.g);
    r.g.botTarget = alive[rand(alive.length)];
  });
  mwwNarrate();
}

// Phán xử của từng ghế còn sống (trừ người trên giàn): true treo, false tha, undefined chưa chọn
function mwwVerdicts() {
  const g = mp.room.g;
  return mp.room.seats.map((s, i) => {
    if (!g.alive[i] || i === g.accused) return undefined;
    if (s.bot) return g.botVerdicts?.[i];
    const verdict = mp.players[s.uid]?.verdict;
    return verdict?.game === g.id && verdict.night === g.night ? verdict.kill : undefined;
  });
}

// Bot phán xử: Sói bot tha đồng bọn và treo người khác, bot dân làng nghiêng về treo
function mwwBotVerdicts(g, seats) {
  const verdicts = {};
  seats.forEach((s, i) => {
    if (!s.bot || !g.alive[i] || i === g.accused) return;
    verdicts[i] = wwIsWolf(g, i) ? !wwIsWolf(g, g.accused) : Math.random() < 0.6;
  });
  return verdicts;
}

// Kết thúc phán xử (một lần mỗi ngày): Treo nhiều hơn Tha thì bị treo cổ thành hồn ma; hòa hoặc Tha nhiều hơn thì
// được tha, chơi tiếp
function mwwJudge() {
  const g = mp.room.g;
  const key = `${g.id}:${g.night}:trial`;
  if (g.step !== 'trial' || mpResolved === key) return;
  mpResolved = key;
  const verdicts = mwwVerdicts();
  mpUpdate((r) => {
    const g = r.g;
    const kill = verdicts.filter((v) => v === true).length;
    const save = verdicts.filter((v) => v === false).length;
    g.verdicts = verdicts.map((v) => v ?? null);
    if (kill > save) {
      g.out = g.accused;
      wwKill(g, g.out);
    } else {
      g.spared = g.accused;
    }
    mwwRecord(g, { kind: kill > save ? 'hanged' : 'spared', who: g.accused, kill, save });
    g.deadline = Date.now() + WW_TIMES.next;
    g.step = 'reveal';
  });
  mwwNarrate();
}

// Kiểm phiếu (một lần mỗi ngày): người nhiều phiếu nhất lên giàn treo cổ chờ phán xử; hòa hoặc không ai bị chọn thì
// không ai lên giàn
function mwwTally() {
  const g = mp.room.g;
  const key = `${g.id}:${g.night}:vote`;
  if (g.step !== 'vote' || mpResolved === key) return;
  mpResolved = key;
  const votes = mwwVotes();
  mpUpdate((r) => {
    const g = r.g;
    const count = {};
    votes.forEach((t) => t >= 0 && (count[t] = (count[t] || 0) + 1));
    const top = Math.max(0, ...Object.values(count));
    const leaders = Object.keys(count).filter((t) => count[t] === top).map(Number);
    g.ballots = votes.map((t) => t ?? null);
    mwwRecord(g, top > 0 && leaders.length === 1 ? { kind: 'accused', who: leaders[0], votes: top } : { kind: 'nohang' });
    if (top > 0 && leaders.length === 1) {
      g.accused = leaders[0];
      g.step = 'trial';
      g.deadline = Date.now() + WW_TIMES.turn;
      g.botVerdicts = mwwBotVerdicts(g, r.seats);
    } else {
      g.out = null;
      g.deadline = Date.now() + WW_TIMES.next;
      g.step = 'reveal';
    }
  });
  mwwNarrate();
}

// Bot: Sói cắn ngẫu nhiên một người không phải Sói, Bảo vệ che ngẫu nhiên, Phù thủy không dùng thuốc, Thợ săn thỉnh
// thoảng mới bắn (bắn bừa dễ trúng dân).
// Ghi giờ sớm hơn mọi người thật, nên khi hòa phiếu Sói người thật quyết định.
function mwwBotActs(g, seats) {
  const acts = {};
  seats.forEach((s, i) => {
    if (!s.bot || !g.alive[i]) return;
    const idle = g.roles[i] === 'witch' || (g.roles[i] === 'hunter' && Math.random() < 0.6);
    const targets = idle ? [] : wwTargets(g, i);
    acts[i] = { game: g.id, night: g.night, pick: targets.length ? targets[rand(targets.length)] : null, heal: false, curse: g.roles[i] === 'cursewolf' && !g.curseUsed && Math.random() < 0.4, at: 0 };
  });
  return acts;
}

// Lựa chọn đêm nay của từng ghế, null nếu người đó chưa chọn
function mwwActs() {
  const g = mp.room.g;
  return mp.room.seats.map((s, i) => {
    if (s.bot) return g.botActs?.[i] ?? null;
    const act = mp.players[s.uid]?.act;
    return act?.game === g.id && act.night === g.night ? act : null;
  });
}

const mwwVictim = (g, acts) =>
  wwVictim(acts
    .filter((a, i) => a && g.alive[i] && wwIsWolf(g, i) && a.pick !== null)
    .sort((a, b) => a.at - b.at)
    .map((a) => a.pick));

// Những ghế còn sống giữ vai đang được gọi
const mwwHolders = (g, role) => wwAlive(g).filter((i) => wwWakes(g.roles[i]) === role);
const mwwTurnDone = (g, acts) => mwwHolders(g, g.calls[g.turn]).every((i) => acts[i]);

// Xử lý đêm (một lần mỗi đêm) rồi sang ngày
function mwwResolve() {
  const g = mp.room.g;
  const acts = mwwActs();
  const night = `${g.id}:${g.night}`;
  if (mpResolved === night || !mpIsHost()) return;
  mpResolved = night;
  mpUpdate((r) => {
    const g = r.g;
    const victim = mwwVictim(g, acts);
    const actOf = (role) => acts.find((a, i) => a && g.alive[i] && g.roles[i] === role);
    const guard = actOf('guard')?.pick ?? null;
    const witch = actOf('witch');
    const heal = Boolean(witch?.heal) && victim !== null && !g.healUsed;
    const poison = g.poisonUsed ? null : witch?.pick ?? null;
    // Thợ săn bắn lúc còn sống trong đêm, kể cả khi chính mình bị cắn đêm đó: sáng ra người bị bắn mới chết
    const hunter = actOf('hunter');
    const shot = hunter?.pick ?? null;
    g.healUsed ||= heal;
    g.poisonUsed ||= poison !== null;
    const dead = [];
    // Người bị cắn mà không được cứu: Bán sói hóa Sói; Sói nguyền đã chọn nguyền (lần duy nhất) thì cũng hóa Sói; còn lại chết
    const curse = actOf('cursewolf')?.curse && !g.curseUsed;
    if (victim !== null && victim !== guard && !heal) {
      if (g.roles[victim] === 'cursed' || curse) {
        if (g.roles[victim] !== 'cursed') g.curseUsed = true;
        g.turned = { ...g.turned, [victim]: g.roles[victim] };
        g.roles[victim] = 'wolf';
      } else dead.push(victim);
    }
    if (poison !== null && !dead.includes(poison)) dead.push(poison);
    if (shot !== null && !dead.includes(shot)) dead.push(shot);
    if (shot !== null) g.shots = [...(g.shots || []), { hunter: acts.indexOf(hunter), target: shot, night: g.night }];
    g.lastGuard = guard;
    dead.forEach((i) => wwKill(g, i));
    g.deaths = shuffle(dead);
    mwwRecord(g, { kind: 'day', deaths: g.deaths });
    g.step = 'day';
    mwwTalk(g);
  });
}

function mwwFinish(r, winner) {
  const g = r.g;
  g.winner = winner;
  g.step = 'end';
  g.endedAt = Date.now();
  mwwRecord(g, { kind: 'end', winner });
  // Bot không được tính điểm
  const results = g.roles
    .map((role, i) => {
      const win = (wwWakes(role) === 'wolf') === (winner === 'wolf');
      return { name: r.seats[i].name, pts: win ? WW_POINTS[winner] : 0, win, bot: r.seats[i].bot };
    })
    .filter((x) => !x.bot)
    .map(({ name, pts, win }) => ({ name, pts, win }));
  recordGame('ww', `${winner === 'wolf' ? 'Ma Sói thắng' : 'Dân làng thắng'} sau ${g.night} đêm`, results);
}

// Sau màn ban ngày hoặc sau khi treo cổ: kết thúc ván, hoặc sang đêm mới
function mwwAfter(r) {
  const g = r.g;
  const winner = wwCheckWin(g);
  if (winner) mwwFinish(r, winner);
  else if (g.step === 'reveal') mwwNight(g, r.seats);
}

// Nhãn nút chính của chủ phòng tùy theo việc sắp xảy ra
function mwwAfterLabel(g, normal) {
  return wwCheckWin(g) ? 'Xem kết quả' : normal;
}

/* ---------- Quản trò (chỉ máy chủ phòng) ---------- */

let nar = { key: '', phase: '', waited: false };
const narSpoken = new Set();

function mwwWakeClips(g, role, acts) {
  const c = WW_VOICE.calls[role];
  // Phù thủy: luôn đọc cả hai bình, kể cả bình đã dùng, để không ai đoán ra Phù thủy đã dùng gì
  return role === 'witch' ? [c.wake, c.heal, c.poison] : c.wake;
}

// Gọi mỗi khi phòng đổi: đọc lời dẫn và đưa đêm qua từng lượt
function mwwNarrate() {
  const g = mp?.room?.g;
  if (!g || !mpIsHost() || mp.room.phase !== 'play') return;
  if (g.step !== 'night') {
    // Ngoài đêm: mỗi bước đọc một lần
    const clips = [];
    const step = `${g.id}:${g.night}:${g.step}`;
    if (!narSpoken.has(step)) {
      narSpoken.add(step);
      if (g.step === 'day') clips.push(WW_VOICE.dawn, WW_VOICE.deaths[Math.min(g.deaths.length, 2)]);
      if (g.step === 'vote') clips.push(WW_VOICE.timeUp);
      if (g.step === 'reveal') clips.push(g.out === null ? WW_VOICE.noHang : WW_VOICE.hanged);
      if (g.step === 'end') clips.push(WW_VOICE[g.winner]);
    }
    if (clips.length) wwSay(clips);
    return;
  }
  const key = `${g.id}:${g.night}:${g.turn}`;
  const acts = mwwActs();
  if (nar.key !== key) {
    nar = { key, phase: 'speak', waited: false };
    if (g.turn < 0) {
      const intro = g.night === 1 ? WW_VOICE.firstNight : WW_VOICE.nights;
      const go = () => wwSay([WW_VOICE[g.prelude] || [], intro], () => mwwTurn(g, 0));
      return g.night === 1 ? mwwAfterRoles(key, go) : go();
    }
    if (g.turn >= g.calls.length) return mwwResolve();
    const role = g.calls[g.turn];
    const people = mwwHolders(g, role).filter((i) => !mp.room.seats[i].bot);
    return wwSay(mwwWakeClips(g, role, acts), () => {
      if (nar.key !== key || !mpIsHost()) return;
      nar.phase = 'wait';
      // Đọc xong lời gọi thì bắt đầu đếm 30 giây (vai đã chết cũng vậy, để không ai đoán ra)
      mpUpdate((r) => {
        r.g.deadline = Date.now() + WW_TIMES.turn;
      });
      renderIfIdle();
      // Vai đã chết hoặc chỉ có bot: vẫn chờ một lúc như có người đang chọn
      setTimeout(() => {
        if (nar.key !== key) return;
        nar.waited = true;
        mwwNarrate();
      }, people.length ? 0 : 4000 + rand(4000));
    });
  }
  if (nar.phase === 'wait' && nar.waited && mwwTurnDone(g, acts)) {
    // Ai cũng chọn xong: chờ thêm cho người vừa chốt đi tới nhà kia và xem hết hoạt ảnh rồi mới gọi vai đi ngủ
    // Chờ thêm vài giây ngẫu nhiên, để không ai đoán ra vai chọn nhanh vì không còn gì để làm (Phù thủy hết bình…)
    nar.doneAt ||= Date.now() + rand(4000);
    const left = nar.doneAt + WW_TIMES.trip - Date.now();
    if (left <= 0) return mwwSleep(g);
    clearTimeout(nar.timer);
    nar.timer = setTimeout(() => nar.key === key && nar.phase === 'wait' && mwwNarrate(), left);
  }
}

// Đầu ván: chờ ai cũng đã xem vai (mwwRoleCover) hoặc hết WW_TIMES.roles rồi mới đọc lời dẫn đêm đầu tiên
function mwwAfterRoles(key, go) {
  const start = Date.now();
  const check = () => {
    if (nar.key !== key || !mpIsHost()) return;
    if (mwwAllSeen(mp.room.g) || Date.now() - start > WW_TIMES.roles) return go();
    setTimeout(check, 500);
  };
  check();
}
const mwwAllSeen = (g) => mp.room.seats.every((s) => s.bot || mp.players[s.uid]?.seen === g.id);

// Vai đang được gọi đi ngủ, rồi gọi vai tiếp theo
function mwwSleep(g) {
  nar.phase = 'sleep';
  const role = g.calls[g.turn];
  wwSay(role ? WW_VOICE.calls[role].sleep : [], () => mwwTurn(g, g.turn + 1));
}

function mwwTurn(g, turn) {
  // Lời dẫn đọc xong trên máy đã thôi làm chủ phòng thì không chuyển lượt nữa
  if (!mpIsHost()) return;
  const now = mp?.room?.g;
  if (now?.id !== g.id || now.night !== g.night || now.turn !== g.turn) return;
  mpUpdate((r) => {
    r.g.turn = turn;
    r.g.deadline = null;
  });
  mwwNarrate();
  renderIfIdle();
}

// Mỗi giây: cập nhật số giây trên các vòng đếm ngược; máy chủ phòng chuyển lượt khi hết giờ hoặc khi ai cũng đã bỏ phiếu
function mwwTick() {
  mwwClocks();
  mpKeepHost();
  if (!mp?.ready || !mp.room || !mpIsHost()) return;
  // Máy vừa ngủ dậy (lâu không lấy được phòng): chờ lấy bản mới rồi mới làm quản trò, kẻo ghi đè lên ván đã đi tiếp
  if (performance.now() - mp.polledAt > 8000) return;
  if (mp.room.phase !== 'play' || mp.room.g?.step === 'end') return mpAutoStart();
  const g = mp.room.g;
  const left = g.deadline ? g.deadline - Date.now() : Infinity;
  if (g.step === 'night' && nar.phase === 'wait' && left <= 0) mwwSleep(g);
  if (g.step === 'day' && g.deadline) {
    const warn = `${g.id}:${g.night}:oneMin`;
    if (g.talking && g.talk > 60 * 1000 && left <= 60 * 1000 && !narSpoken.has(warn)) {
      narSpoken.add(warn);
      wwSay(WW_VOICE.oneMin);
    }
    // Ai còn sống cũng đã bấm xong thảo luận thì bỏ phiếu luôn
    const done = mp.room.seats.every((s, i) => s.bot || !g.alive[i] || mp.players[s.uid]?.done === mwwDoneKey(g));
    if (left <= 0 || (g.talking && done)) g.talking ? mwwStartVote() : mpUpdate(mwwAfter);
  }
  if (g.step === 'reveal' && left <= 0) mpUpdate(mwwAfter);
  // Hết giờ thì chờ thêm một chút cho phiếu bấm ở mấy giây cuối kịp tới máy này rồi mới kiểm
  const late = left <= -WW_TIMES.late;
  if (g.step === 'vote' && (late || mwwVotes().every((v, i) => !g.alive[i] || v !== undefined))) mwwTally();
  if (g.step === 'trial' && (late || mwwVerdicts().every((v, i) => !g.alive[i] || i === g.accused || v !== undefined))) mwwJudge();
}
setInterval(mwwTick, 1000);

// Ván tự chạy kể cả khi máy chủ phòng tắt hay rời phòng: máy chủ phòng ghi một nhịp mỗi 10 giây. Phòng im quá 30 giây,
// hoặc chủ phòng đã rời, thì người chơi đầu tiên còn trong phòng tự nhận làm chủ phòng (và làm quản trò); người đó cũng
// im thì 30 giây sau tới lượt người kế tiếp.
function mpKeepHost() {
  if (!mp?.ready || !mp.room || !mpJoined()) return;
  // Máy vừa mở khóa màn hình cầm bản phòng cũ, tưởng phòng im lâu: chờ lấy được phòng mới đã
  if (performance.now() - mp.polledAt > 4000) return;
  const quiet = performance.now() - mp.seenAt;
  if (mpIsHost()) {
    if (quiet > 10000 && performance.now() - mp.polledAt < 8000) mpUpdate((r) => (r.beat = Date.now()));
    return;
  }
  const gone = !mpMembers().some(([uid]) => uid === mp.room.host);
  if (!gone && quiet < 30000) return;
  const next = mpMembers().map(([uid]) => uid).filter((uid) => uid !== mp.room.host);
  const k = gone ? 0 : Math.floor(quiet / 30000) - 1;
  if (next[Math.min(k, next.length - 1)] === myId) actions['mp.takehost']();
}

// Không cần chủ phòng bấm bắt đầu: ai cũng sẵn sàng thì bắt đầu ngay; quá nửa sẵn sàng thì đếm 20 giây rồi bắt đầu với
// những người đang trong phòng (thiếu người thì thêm bot)
function mpAutoStart() {
  const all = mpMembers().length;
  const ready = mpReadyCount();
  if (all && ready === all) return mpStart();
  if (ready * 2 <= all) return void (mp.room.startAt && mpUpdate((r) => (r.startAt = null)));
  if (!mp.room.startAt) return mpUpdate((r) => (r.startAt = Date.now() + WW_TIMES.ready));
  if (Date.now() >= mp.room.startAt) mpStart();
}

const mwwClock = (ms) => {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : String(s);
};

// Vòng tròn đếm ngược tới deadline (tổng thời gian total). Vòng chạy bằng CSS, số giây do mwwClocks cập nhật.
// Markup không phụ thuộc giờ hiện tại để vẽ lại không làm vòng chạy lại từ đầu.
function mwwRing(deadline, total) {
  return `
    <div class="ring" data-ring="${deadline}" style="--total:${total}ms" role="timer" aria-label="Thời gian còn lại">
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" class="track"/><circle cx="22" cy="22" r="19" class="bar" pathLength="100"/></svg>
      <span data-deadline="${deadline}"></span>
    </div>`;
}

// Vòng mới vẽ thì bắt đầu chạy từ chỗ đã trôi qua; số giây cập nhật mỗi giây
function mwwClocks() {
  document.querySelectorAll('.ring:not(.run)').forEach((el) => {
    const total = parseFloat(el.style.getPropertyValue('--total'));
    el.style.setProperty('--delay', `${Math.max(0, Number(el.dataset.ring) - Date.now()) - total}ms`);
    el.classList.add('run');
  });
  document.querySelectorAll('[data-deadline]').forEach((el) => (el.textContent = mwwClock(Number(el.dataset.deadline) - Date.now())));
}
AFTER_RENDER.push(mwwClocks);

// Dựng cảnh một lần (dựng lại khi xoay màn hình), chèn trước #app
function mwwStageInit() {
  const tall = String(mwwTall());
  let stage = document.getElementById('stage');
  if (stage?.dataset.tall === tall) return stage;
  stage?.remove();
  mwwPainted = { cast: null, tags: null };
  mwwWalk.pos = null;
  const MWW_PROPS = mwwLayout().props;
  const at = (x, y) => `left:${(x / 10).toFixed(2)}%;top:${(y / 9).toFixed(2)}%`;
  const objs = MWW_PROPS.map(([kind, x, y, w]) => {
    const [sw, sh] = MWW_SPRITES[kind];
    return `<i class="obj ${kind}" style="${at(x, y)};width:${w / 10}%;z-index:${y}"><svg viewBox="0 0 ${sw} ${sh}"><use href="#mww-${kind}"/></svg></i>`;
  }).join('');
  const glows = MWW_PROPS.flatMap(([kind, x, y, w]) => (MWW_LIGHTS[kind] || []).map(([lx, ly]) => {
    const [sw, sh] = MWW_SPRITES[kind];
    const k = w / sw;
    return `<i class="glow ${kind}" style="${at(x - w / 2 + lx * k, y - (sh - ly) * k)}"></i>`;
  })).join('');
  stage = document.createElement('div');
  stage.id = 'stage';
  stage.dataset.tall = tall;
  stage.hidden = true;
  stage.innerHTML = `
    <div class="world">${MWW_GROUND}${objs}<div class="cast"></div></div>
    <div class="tint t-day"></div><div class="tint t-night"></div><div class="tint t-trial"></div><div class="tint t-wolf"></div><div class="tint t-village"></div>
    <div class="world over">${glows}<div class="tags"></div></div>
    <div class="fog f1"></div><div class="fog f2"></div>`;
  document.body.insertBefore(stage, app);
  return stage;
}

}
