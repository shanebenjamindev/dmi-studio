function mwwActBody(g, i, acts, names) {
  const role = g.roles[i];
  const info = WW_ROLES[role];
  const targets = wwTargets(g, i);
  let prompt = '';
  let extra = '';
  if (role === 'wolf') {
    const mates = wwAlive(g).filter((k) => k !== i && wwIsWolf(g, k));
    const picked = mates.filter((k) => acts[k]).map((k) => `${esc(names[k])} → ${esc(names[acts[k].pick])}`);
    prompt = 'Chọn người để cắn đêm nay.';
    extra = `
      <p>Đồng bọn: <b>${mates.length ? mates.map((k) => esc(names[k])).join(', ') : 'không còn ai'}</b></p>
      ${picked.length ? `<p>Đồng bọn đã chọn: <b>${picked.join(', ')}</b>. Nếu hòa phiếu, Sói chọn sau cùng quyết định.</p>` : ''}`;
  } else if (role === 'seer') {
    prompt = 'Chọn một người để soi.';
  } else if (role === 'guard') {
    prompt = 'Chọn một người để bảo vệ (có thể là chính bạn).';
    if (g.lastGuard !== null && g.alive[g.lastGuard]) {
      extra = `<p>Đêm trước bạn đã bảo vệ <b>${esc(names[g.lastGuard])}</b> nên đêm nay không chọn lại được.</p>`;
    }
  } else if (role === 'witch') {
    const victim = mwwVictim(g, acts);
    prompt = g.poisonUsed ? 'Bạn đã hết thuốc độc.' : 'Muốn đầu độc ai thì chọn người đó (không bắt buộc).';
    extra = g.healUsed
      ? '<p>Bạn đã hết thuốc cứu.</p>'
      : victim === null
        ? '<p>Đêm nay không ai bị Sói cắn.</p>'
        : `<p>Đêm nay Sói cắn <b>${esc(names[victim])}</b>.</p>
           <button class="switch ${mpHeal ? 'on' : ''}" data-act="mww.heal">${mpHeal ? '✓ Sẽ cứu' : 'Dùng thuốc cứu'}</button>`;
  }
  const ready = role === 'witch' || mpPick !== null;
  const who = mpPick === null ? '' : esc(names[mpPick]);
  const verb = { wolf: 'Cắn', seer: 'Soi', guard: 'Bảo vệ', witch: 'Đầu độc' }[role];
  const label = mpPick !== null ? `${verb} ${who}` : role === 'witch' ? (mpHeal ? 'Cứu, không đầu độc ai' : 'Không đầu độc ai') : 'Chọn một người';
  return `
    <div class="role-card ${info.tag}">${wwArt(role)}<h2>Bạn là ${info.label}</h2></div>
    <div class="info stack">${extra}<p><b>${prompt}</b></p>
      ${targets.length ? '<p class="muted small">Đi tới cửa nhà người đó trong làng, hoặc chạm vào tên bên dưới.</p>' : ''}</div>
    <div class="pgrid grow">
      ${targets.map((k) => playerCard(names[k], { cls: mpPick === k ? 'sel' : '', act: 'mww.pick', i: k })).join('')}
    </div>
    <button class="btn" data-act="mww.confirm" ${ready ? '' : 'disabled'}>${label}</button>`;
}

// Kết quả hành động đêm của chính mình
function mwwResult(g, i, acts, names) {
  const act = acts[i];
  const role = g.roles[i];
  const name = act.pick === null ? '' : `<b>${esc(names[act.pick])}</b>`;
  if (role === 'wolf') {
    const victim = mwwVictim(g, acts);
    return victim === null ? 'Đã ghi nhận.' : `Bầy sói đang nhắm vào <b>${esc(names[victim])}</b>.`;
  }
  if (role === 'seer') return g.roles[act.pick] === 'wolf' ? `${name} LÀ MA SÓI 🐺` : `${name} không phải Sói ✅`;
  if (role === 'guard') return `Đêm nay bạn bảo vệ ${name}.`;
  const done = [act.heal && 'đã dùng thuốc cứu', act.pick !== null && `đã đầu độc ${name}`].filter(Boolean);
  return done.length ? `Bạn ${done.join(' và ')}.` : 'Đêm nay bạn không dùng thuốc.';
}

function mwwNightView() {
  const g = mp.room.g;
  const names = mpNames();
  const i = mpSeat();
  const acts = mwwActs();
  const role = g.roles[i];
  const calling = g.calls[g.turn];
  const ring = calling && g.deadline ? mwwRing(g.deadline, WW_TIMES.turn) : '';
  const head = calling
    ? `<div class="calling ${WW_ROLES[calling].tag}">${wwArt(calling, 'small')}<b class="grow">${WW_ROLES[calling].label} thức dậy</b>${ring}</div>`
    : `<div class="calling"><div class="role-art emoji small">${g.turn < 0 ? '🌙' : '☀️'}</div><b>${g.turn < 0 ? 'Màn đêm buông xuống' : 'Trời sắp sáng'}</b></div>`;
  const hide = '<button class="btn ghost" data-act="mww.show">Ẩn đi</button>';
  let body;
  if (!g.alive[i]) {
    body = `
      <div class="secret night">
        <div class="emoji">👻</div>
        <div class="who">Bạn đã bị loại</div>
        <p class="muted">Giữ im lặng và chờ trời sáng nhé.</p>
      </div>`;
  } else if (!mpShow) {
    body = `
      <div class="secret night">
        <div class="emoji">🌙</div>
        <div class="who">Nhắm mắt lại</div>
        <p class="muted">Khi quản trò gọi vai của bạn, che màn hình rồi bấm mở máy.${g.night === 1 ? ' Đêm đầu tiên, bạn sẽ biết vai của mình khi mở máy.' : ''}</p>
      </div>
      <button class="btn" data-act="mww.show">Mở máy</button>`;
  } else if (acts[i]) {
    body = `
      <div class="secret night">${wwArt(role)}<div class="result">${mwwResult(g, i, acts, names)}</div></div>
      ${hide}`;
  } else if (role === calling) {
    body = mwwActBody(g, i, acts, names);
  } else {
    const k = g.calls.indexOf(role);
    const when = k < 0 ? 'Vai của bạn không thức dậy ban đêm.' : k < g.turn ? 'Lượt của bạn đêm nay đã qua.' : 'Chưa đến lượt của bạn.';
    body = `
      <div class="secret night">${wwArt(role)}<div class="who">Bạn là ${WW_ROLES[role].label}</div><p class="muted">${when} Nhắm mắt nhé.</p></div>
      ${hide}`;
  }
  return `
    ${mpBar(`🌙 Đêm ${g.night}`)}
    ${mwwTimeline(g)}
    ${head}
    ${body}
    ${mpIsHost() && g.turn < g.calls.length ? '<button class="link small" data-act="mww.skip">Quản trò: bỏ qua lượt này</button>' : ''}`;
}

// Ban ngày: báo ai đã chết, rồi thảo luận theo giờ đã đặt; hết giờ tự sang bỏ phiếu
function mwwDayView() {
  const g = mp.room.g;
  const names = mpNames();
  const host = mpIsHost();
  const blocked = g.hunterPending !== null || Boolean(wwCheckWin(g));
  return `
    ${mpBar(`☀️ Ngày ${g.night}`)}
    <div class="card stack">
      ${g.deaths.length
        ? g.deaths.map((i) => `<p>💀 Đêm qua <b>${esc(names[i])}</b> đã chết. ${mwwTag(g, i)}</p>`).join('')
        : '<p>🌤️ Đêm qua bình yên, không ai chết.</p>'}
      ${mwwNotes(g, names)}
    </div>
    ${g.deadline ? `
      <div class="card row">
        ${mwwRing(g.deadline, g.talk)}
        <div><b>Thảo luận</b><p class="muted small">Còn ${wwAlive(g).length} người sống. Hết giờ, mọi người bỏ phiếu treo cổ trên máy của mình.</p></div>
      </div>` : ''}
    ${mwwGrid(g, names)}
    ${!host
      ? ''
      : blocked
        ? `<button class="btn" data-act="mww.after">${mwwAfterLabel(g, '')}</button>`
        : '<button class="btn" data-act="mww.votenow">🗳️ Bỏ phiếu ngay</button>'}`;
}

// Bỏ phiếu: ai còn sống cũng bấm chọn trên máy mình (đổi được tới khi hết 30 giây), số phiếu hiện ngay cho mọi người
function mwwVoteView() {
  const g = mp.room.g;
  const names = mpNames();
  const i = mpSeat();
  const votes = mwwVotes();
  const count = {};
  votes.forEach((t) => t >= 0 && (count[t] = (count[t] || 0) + 1));
  const mine = votes[i];
  const canVote = g.alive[i];
  const done = votes.filter((v, k) => g.alive[k] && v !== undefined).length;
  const tip = !canVote
    ? 'Bạn đã bị loại nên không bỏ phiếu.'
    : mine === undefined
      ? 'Bấm vào người bạn muốn treo cổ.'
      : 'Đã bỏ phiếu. Bạn đổi được tới khi hết giờ.';
  return `
    ${mpBar(`🗳️ Bỏ phiếu · Ngày ${g.night}`)}
    <div class="card row">
      ${mwwRing(g.deadline, WW_TIMES.turn)}
      <div><b>${tip}</b><p class="muted small">${done}/${wwAlive(g).length} người đã bỏ phiếu. Nhiều phiếu nhất sẽ lên giàn treo cổ để cả làng phán xử; hòa thì không ai lên giàn.</p></div>
    </div>
    <div class="pgrid grow">
      ${wwAlive(g).map((k) => playerCard(names[k], {
        seat: k + 1,
        cls: mine === k ? 'sel' : '',
        act: canVote && k !== i ? 'mww.vote' : '',
        i: k,
        extra: count[k] ? `<span class="score">${count[k]} phiếu</span>` : '',
      })).join('')}
    </div>
    ${canVote ? `<button class="btn ghost" data-act="mww.vote" data-i="-1">${mine === -1 ? '✓ Bạn đã chọn bỏ qua' : 'Bỏ qua, không treo ai'}</button>` : ''}
    ${mpIsHost() ? '<button class="link small" data-act="mww.tally">Chủ phòng: kết thúc bỏ phiếu ngay</button>' : ''}`;
}

// Ai bỏ phiếu cho ai, để cả làng cùng xem lại
function mwwBallots(g, names) {
  const by = {};
  g.ballots.forEach((t, k) => t !== null && (by[t] ||= []).push(esc(names[k])));
  const rows = Object.entries(by)
    .sort(([a, x], [b, y]) => (a < 0) - (b < 0) || y.length - x.length)
    .map(([t, who]) => `<p><b>${t < 0 ? 'Bỏ qua' : esc(names[t])}</b>: ${who.length} phiếu <span class="muted small">(${who.join(', ')})</span></p>`);
  return `<div class="card stack small">${rows.join('') || '<p class="muted">Không ai bỏ phiếu.</p>'}</div>`;
}

// Ai treo, ai tha người trên giàn
function mwwVerdictList(g, names) {
  const who = (kill) => g.verdicts.map((v, k) => (v === kill ? esc(names[k]) : null)).filter(Boolean);
  const row = (label, list) => `<p><b>${label}</b>: ${list.length} <span class="muted small">${list.length ? `(${list.join(', ')})` : ''}</span></p>`;
  return `<div class="card stack small">${row('☠️ Treo', who(true))}${row('🙏 Tha', who(false))}</div>`;
}

// Phán xử: người nhiều phiếu nhất đứng trên giàn treo cổ, mọi người còn lại chọn Treo hay Tha trong 30 giây
function mwwTrialView() {
  const g = mp.room.g;
  const names = mpNames();
  const i = mpSeat();
  const a = g.accused;
  const verdicts = mwwVerdicts();
  const kill = verdicts.filter((v) => v === true).length;
  const save = verdicts.filter((v) => v === false).length;
  const mine = verdicts[i];
  const canVote = g.alive[i] && i !== a;
  const tip = i === a
    ? 'Bạn đang đứng trên giàn treo cổ. Thanh minh đi!'
    : !canVote
      ? 'Bạn đã bị loại nên không phán xử.'
      : mine === undefined
        ? `Treo hay tha ${esc(names[a])}?`
        : 'Đã chọn. Bạn đổi được tới khi hết giờ.';
  return `
    ${mpBar(`🪢 Phán xử · Ngày ${g.night}`)}
    <div class="card row">
      ${mwwRing(g.deadline, WW_TIMES.turn)}
      <div class="stack">
        <p><b>${esc(names[a])}</b> bị đưa lên giàn treo cổ. <b>${tip}</b></p>
        <p class="muted small">☠️ Treo: ${kill} · 🙏 Tha: ${save}. Treo nhiều hơn Tha thì bị treo cổ; hòa thì được tha.</p>
      </div>
    </div>
    ${canVote ? `
      <div class="row">
        <button class="btn ${mine === true ? '' : 'ghost'} grow" data-act="mww.verdict" data-kill="1">${mine === true ? '✓ ' : ''}☠️ Treo</button>
        <button class="btn ${mine === false ? '' : 'ghost'} grow" data-act="mww.verdict" data-kill="0">${mine === false ? '✓ ' : ''}🙏 Tha</button>
      </div>` : ''}
    ${mpIsHost() ? '<button class="link small" data-act="mww.judge">Chủ phòng: kết thúc phán xử ngay</button>' : ''}`;
}

function mwwRevealView() {
  const g = mp.room.g;
  const names = mpNames();
  const i = g.out;
  const role = i === null ? null : WW_ROLES[g.roles[i]];
  return `
    ${mpBar('Kết quả bỏ phiếu')}
    <div class="secret reveal">
      ${i === null && g.spared !== null && g.spared !== undefined
        ? `<div class="emoji">🙏</div><p class="muted">Dân làng tha cho <b>${esc(names[g.spared])}</b></p><p class="muted small">${esc(names[g.spared])} xuống giàn và chơi tiếp.</p>`
        : i === null
        ? '<div class="emoji">🤝</div><p class="muted">Không ai bị treo cổ</p><p class="muted small">Phiếu hòa hoặc không ai bị chọn.</p>'
        : `${g.shown[i] ? wwArt(g.roles[i]) : '<div class="emoji">⚰️</div>'}
          <p class="muted">${esc(names[i])} bị treo cổ</p>
          ${g.shown[i] ? `<div class="role ${role.tag}">${role.label.toUpperCase()}</div>` : '<p class="muted">Vai trò được giữ kín.</p>'}`}
      ${mwwNotes(g, names)}
    </div>
    ${g.verdicts ? mwwVerdictList(g, names) : ''}
    ${g.ballots ? mwwBallots(g, names) : ''}
    ${mpIsHost()
      ? `<button class="btn" data-act="mww.after">${mwwAfterLabel(g, '🌙 Sang đêm tiếp theo')}</button>`
      : '<p class="muted small center">Chờ chủ phòng sang bước tiếp theo…</p>'}`;
}

function mwwHunterView() {
  const g = mp.room.g;
  const names = mpNames();
  const hunter = names[g.hunterPending];
  const me = mpSeat() === g.hunterPending;
  return `
    ${mpBar('🏹 Thợ săn ra tay')}
    <div class="role-card special">${wwArt('hunter')}<p><b>${esc(hunter)}</b> là Thợ săn! Trước khi chết, Thợ săn được bắn một người.</p></div>
    ${me ? '' : `<p class="muted small center">Chờ ${esc(hunter)} chọn trên máy của mình…</p>`}
    ${mwwGrid(g, names, me)}
    ${me ? `<button class="btn" data-act="mww.shoot" ${mpSel === null ? 'disabled' : ''}>
        ${mpSel === null ? 'Chọn một người' : `Bắn ${esc(names[mpSel])}`}
      </button>` : ''}
    ${!me && mpIsHost() ? '<button class="link small" data-act="mww.noshot">Thợ săn đã rời phòng? Bỏ qua lượt bắn</button>' : ''}`;
}

function mwwEndView() {
  const g = mp.room.g;
  const names = mpNames();
  const wolfWin = g.winner === 'wolf';
  return `
    ${mpBar('Kết thúc ván')}
    <div class="center stack">
      ${wwArt(wolfWin ? 'wolf' : 'villager')}
      <h2>${wolfWin ? 'Ma Sói thắng!' : 'Dân làng thắng!'}</h2>
      <p class="muted">${wolfWin ? 'Bầy sói đã áp đảo dân làng.' : 'Con sói cuối cùng đã bị tiêu diệt.'} Ván chơi kéo dài ${g.night} đêm.</p>
    </div>
    <div class="pgrid grow">
      ${g.roles.map((role, i) => playerCard(names[i], {
        seat: i + 1,
        cls: g.alive[i] ? '' : 'out',
        extra: `${wwTag(role)}${mp.room.seats[i].bot ? '' : `<span class="score">${pointsOf('ww', names[i])} điểm</span>`}`,
      })).join('')}
    </div>
    ${mpIsHost()
      ? `<button class="btn" data-act="mp.start" ${mpCount() >= wwNeed() ? '' : 'disabled'}>Ván mới với người đang trong phòng</button>
        <button class="btn ghost" data-act="mp.lobby">Về phòng chờ, đổi thiết lập</button>`
      : '<p class="muted small center">Chờ chủ phòng bắt đầu ván mới…</p>'}`;
}

const MWW_VIEWS = { night: mwwNightView, day: mwwDayView, vote: mwwVoteView, trial: mwwTrialView, reveal: mwwRevealView, hunter: mwwHunterView, end: mwwEndView };

views['mp.room'] = () => {
  if (!mp) return views['mp.home']();
  if (!mp.ready) return `${mpBar('Đang vào phòng…')}<div class="card"><p class="muted">Đang tải phòng ${esc(mp.id)}…</p></div>`;
  if (!mp.room) {
    return `${mpBar('Phòng đã đóng')}
      <div class="card"><p>Chủ phòng đã đóng phòng này.</p></div>
      <button class="btn" data-act="mp.leavenow">Về danh sách phòng</button>`;
  }
  const g = mp.room.g;
  if (mp.room.phase !== 'play' || !g) return mpLobby();
  if (mpSeat() < 0) {
    return `${mpBar('🐺 Đang chơi')}
      <div class="card"><p>Ván đang diễn ra. Bạn sẽ được chia vai ở ván sau.</p></div>
      ${g.step === 'night' ? mwwTimeline(g) : ''}
      ${mwwGrid(g, mpNames())}`;
  }
  return MWW_VIEWS[g.step]();
};

// Làng 3D (village.js): ở trong phòng thì vào làng, đưa sang đó ai đang chơi, ai còn sống, số phiếu và ngày/đêm.
// Ngoài phòng thì ra khỏi làng.
function mwwScene() {
  const village = window.Village;
  if (!village) return;
  if (view !== 'mp.room' || !mp?.ready || !mp.room) return village.leave();
  const room = mp.room;
  const g = room.phase === 'play' ? room.g : null;
  const seats = g
    ? room.seats
    : [...mpMembers().map(([uid, p]) => ({ uid, name: p.name })), ...mpBots().map((b) => ({ uid: b.id, name: b.name, bot: true }))];
  const votes = {};
  if (g?.step === 'vote') mwwVotes().forEach((t) => t >= 0 && (votes[t] = (votes[t] || 0) + 1));
  const night = g?.step === 'night';
  const roam = mwwRoam();
  // Sói biết nhau: máy của Sói thấy đồng bọn đi lại ban đêm và hiện hình người sói
  const iWolf = Boolean(g) && g.roles[mpSeat()] === 'wolf';
  village.enter(mp.id, myId);
  village.sync({
    night,
    roam: roam && { picks: roam, picked: mpPick },
    accused: g ? room.seats[g.step === 'trial' ? g.accused : g.step === 'reveal' ? g.out ?? g.spared ?? -1 : -1]?.uid ?? null : null,
    players: seats.map((s, i) => ({
      id: s.uid,
      name: s.name,
      color: avatarColor(s.name),
      seat: i,
      bot: Boolean(s.bot),
      alive: g ? g.alive[i] : true,
      votes: votes[i] || 0,
      isMe: s.uid === myId,
      ally: s.uid === myId || (iWolf && g.roles[i] === 'wolf'),
      wolf: iWolf && g.roles[i] === 'wolf',
    })),
  });
  // Ban đêm chỉ vai đang được gọi đi lại được; còn lại bảng mở rộng để xem vai
  document.body.classList.toggle('v-night', night);
  document.body.classList.toggle('v-roam', Boolean(roam));
}

// Ban đêm, đến lượt vai của mình (còn sống, đã mở máy, chưa chọn): những ghế chọn được, không thì null
function mwwRoam() {
  const g = mp?.room?.phase === 'play' ? mp.room.g : null;
  if (g?.step !== 'night' || !mpShow) return null;
  const i = mpSeat();
  if (i < 0 || !g.alive[i]) return null;
  if (g.roles[i] !== g.calls[g.turn] || mwwActs()[i]) return null;
  return wwTargets(g, i);
}
AFTER_RENDER.push(mwwScene);
addEventListener('village-ready', () => render());
// Đi tới cửa nhà ai trong làng thì chọn người đó
addEventListener('village-pick', (e) => {
  if (!mwwRoam()?.includes(e.detail)) return;
  mpPick = e.detail;
  render();
});
actions['v.sheet'] = () => document.body.classList.toggle('sheet-min');

modals['mp.name'] = () => `
  <h2>Tên của bạn</h2>
  <form class="guess" data-form="mp.name">
    <input id="mp-name-input" name="name" type="text" maxlength="16" autocomplete="off" placeholder="Tên người chơi">
    <button class="btn">Lưu</button>
  </form>
  <button class="btn ghost" data-act="close">Hủy</button>`;

forms['mp.name'] = (form) => {
  const typed = form.elements.name.value.trim();
  if (!typed) return;
  mpSetName(roster().find((r) => r.toLowerCase() === typed.toLowerCase()) || typed);
  modal = null;
};

document.addEventListener('change', (e) => {
  if (e.target.id !== 'mp-name') return;
  if (e.target.value === NEW_NAME) modal = { type: 'mp.name' };
  else mpSetName(e.target.value);
  mpMsg = '';
  render();
  if (modal) document.querySelector('#mp-name-input')?.focus();
});

/* ---------- Actions ---------- */

const needName = () => !mpName && (mpMsg = 'Chọn tên của bạn trước.');

// Bot mới lấy số nhỏ nhất chưa dùng: 🤖 Bot 1, 🤖 Bot 2…
function mpNewBot(bots) {
  let k = 1;
  while (bots.some((b) => b.id === `bot-${k}`)) k++;
  return { id: `bot-${k}`, name: `🤖 Bot ${k}` };
}

function mpStart() {
  mpUpdate((r) => {
    r.seats = [
      ...mpMembers().map(([uid, p]) => ({ uid, name: p.name })),
      ...(r.bots || []).map((b) => ({ uid: b.id, name: b.name, bot: true })),
    ];
    r.phase = 'play';
    r.g = mwwNew(r.seats);
  });
  // Đọc ngay trong lúc bấm để trình duyệt cho phép phát tiếng các lượt sau
  mwwNarrate();
}

Object.assign(actions, {
  'ww.step': (el) => {
    wwCfg.wolves = Math.max(1, wwCfg.wolves + Number(el.dataset.d));
    fixWW();
  },
  'ww.toggle': (el) => {
    wwCfg[el.dataset.key] = !wwCfg[el.dataset.key];
    fixWW();
  },
  'ww.num': (el) => {
    wwCfg[el.dataset.key] = Math.min(10, Math.max(1, wwCfg[el.dataset.key] + Number(el.dataset.d)));
    fixWW();
  },
  'mww.voice': () => {
    wwVoiceOn = !wwVoiceOn;
    save('dmi.voice', wwVoiceOn);
    if (!wwVoiceOn) wwSay([], wwDone);
  },
  'mp.create': () => {
    if (!needName()) mpCreate();
  },
  'mp.enter': (el) => {
    if (needName()) return;
    mpEnter(el.dataset.id, true);
  },
  'mp.join': () => {
    if (!needName()) mpJoin();
  },
  'mp.bot': (el) =>
    mpUpdate((r) => {
      const bots = r.bots || [];
      r.bots = Number(el.dataset.d) > 0 ? [...bots, mpNewBot(bots)] : bots.slice(0, -1);
    }),
  'mp.fillbots': () =>
    mpUpdate((r) => {
      r.bots ||= [];
      while (mpMembers().length + r.bots.length < wwNeed()) r.bots.push(mpNewBot(r.bots));
    }),
  'mp.takehost': () =>
    mpUpdate((r) => {
      r.host = myId;
      r.hostName = mpName;
    }),
  'mp.leave': () =>
    (modal = {
      type: 'confirm',
      title: 'Rời phòng?',
      text: mpIsHost() && mp.room?.phase !== 'play'
        ? 'Bạn là chủ phòng nên phòng sẽ được đóng.'
        : 'Nếu ván đang chơi, người khác có thể nhận làm chủ phòng hoặc bỏ qua lượt của bạn.',
      yes: 'Rời phòng',
      act: 'mp.leavenow',
    }),
  'mp.leavenow': () => {
    modal = null;
    if (mp?.room) {
      const path = mpIsHost() && mp.room.phase !== 'play' ? `/rooms/${mp.id}` : `/rooms/${mp.id}/players/me`;
      mpWriting.then(() => api('DELETE', path)).catch(() => {});
    }
    mpStop();
    mpMsg = '';
    go('mp.home');
  },
  'mp.start': mpStart,
  'mp.quit': () =>
    (modal = {
      type: 'confirm',
      title: 'Hủy ván đang chơi?',
      text: 'Ván này sẽ bị hủy và không tính điểm. Mọi người quay về phòng chờ.',
      yes: 'Hủy ván',
      act: 'mp.lobby',
    }),
  'mp.lobby': () => {
    modal = null;
    wwSay([]);
    mpUpdate((r) => {
      r.phase = 'lobby';
      r.g = null;
    });
  },
  'mp.sel': (el) => (mpSel = Number(el.dataset.i)),
  'mww.show': () => (mpShow = !mpShow),
  'mww.pick': (el) => {
    const k = Number(el.dataset.i);
    // Phù thủy được bỏ chọn vì thuốc độc không bắt buộc
    mpPick = mpPick === k && mp.room.g.roles[mpSeat()] === 'witch' ? null : k;
  },
  'mww.heal': () => (mpHeal = !mpHeal),
  'mww.confirm': () => {
    const g = mp.room.g;
    mpWritePlayer({ ...mp.players[myId], act: { game: g.id, night: g.night, pick: mpPick, heal: mpHeal, at: Date.now() } });
  },
  'mww.skip': () => {
    const g = mp.room.g;
    if (g.turn < 0) wwSay([], () => mwwTurn(g, 0));
    else mwwSleep(g);
  },
  'mww.after': () => mpUpdate(mwwAfter),
  'mww.votenow': () => mwwStartVote(),
  'mww.tally': () => mwwTally(),
  'mww.judge': () => mwwJudge(),
  'mww.verdict': (el) => {
    const g = mp.room.g;
    mpWritePlayer({ ...mp.players[myId], verdict: { game: g.id, night: g.night, kill: el.dataset.kill === '1', at: Date.now() } });
  },
  'mww.vote': (el) => {
    const g = mp.room.g;
    mpWritePlayer({ ...mp.players[myId], vote: { game: g.id, night: g.night, target: Number(el.dataset.i), at: Date.now() } });
  },
  'mww.shoot': () =>
    mpUpdate((r) => {
      mwwShoot(r.g, mpSel);
      r.g.step = r.g.back;
      if (r.g.step === 'day') mwwTalk(r.g);
    }),
  'mww.noshot': () =>
    mpUpdate((r) => {
      r.g.hunterShot = true;
      r.g.hunterPending = null;
      r.g.step = r.g.back;
      if (r.g.step === 'day') mwwTalk(r.g);
    }),
});

GAMES.push({
  id: 'ww',
  name: 'Ma Sói',
  icon: '🐺',
  desc: 'Mỗi người một điện thoại, máy chủ phòng làm quản trò.',
  meta: `${WW_MIN}–${MAX_PLAYERS} người · thiếu người thì thêm bot`,
  setup: 'mp.home',
  rules: () => `
    <h2>Luật chơi Ma Sói</h2>
    <div class="rules">
      <ul>
        <li>Mỗi người dùng điện thoại riêng, cùng vào một phòng. Máy của chủ phòng là quản trò: đọc lời dẫn, gọi từng vai thức dậy. Nên đặt máy đó giữa bàn.</li>
        <li><b>Ban đêm</b> quản trò gọi lần lượt: Bảo vệ → Ma Sói → Tiên tri → Phù thủy. Vai được gọi che màn hình, mở máy và chọn; các vai khác nhắm mắt. Vai đã chết vẫn được gọi để không ai đoán ra.</li>
        ${Object.values(WW_ROLES).map((r) => `<li><b>${r.emoji} ${r.label}</b>: ${r.desc}.</li>`).join('')}
        <li>Nhiều Sói: nạn nhân là người được chọn nhiều nhất; nếu hòa, Sói chọn sau cùng quyết định.</li>
        <li>Mỗi lượt gọi vai có 30 giây (vòng tròn đếm ngược); hết giờ thì quản trò gọi vai tiếp theo.</li>
        <li><b>Ban ngày</b> quản trò báo ai đã chết, cả làng thảo luận theo số phút chủ phòng đặt. Hết giờ, ai còn sống bỏ phiếu treo cổ trên máy mình trong 30 giây; nhiều phiếu nhất bị treo, hòa thì không ai bị treo.</li>
        <li>Thiếu người thì chủ phòng thêm bot: bot chọn ngẫu nhiên ban đêm, không biết nói và không được tính điểm.</li>
        <li><b>Dân làng thắng</b> khi diệt hết Sói. <b>Ma Sói thắng</b> khi số Sói bằng hoặc nhiều hơn số người còn lại.</li>
        <li>Điểm: phe Dân thắng +${WW_POINTS.village} mỗi người, phe Sói thắng +${WW_POINTS.wolf} mỗi Sói.</li>
      </ul>
    </div>`,
});

<script>
// Dữ liệu online trên DMI Workspace (server/boardgame.ts), chơi không cần đăng nhập:
// - danh sách người chơi là nhân viên đang làm việc trong DMI Workspace (thêm, bớt nhân viên ở trang Quản trị);
// - bảng xếp hạng chung của mọi máy (đặt lại cần tài khoản quản trị DMI Workspace đang đăng nhập trên trình duyệt);
// - các cặp từ Gián Điệp đã ra, để máy nào chơi cũng không gặp lại.
// Không kết nối được máy chủ thì vẫn chơi được một máy với dữ liệu lưu trên máy này.
let online = false;
let onlineDone = false;
let canReset = false;

// Mã người chơi ẩn danh của trình duyệt này, kèm khóa bí mật để chỉ trình duyệt này sửa được lượt của mình
const newId = () => crypto.randomUUID().replace(/-/g, '');
const myId = load('dmi.pid', null) || newId();
const myKey = load('dmi.pkey', null) || newId() + newId();
save('dmi.pid', myId);
save('dmi.pkey', myKey);

async function api(method, path, body) {
  const res = await fetch(`/api/boardgame${path}`, {
    method,
    headers: { 'content-type': 'application/json', 'x-bg-player': myId, 'x-bg-key': myKey },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || 'Không kết nối được máy chủ'), { status: res.status });
  return data;
}

// Không vẽ lại khi đang gõ để khỏi mất chữ trong ô nhập
const renderIfIdle = () => {
  if (!document.activeElement?.matches('input')) render();
};

async function loadRoster() {
  try {
    const { names } = await api('GET', '/roster');
    sharedRoster = names.length ? names : null;
    renderIfIdle();
  } catch {}
}

// Bảng xếp hạng và lịch sử cộng lại từ các ván trên máy chủ
async function loadBoard() {
  try {
    const board = await api('GET', '/board');
    canReset = board.canReset;
    stats = {};
    board.games.forEach(({ game, results }) => addResults(game, results));
    gameLog = board.games.slice(0, LOG_LIMIT).map(({ t, game, text, results }) => ({ t, game, text, n: results.length }));
    online = true;
    renderIfIdle();
  } catch {}
}

// Ghi không được thì giữ trên máy này như khi không có mạng
const saveGame = (record) =>
  api('POST', '/games', record).then(loadBoard, () => {
    save('dmi.stats', stats);
    save('dmi.log', gameLog);
  });

// Lần đầu gửi kèm các cặp đã ra trên máy này, sau đó danh sách trên máy chủ là chuẩn
let spySynced = false;
async function loadSpyUsed() {
  try {
    const { pairs } = spySynced ? await api('GET', '/spy-used') : await api('POST', '/spy-used', { add: spyUsed });
    spySynced = true;
    spyUsed = pairs;
    save('gd.used', spyUsed);
  } catch {}
}

function saveSpyUsed(pair, forget) {
  if (!online) return;
  api('POST', '/spy-used', { add: [pair], forget }).then(({ pairs }) => {
    spyUsed = pairs;
    save('gd.used', spyUsed);
  }, () => {});
}

ENTER.home = loadBoard;
ENTER.board = loadBoard;
ENTER['spy.setup'] = loadSpyUsed;

(async () => {
  await Promise.all([loadRoster(), loadBoard(), loadSpyUsed()]);
  onlineDone = true;
  if (online) mpResume();
  renderIfIdle();
})();

</script>
<script>
// Trang chủ DMI Boardgame và bảng xếp hạng. Nạp sau core.js và các file game.
let boardTab = 'all';

const boardRows = () => {
  const ids = boardTab === 'all' ? GAMES.map((game) => game.id) : [boardTab];
  const rows = {};
  ids.forEach((id) => {
    Object.entries(stats[id] || {}).forEach(([name, s]) => {
      const row = (rows[name] ||= { name, p: 0, g: 0, w: 0 });
      row.p += s.p;
      row.g += s.g;
      row.w += s.w;
    });
  });
  return Object.values(rows).sort((a, b) => b.p - a.p || b.w - a.w || a.name.localeCompare(b.name));
};

const logDate = (t) => {
  const d = new Date(t);
  const pad = (x) => String(x).padStart(2, '0');
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};

views.home = () => `
  <header class="brand">
    <div class="logo">🎲</div>
    <h1>DMI <span>BOARDGAME</span></h1>
    <p class="muted">Bộ trò chơi cho cả team</p>
  </header>
  <div class="games grow">
    ${GAMES.map((game) => `
      <button class="gcard" data-act="go" data-view="${game.setup}">
        <span class="gicon">${game.icon}</span>
        <span class="gbody">
          <span class="gname">${game.name}</span>
          <span class="muted small">${game.desc}</span>
          <span class="muted small">${game.meta}</span>
        </span>
        <span class="go">›</span>
      </button>`).join('')}
    <div class="gcard soon">
      <span class="gicon">➕</span>
      <span class="gbody">
        <span class="gname">Sắp có thêm game</span>
        <span class="muted small">Các trò chơi mới sẽ dùng chung danh sách thành viên và bảng xếp hạng.</span>
      </span>
    </div>
  </div>
  <button class="btn ghost" data-act="go" data-view="board">🏆 Bảng xếp hạng</button>`;

views.board = () => {
  const rows = boardRows();
  const tabs = [{ id: 'all', name: 'Tất cả' }, ...GAMES];
  return `
    <div class="topbar">
      <button class="back" data-act="go" data-view="home">←</button>
      <h2>🏆 Bảng xếp hạng</h2>
    </div>
    <div class="chips">
      ${tabs.map((tab) => `
        <button class="chip ${boardTab === tab.id ? 'on' : ''}" data-act="boardtab" data-id="${tab.id}">${tab.name}</button>`).join('')}
    </div>
    <div class="list">
      ${rows.length ? rows.map((row, k) => `
        <div class="lrow">
          <span class="rank">${k + 1}</span>
          ${avatar(row.name)}
          <span class="lname"><b>${esc(row.name)}</b><span class="muted small">${row.w} thắng / ${row.g} ván</span></span>
          <span class="pts">${row.p} điểm</span>
        </div>`).join('')
      : '<div class="card"><p class="muted">Chưa có ván nào. Chơi xong một ván là tên và điểm sẽ hiện ở đây.</p></div>'}
    </div>
    <h3>Lịch sử ván chơi</h3>
    <div class="card stack grow">
      ${gameLog.length ? gameLog.map((item) => `
        <div class="hrow">
          <time>${logDate(item.t)}</time>
          <span>${GAMES.find((game) => game.id === item.game)?.icon || '🎲'} ${esc(item.text)} · ${item.n} người</span>
        </div>`).join('')
      : '<p class="muted">Chưa có ván nào được ghi lại.</p>'}
    </div>
    ${(rows.length || gameLog.length) && (!online || canReset)
      ? '<button class="link small" data-act="resetboard">Đặt lại bảng xếp hạng</button>' : ''}`;
};

actions.boardtab = (el) => (boardTab = el.dataset.id);
actions.resetboard = () =>
  (modal = {
    type: 'confirm',
    title: 'Đặt lại bảng xếp hạng?',
    text: 'Toàn bộ điểm và lịch sử ván chơi sẽ bị xóa. Danh sách thành viên vẫn được giữ.',
    yes: 'Xóa điểm và lịch sử',
    act: 'resetboardnow',
  });
actions.resetboardnow = () => {
  modal = null;
  stats = {};
  gameLog = [];
  // Bảng online: chỉ ghi mốc đặt lại, các ván cũ vẫn còn trên máy chủ nhưng không được cộng nữa
  if (online) return void api('POST', '/board/reset').then(loadBoard, () => {});
  save('dmi.stats', stats);
  save('dmi.log', gameLog);
};

render();

</script>
