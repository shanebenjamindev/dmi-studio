<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DMI Boardgame</title>
<link rel="icon" href="/brand/mark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Grenze+Gotisch:wght@600;800&display=swap">
<style>
/* Nền gradient xanh chéo (chàm dưới-trái → cyan trên-phải), thẻ người chơi dạng lưới 3 cột trên nền kính tối */
:root {
  --g1: #1A4FE0;
  --g2: #1E88F0;
  --g3: #2EC5F5;
  --card: rgba(7, 20, 66, .62);
  --card-2: rgba(255, 255, 255, .16);
  --field: rgba(3, 10, 40, .45);
  --sheet: #0e2a8c;
  --line: rgba(255, 255, 255, .2);
  --text: #ffffff;
  --muted: #d9e8ff;
  --accent: #ffffff;
  --on-accent: #1A4FE0;
  --civ: #5cf2a5;
  --spy: #ff6b7a;
  --white: #f1f5f9;
  --gold: #ffd84d;
  --on-gold: #0b1e63;
  --radius: 16px;
  --font: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { height: 100%; }

html, body {
  margin: 0;
  min-height: 100%;
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.45;
}

html { background: var(--g1); }

body {
  display: flex;
  flex-direction: column;
  background: var(--g2) linear-gradient(to top right, var(--g1) 0%, var(--g2) 50%, var(--g3) 100%);
}

#app {
  flex: 1;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding-block: 20px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}

h1, h2, h3, p { margin: 0; }
h2 { font-size: 1.35rem; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.center { text-align: center; }
.grow { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }

/* Buttons */
button, select { font: inherit; color: inherit; cursor: pointer; border: 0; touch-action: manipulation; }
.btn {
  width: 100%;
  padding: 16px;
  border-radius: var(--radius);
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 800;
  font-size: 1.05rem;
  box-shadow: 0 6px 18px rgba(4, 16, 70, .28);
  transition: transform .08s, opacity .15s;
}
.btn:active { transform: scale(.98); opacity: .9; }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.ghost { background: var(--card-2); color: var(--text); box-shadow: none; }
.link { background: none; color: var(--muted); padding: 8px; text-decoration: underline; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}

/* Home */
.hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.hero .logo { font-size: 5.5rem; line-height: 1; filter: drop-shadow(0 10px 24px rgba(4, 16, 70, .45)); }
.hero h1 { font-size: 2.8rem; letter-spacing: .08em; font-weight: 900; }
.hero h1 span { color: var(--gold); }

.topbar { display: flex; align-items: center; gap: 8px; }
.topbar h2 { flex: 1; }
.back { width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--card); font-size: 1.2rem; }

.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 40px; border-radius: 12px; background: var(--card-2); font-size: 1.3rem; font-weight: 700; }
.stepper button:disabled { opacity: .3; }
.stepper b { min-width: 36px; text-align: center; font-size: 1.2rem; font-variant-numeric: tabular-nums; }

input[type="text"], .guess input {
  flex: 1; min-width: 0; width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--text);
  font: inherit; font-size: 16px;
}
input:focus { outline: 2px solid var(--gold); outline-offset: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 12px;
  border-radius: 999px;
  background: var(--field);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: .9rem;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }

.role-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.role-dot.civ { background: var(--civ); }
.role-dot.spy { background: var(--spy); }
.role-dot.white { background: var(--white); }

/* Lưới thẻ người chơi */
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-content: start; }
.pcard {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  min-width: 0;
  padding: 22px 6px 10px;
  border-radius: var(--radius);
  background: var(--card);
  border: 2px solid transparent;
  text-align: center;
}
.pcard .seat {
  position: absolute; top: 6px; left: 9px;
  font-size: .72rem; font-weight: 700; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.pcard .pname { max-width: 100%; font-weight: 700; font-size: .92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .score { font-size: .85rem; font-weight: 800; color: var(--gold); }
.pcard.sel { border-color: var(--spy); background: rgba(90, 10, 40, .6); }
.pcard.first { border-color: var(--gold); }
.pcard.out { opacity: .5; }
.pcard.out .pname { text-decoration: line-through; }
.pcard select {
  width: 100%;
  padding: 7px 4px;
  border-radius: 10px;
  background: var(--card-2);
  font-size: 16px;
  font-weight: 600;
  text-align: center;
  text-align-last: center;
  appearance: none;
  -webkit-appearance: none;
}
.pcard.empty .avatar { background: var(--card-2) !important; }

.avatar {
  width: 54px; height: 54px; flex: none;
  border-radius: 50%;
  display: grid; place-items: center;
  color: #fff;
  font-weight: 700; font-size: 1.05rem; letter-spacing: .02em;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .22);
}
.avatar.big { width: 96px; height: 96px; font-size: 1.9rem; }

.tag { padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 700; white-space: nowrap; }
.tag.civ { background: rgba(92, 242, 165, .16); color: var(--civ); }
.tag.spy { background: rgba(255, 107, 122, .2); color: var(--spy); }
.tag.white { background: rgba(241, 245, 249, .18); color: var(--white); }
.tag.first { background: var(--gold); color: var(--on-gold); }

/* Deal & reveal */
.secret {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 28px 20px;
  min-height: 340px;
}
.secret .emoji { font-size: 4rem; line-height: 1; }
.secret .who { font-size: 1.9rem; font-weight: 800; }
.secret .word {
  font-size: 2.3rem;
  font-weight: 900;
  color: var(--gold);
  word-break: break-word;
  animation: pop .25s ease-out;
}
.progress { height: 6px; border-radius: 3px; background: var(--card); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--gold); transition: width .3s; }

@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.reveal .role { font-size: 2rem; font-weight: 900; animation: pop .3s ease-out; }
.role.civ { color: var(--civ); }
.role.spy { color: var(--spy); }
.role.white { color: var(--white); }

.guess { display: flex; gap: 8px; width: 100%; }
.guess .btn { width: auto; padding: 14px 18px; }

.words { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.words .card { text-align: center; padding: 14px 8px; }
.words b { display: block; font-size: 1.25rem; margin-top: 4px; word-break: break-word; }

/* Modal */
.modal {
  position: fixed; inset: 0;
  background: rgba(3, 10, 40, .72);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 10;
}
.modal[hidden] { display: none; }
.sheet {
  width: 100%; max-width: 480px; max-height: 88dvh;
  overflow-y: auto;
  background: var(--sheet);
  border-radius: 24px 24px 0 0;
  padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.rules li { margin-bottom: 8px; }
.rules ul { margin: 0; padding-left: 20px; }

/* Trang chủ & bảng xếp hạng */
.brand { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding-block: 18px 6px; }
.brand .logo { font-size: 4rem; line-height: 1; filter: drop-shadow(0 10px 24px rgba(4, 16, 70, .45)); }
.brand h1 { font-size: 2.1rem; font-weight: 900; letter-spacing: .06em; }
.brand h1 span { color: var(--gold); }

.games { display: flex; flex-direction: column; gap: 12px; }
.gcard {
  display: flex; align-items: center; gap: 14px;
  width: 100%;
  padding: 16px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--line);
  text-align: left;
}
.gcard .gicon { font-size: 2.6rem; line-height: 1; flex: none; }
.gcard .gbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.gcard .gname { font-size: 1.2rem; font-weight: 800; }
.gcard .go { font-size: 1.6rem; color: var(--gold); }
.gcard.soon { opacity: .7; border-style: dashed; }

.list { display: flex; flex-direction: column; gap: 8px; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--card); }
.lrow .rank { width: 26px; flex: none; text-align: center; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.lrow .avatar { width: 40px; height: 40px; font-size: .85rem; }
.lrow .lname { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.lrow .lname b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .pts { font-weight: 800; color: var(--gold); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hrow { display: flex; gap: 10px; align-items: baseline; font-size: .9rem; }
.hrow time { flex: none; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.hrow span { min-width: 0; }

/* Ma Sói */
/* Công tắc trượt kiểu iPhone (iosSwitch): chữ bên trái, công tắc bên phải */
.ios { display: inline-flex; align-items: center; gap: 10px; flex: none; padding: 0; background: none; color: var(--text); font-weight: 700; font-size: .95rem; text-align: left; }
.ios i { position: relative; flex: none; width: 51px; height: 31px; border-radius: 999px; background: rgba(120, 120, 128, .4); transition: background .2s; }
.ios i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .18), 0 1px 1px rgba(0, 0, 0, .16); transition: transform .2s; }
.ios.on i { background: #34c759; }
.ios.on i::after { transform: translateX(20px); }
.ios.sm { font-size: .85rem; gap: 6px; }
.ios.sm i { width: 42px; height: 26px; }
.ios.sm i::after { width: 22px; height: 22px; }
.ios.sm.on i::after { transform: translateX(16px); }
.tag.wolf { background: rgba(255, 107, 122, .2); color: var(--spy); }
.tag.special { background: rgba(255, 216, 77, .18); color: var(--gold); }
.tag.villager { background: rgba(92, 242, 165, .16); color: var(--civ); }
.role.wolf { color: var(--spy); }
.role.special { color: var(--gold); }
.role.villager { color: var(--civ); }
.secret.night { background: rgba(4, 10, 44, .78); }
.info { padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: .95rem; }
.info .ios { align-self: flex-start; }
.result { font-size: 1.5rem; font-weight: 800; color: var(--gold); text-wrap: balance; }

/* Chơi nhiều máy */
.code { font-size: 2.8rem; font-weight: 900; letter-spacing: .25em; color: var(--gold); font-variant-numeric: tabular-nums; }
.field { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--field); font-size: 16px; }
button.lrow { width: 100%; text-align: left; }

/* Ảnh vai, timeline của đêm và vai đang được gọi */
.role-art { display: block; width: 168px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 18px; border: 2px solid var(--line); box-shadow: 0 10px 28px rgba(4, 16, 70, .45); margin: 0 auto; }
.role-art.emoji { display: grid; place-items: center; background: var(--card); font-size: 4.5rem; line-height: 1; }
.role-art.small { width: 56px; border-radius: 12px; }
.role-art.small.emoji { font-size: 1.9rem; }
.role-mini .role-art { width: 44px; border-radius: 10px; box-shadow: none; }
.role-mini .role-art.emoji { font-size: 1.5rem; }
.role-card { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
/* Timeline ngang: mỗi bước một vòng tròn, nối với bước trước bằng một vạch */
.timeline { list-style: none; margin: 0; padding: 6px 0 2px; display: flex; }
.timeline li { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); font-size: .7rem; font-weight: 600; text-align: center; }
.timeline li + li::before { content: ''; position: absolute; top: 19px; right: 50%; width: 100%; height: 3px; border-radius: 2px; background: var(--line); }
.timeline li.done::before, .timeline li.now::before { background: var(--civ); }
.timeline .dot { position: relative; z-index: 1; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: var(--sheet); border: 2px solid var(--line); font-size: 1.15rem; transition: transform .2s; }
.timeline .dot img { width: 100%; height: 100%; object-fit: cover; }
.timeline li.done { color: var(--civ); }
.timeline li.done .dot { border-color: var(--civ); background: #0f5a3c; color: var(--civ); font-weight: 900; }
.timeline li.now { color: var(--gold); font-weight: 800; }
.timeline li.now .dot { border-color: var(--gold); transform: scale(1.18); box-shadow: 0 0 0 4px rgba(255, 216, 77, .28); }
.calling { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); font-size: 1.15rem; }
.calling.wolf { border-color: var(--spy); }
.calling.special { border-color: var(--gold); }
.calling .role-art { margin: 0; }

/* Vòng tròn đếm ngược: vạch chạy hết vòng trong --total, bắt đầu từ chỗ đã trôi qua (--delay âm) */
.ring { position: relative; flex: none; width: 58px; height: 58px; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--gold); stroke-linecap: round; stroke-dasharray: 100; }
.ring.run .bar { animation: ring-run var(--total) linear var(--delay) forwards; }
.ring span { position: relative; font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; }
@keyframes ring-run {
  0% { stroke-dashoffset: 0; stroke: var(--gold); }
  75% { stroke: var(--gold); }
  100% { stroke-dashoffset: 100; stroke: var(--spy); }
}

/* Làng 3D (village.js): cảnh phủ cả màn hình, bảng game thành khung kéo ở dưới, cần gạt ở góc trái */
.v-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; z-index: 0; touch-action: none; }
body.in-village { background: #0b1030; }
body.in-village #app {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
  max-height: 46dvh; overflow-y: auto; overscroll-behavior: contain;
  padding-top: 0; gap: 12px;
  background: rgba(7, 20, 66, .88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, .35);
  transition: max-height .25s;
}
body.in-village.v-night #app { max-height: 80dvh; }
body.in-village.sheet-min #app { max-height: 86px; overflow: hidden; }
.sheet-handle { display: none; }
body.in-village .sheet-handle { display: block; flex: none; width: 100%; height: 20px; background: none; position: relative; }
body.in-village .sheet-handle::before { content: ''; position: absolute; left: 50%; top: 8px; width: 46px; height: 5px; margin-left: -23px; border-radius: 3px; background: rgba(255, 255, 255, .45); }
.v-stick { position: fixed; z-index: 3; left: 18px; bottom: calc(46dvh + 18px); width: 112px; height: 112px; border-radius: 50%; background: rgba(255, 255, 255, .14); border: 2px solid rgba(255, 255, 255, .4); touch-action: none; }
body.sheet-min .v-stick { bottom: 104px; }
body.v-night .v-stick, .v-stick[hidden] { display: none; }
/* Ban đêm đến lượt mình: đi lại được nên bảng thu bớt và hiện cần gạt */
body.in-village.v-night.v-roam #app { max-height: 46dvh; }
body.v-night.v-roam .v-stick { display: block; }
body.v-night.v-roam.sheet-min .v-stick { bottom: 104px; }
/* Nút hành động ở góc phải, đối diện cần gạt: chọn và xác nhận ngay trên làng */
.v-hud { position: fixed; z-index: 3; right: 14px; bottom: calc(46dvh + 14px); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; max-width: calc(100vw - 150px); }
body.sheet-min .v-hud { bottom: 100px; }
.v-hud[hidden], body:not(.in-village) .v-hud { display: none; }
.v-hud .v-target { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(7, 20, 66, .85); color: #fff; font-size: .95rem; }
.v-hud .v-target b { padding: 0 6px; }
.v-hud .v-round { width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, .18); font-weight: 800; }
.v-hud .ios { padding: 8px 10px 8px 14px; border-radius: 999px; background: rgba(7, 20, 66, .85); color: #fff; }
.v-hud .btn { width: auto; padding: 12px 20px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0, 0, 0, .4); }
.v-knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px; border-radius: 50%; background: rgba(255, 255, 255, .8); box-shadow: 0 4px 12px rgba(0, 0, 0, .3); pointer-events: none; }

/* Ma Sói kiểu thị trấn cổ: khung gỗ, thẻ người chơi bằng giấy da, chữ gothic, nền thị trấn đổi ngày/đêm (#town).
   body.salem khi ở màn Ma Sói; salem-play khi đang chơi; salem-night ban đêm; salem-gallows khi có người trên giàn treo cổ. */
#town { display: none; position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#town .t-n, #town .t-win, #town .t-gal { opacity: 0; transition: opacity 1.6s; }
#town .t-d { transition: opacity 1.6s, transform 1.6s; }
#town .t-hill2 { fill: #6e4630; transition: fill 1.6s; }
#town .t-hill1 { fill: #4e3020; transition: fill 1.6s; }
#town .t-town, #town .t-ground { fill: #2a180c; transition: fill 1.6s; }
#town .t-win { fill: #ffc861; }
#town .t-gal { fill: #7a4c28; stroke: #c9a26b; }
body.salem #town { display: block; }
body.salem-night #town .t-n, body.salem-night #town .t-win { opacity: 1; }
body.salem-night #town .t-d { opacity: 0; transform: translateY(120px); }
body.salem-night #town .t-hill2 { fill: #141b38; }
body.salem-night #town .t-hill1 { fill: #0d1229; }
body.salem-night #town .t-town, body.salem-night #town .t-ground { fill: #05070f; }
body.salem-gallows #town .t-gal { opacity: 1; }
:root:has(body.salem) { background: #151820; }
/* Bảng màu: nền #151820 / #211F24, gỗ sẫm #30241F, giấy da #D8C49A, đỏ máu #8F2929, vàng cổ #C5A46D, xanh rêu #526B52.
   Chữ đọc trên nền tối dùng bản sáng hơn của đỏ và xanh. Góc bo nhỏ cho ra chất gỗ, sắt, giấy. */
body.salem {
  --radius: 6px;
  --card: rgba(33, 31, 36, .95);
  --card-2: rgba(216, 196, 154, .12);
  --field: rgba(21, 24, 32, .8);
  --sheet: #211F24;
  --line: rgba(197, 164, 109, .35);
  --text: #efe4cc;
  --muted: #b9a98a;
  --accent: #D8C49A;
  --on-accent: #2a1d14;
  --gold: #C5A46D;
  --on-gold: #2a1d14;
  --civ: #8fbf8f;
  --spy: #e0786b;
  --blood: #8F2929;
  --moss: #526B52;
  --wood: linear-gradient(180deg, #30241F, #261d19);
  --paper: linear-gradient(180deg, #e2d1aa, #D8C49A 40%, #c9b386);
  --ink: #2a1d14;
  background: #151820;
}
body.salem #app { position: relative; z-index: 1; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
body.salem h1, body.salem h2, body.salem h3, body.salem .code, body.salem .who, body.salem .role, body.salem .result {
  font-family: "Grenze Gotisch", Georgia, serif; font-weight: 800; letter-spacing: .02em;
}
body.salem h2 { font-size: 1.6rem; color: var(--gold); }
body.salem .topbar h2 { min-width: 0; font-size: 1.45rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.salem .ios.on i { background: #9c7a3f; }
body.salem .result { font-size: 1.7rem; }
/* Khung: gỗ sẫm viền sắt, chỉ vàng mảnh bên trong */
body.salem .card, body.salem .secret, body.salem .info, body.salem .calling, body.salem .lrow, body.salem .back {
  background: var(--card);
  border: 2px solid #30241F;
  border-radius: var(--radius);
  box-shadow: inset 0 0 0 1px rgba(197, 164, 109, .28), 0 6px 16px rgba(0, 0, 0, .5);
}
body.salem .secret.night { background: linear-gradient(180deg, rgba(21, 24, 40, .96), rgba(12, 14, 26, .96)); border-color: #2a3150; }
body.salem .btn {
  background: var(--paper); color: var(--ink); text-shadow: none;
  border: 1px solid #8a7550; border-radius: 4px;
  box-shadow: 0 3px 0 #4a3a26, 0 6px 14px rgba(0, 0, 0, .45);
  transition: transform .08s, filter .15s, opacity .15s;
}
body.salem .btn:hover { filter: brightness(1.07); }
body.salem .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #4a3a26, 0 3px 8px rgba(0, 0, 0, .45); }
body.salem .btn:disabled { opacity: .5; filter: grayscale(.5); }
body.salem .btn.ghost { background: var(--wood); color: var(--text); border-color: #4a382c; box-shadow: inset 0 0 0 1px rgba(197, 164, 109, .25), 0 3px 0 #120e0c; }
body.salem .btn.blood { background: linear-gradient(180deg, #a83636, #8F2929); color: #fbeee0; border-color: #5e1a1a; box-shadow: 0 3px 0 #4a1414, 0 6px 14px rgba(0, 0, 0, .45); }
body.salem .link { color: var(--muted); }
body.salem .topbar .link, body.salem .topbar .muted { color: var(--text); }
body.salem .link:hover { color: var(--gold); }
/* Thẻ người chơi: mảnh giấy da, số ghế đóng như dấu sáp */
body.salem .pcard { background: var(--paper); color: var(--ink); text-shadow: none; border: 1px solid #8a7550; border-radius: 4px; box-shadow: 0 4px 10px rgba(0, 0, 0, .45); }
body.salem .pcard .seat { top: 4px; left: 4px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px; display: grid; place-items: center; background: var(--blood); color: #fbe9d0; font-size: .7rem; }
body.salem .pcard .score { color: var(--blood); }
body.salem .pcard .muted { color: #6b5638; }
body.salem .pcard .avatar { box-shadow: 0 0 0 2px #8a7550; }
body.salem .pcard.out { opacity: .65; filter: grayscale(1) brightness(.8); }
body.salem .tag { color: #fff; }
body.salem .tag.wolf { background: var(--blood); }
body.salem .tag.special { background: #8a6a2e; }
body.salem .tag.villager { background: var(--moss); }
body.salem .tag.first { background: #30241F; color: var(--gold); }
body.salem .timeline .dot { background: #211F24; }
body.salem .modal { background: rgba(10, 11, 16, .78); }
body.salem .sheet { border-top: 3px solid #30241F; }
.rl-wolf { color: var(--spy); font-weight: 700; }
.rl-special { color: var(--gold); font-weight: 700; }
.rl-villager { color: var(--civ); font-weight: 700; }

/* Tiêu đề lớn của Ma Sói (danh sách phòng, phòng chờ) */
.ww-title { text-align: center; }
.ww-title h1 { font-size: 3.2rem; line-height: 1; color: var(--gold); text-shadow: 0 2px 0 #30241F, 0 0 24px rgba(197, 164, 109, .35); }
.ww-title p { margin-top: 6px; color: var(--muted); font-size: .92rem; }

/* Bảng tên bước: NGÀY / ĐÊM, việc đang diễn ra, đồng hồ; dính trên cùng khi cuộn */
.phase {
  position: sticky; top: 0; z-index: 6;
  display: flex; align-items: center; gap: 14px; padding: 10px 14px;
  border: 2px solid #30241F; border-radius: var(--radius);
  background: linear-gradient(90deg, rgba(197, 164, 109, .22), rgba(33, 31, 36, .97) 55%), #211F24;
  box-shadow: inset 0 0 0 1px rgba(197, 164, 109, .35), 0 8px 18px rgba(0, 0, 0, .55);
}
.phase.night { background: linear-gradient(90deg, rgba(110, 130, 200, .25), rgba(21, 24, 32, .97) 55%), #151820; border-color: #262c44; }
.phase-icon { font-size: 2rem; line-height: 1; }
.phase-big { font: 800 2.3rem/1 "Grenze Gotisch", Georgia, serif; letter-spacing: .03em; color: var(--gold); }
.phase.night .phase-big { color: #c8d2f0; }
.phase-sub { margin-top: 2px; font-weight: 700; font-size: .95rem; }
.phase.fresh { animation: phase-in .8s ease-out; }
@keyframes phase-in { from { opacity: 0; transform: translateY(-10px); } }

/* Cáo thị: giấy da cho tin của quản trò */
.decree {
  padding: 14px 16px; border-radius: 3px; color: var(--ink); text-shadow: none;
  background: var(--paper); border: 1px solid #8a7550;
  box-shadow: inset 0 0 28px rgba(120, 90, 40, .35), 0 6px 16px rgba(0, 0, 0, .5);
  display: flex; flex-direction: column; gap: 8px;
}
.decree h3 { text-align: center; font-size: 1.35rem; color: var(--blood); }
.decree .muted { color: #6b5638; }

/* Màn trong phòng Ma Sói: cảnh làng phủ cả màn hình (#stage), giao diện là các mảnh nổi trong #app (không chặn chạm vào
   cảnh ở chỗ trống): thanh trên, thẻ tin, bảng nổi, thẻ người, dưới đáy là nút mở bảng và thanh hành động. */
html:has(body.salem-room), body.salem-room { overflow: hidden; }
body.salem-room #app { position: fixed; inset: 0; z-index: 2; display: block; max-width: none; padding: 0; pointer-events: none; }
body.salem-room #app > * { pointer-events: auto; }
.hud-top {
  position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); left: 10px; right: 10px; z-index: 5;
  display: flex; align-items: flex-start; gap: 10px; pointer-events: none;
}
.hud-top > * { pointer-events: auto; }
.hud-top .phase { flex: 0 1 460px; margin: 0 auto; min-width: 0; }
.hud-right { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 999px; background: rgba(33, 31, 36, .88); border: 2px solid #30241F; box-shadow: inset 0 0 0 1px rgba(197, 164, 109, .3); }
.hud-btn {
  flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(33, 31, 36, .9); color: var(--text); font-size: 1.05rem;
  border: 2px solid #30241F; box-shadow: inset 0 0 0 1px rgba(197, 164, 109, .35), 0 4px 12px rgba(0, 0, 0, .5);
}
.hud-btn.small { width: 30px; height: 30px; font-size: .8rem; border-width: 1px; box-shadow: none; }
.hud-btn:hover, .hud-close:hover { color: var(--gold); }
.hud-toast { position: fixed; top: 96px; left: 50%; translate: -50% 0; z-index: 6; width: min(460px, calc(100vw - 20px)); display: flex; flex-direction: column; gap: 6px; text-align: center; color: var(--spy); }
/* Thẻ tin của bước: điện thoại ở giữa dưới thanh trên, máy tính ở góc phải; thu gọn được */
.hud-event {
  position: fixed; z-index: 4; top: calc(max(10px, env(safe-area-inset-top, 0px)) + 78px); left: 50%; translate: -50% 0;
  width: min(520px, calc(100vw - 20px)); max-height: 30dvh; display: flex; flex-direction: column;
  border-radius: var(--radius); background: rgba(33, 31, 36, .9); border: 2px solid #30241F;
  box-shadow: inset 0 0 0 1px rgba(197, 164, 109, .3), 0 8px 22px rgba(0, 0, 0, .55);
}
.hud-event-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; background: none; color: var(--gold); font: 800 1.05rem/1.2 "Grenze Gotisch", Georgia, serif; text-align: left; }
.hud-event-body { padding: 0 12px 12px; overflow-y: auto; gap: 10px; }
.hud-event.min .hud-event-body { display: none; }
.hud-event .secret { padding: 12px; gap: 6px; }
.hud-event .secret .emoji { font-size: 2.2rem; }
.hud-event .secret .who { font-size: 1.35rem; }
.hud-event .result { font-size: 1.25rem; }
.hud-event .timeline .dot { width: 30px; height: 30px; font-size: .9rem; }
.hud-event .timeline li + li::before { top: 14px; }
/* Tên bước không xuống dòng. Nhiều bước (đêm có nhiều vai): chỉ ghi tên bước đang gọi, bước đã qua thu nhỏ thành dấu ✓,
   bước sắp tới chỉ có hình vai, để bước đang gọi nổi bật */
.timeline .tl-label { white-space: nowrap; }
.timeline.crowded li:not(.now) .tl-label { display: none; }
.timeline.crowded li.now .tl-label { font-size: .78rem; }
.timeline.crowded li.done .dot { width: 22px; height: 22px; margin-top: 4px; font-size: .7rem; }
.timeline.crowded li:not(.done):not(.now) .dot { opacity: .75; }
.hud-event .calling { padding: 6px 10px; font-size: 1rem; }
.hud-event .decree { padding: 10px 12px; }
.hud-event .code { font-size: 2.2rem; }
.hud-event .lobby-code .btn { width: auto; flex: none; padding: 10px 14px; }
/* Bảng nổi (Dân làng, Nhật ký, Vai, Thiết lập, Lật vai): điện thoại trồi từ dưới lên, máy tính nổi bên trái */
.hud-panel {
  position: fixed; z-index: 7; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); max-height: 58dvh;
  overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 14px;
  border-radius: var(--radius); background: rgba(33, 31, 36, .96); border: 2px solid #30241F;
  box-shadow: inset 0 0 0 1px rgba(197, 164, 109, .3), 0 12px 30px rgba(0, 0, 0, .6);
  animation: panel-in .2s ease-out;
}
@keyframes panel-in { from { opacity: 0; transform: translateY(12px); } }
.hud-close { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; background: rgba(216, 196, 154, .1); color: var(--text); }
.hud-panel .hud-close { position: sticky; top: 0; align-self: flex-end; margin-bottom: -36px; z-index: 1; }
/* Đáy: thẻ người đang xem, hàng nút mở bảng, thanh hành động */
.hud-foot {
  position: fixed; z-index: 6; left: 50%; translate: -50% 0; bottom: 0; width: min(640px, 100vw);
  padding: 0 10px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.hud-foot > * { pointer-events: auto; }
.hud-dock { display: flex; justify-content: center; gap: 6px; min-width: 0; }
.hud-dock button {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; white-space: nowrap;
  background: rgba(33, 31, 36, .9); color: var(--text); font-size: .82rem; font-weight: 700;
  border: 1px solid #4a382c; box-shadow: inset 0 0 0 1px rgba(197, 164, 109, .25), 0 4px 10px rgba(0, 0, 0, .45);
}
.hud-dock button { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.hud-dock button span { font-size: 1rem; }
.hud-dock button.on { color: var(--on-gold); background: var(--gold); }
.hud-bar {
  display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(48, 36, 31, .96), rgba(30, 23, 20, .98)); border: 2px solid #4a382c;
  box-shadow: inset 0 1px 0 rgba(197, 164, 109, .3), 0 -6px 18px rgba(0, 0, 0, .45);
}
.hud-bar .btn { flex: 1; width: auto; padding: 12px 14px; font-size: 1rem; }
.hud-bar .bar-note { flex: 1.2; min-width: 0; font-size: .82rem; color: var(--muted); line-height: 1.3; }
.hud-bar .bar-note b { color: var(--text); }
.hud-focus {
  position: relative; display: flex; flex-direction: column; gap: 10px; padding: 12px;
  border-radius: var(--radius); background: var(--paper); color: var(--ink); text-shadow: none; border: 1px solid #8a7550;
  box-shadow: inset 0 0 24px rgba(120, 90, 40, .3), 0 10px 24px rgba(0, 0, 0, .55); animation: panel-in .18s ease-out;
}
.hud-focus .f-name { font: 800 1.4rem/1.1 "Grenze Gotisch", Georgia, serif; }
.hud-focus .f-name em { font: 600 .8rem var(--font); color: #6b5638; }
.hud-focus .muted { color: #6b5638; }
.hud-focus .avatar.grave { background: #5d5850; color: #e8e2d6; }
.hud-focus .hud-close { position: static; background: rgba(42, 29, 20, .12); color: var(--ink); }
.hud-focus .btn:not(.blood) { background: #30241F; color: var(--text); border-color: #1c1512; box-shadow: 0 3px 0 #120e0c; }
.pack-side { position: fixed; z-index: 6; left: 16px; bottom: 16px; width: 300px; padding: 10px 12px; border-radius: var(--radius); background: rgba(33, 31, 36, .95); border: 2px solid #5d1717; box-shadow: 0 10px 28px rgba(0, 0, 0, .5); }
.pack-side .board h3 { margin-bottom: 6px; font-size: 1.1rem; }
.pack-side .pack-msgs { max-height: 220px; }
/* Lớp phủ lượt đêm của vai mình: đầu thẻ nhỏ cho vai, mỗi chức năng là một nút riêng */
.turn-cover { align-content: center; gap: 14px; }
.turn-cover .tc-head { display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 8px; border-radius: 999px; background: rgba(33, 31, 36, .92); border: 2px solid #30241F; color: var(--text); animation: rc-flip .35s ease-out both; }
.turn-cover .tc-head .role-art { width: 48px; margin: 0; border-radius: 50%; aspect-ratio: 1; }
.turn-cover .tc-head .rc-name { font: 800 1.5rem/1 "Grenze Gotisch", Georgia, serif; }
.turn-cover .tc-head span { font-size: .8rem; color: var(--muted); }
.turn-cover .tc-info { width: min(420px, 100%); padding: 8px 12px; border-radius: 10px; background: rgba(33, 31, 36, .88); color: var(--text); font-size: .88rem; text-align: center; }
.turn-cover .tc-info p { margin: 2px 0; }
.turn-cover .tc-fns { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 560px; }
.turn-cover .tc-fn { width: 128px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 10px 12px; border-radius: 16px; border: 2px solid #8a7550; background: var(--paper); color: var(--ink); font: 800 1rem/1.2 var(--font); cursor: pointer; box-shadow: inset 0 0 18px rgba(120, 90, 40, .3), 0 8px 20px rgba(0, 0, 0, .5); animation: rc-flip .35s ease-out both; transition: transform .12s; }
.turn-cover .tc-fn:hover { transform: translateY(-3px); }
.turn-cover .tc-fn:active { transform: scale(.96); }
.turn-cover .tc-fn.hot { border-color: #8F2929; box-shadow: inset 0 0 18px rgba(143, 41, 41, .25), 0 8px 20px rgba(0, 0, 0, .5); }
.turn-cover .tc-fn.idle { background: #30241F; color: var(--text); border-color: #1c1512; }
.turn-cover .tc-icon { width: 56px; height: 56px; display: grid; place-items: center; font-size: 2.2rem; }
.turn-cover .tc-icon svg { width: 100%; height: 100%; overflow: visible; }
/* Chat ban đêm của bầy Sói */
.pack .pack-msgs { display: flex; flex-direction: column; gap: 6px; max-height: 32dvh; overflow-y: auto; padding: 2px; }
.pack .pack-msgs p { margin: 0; max-width: 85%; padding: 6px 10px; border-radius: 12px 12px 12px 4px; background: rgba(143, 41, 41, .28); border: 1px solid rgba(143, 41, 41, .5); font-size: .9rem; overflow-wrap: anywhere; }
.pack .pack-msgs p b { display: block; font-size: .72rem; color: #ff8a7a; }
.pack .pack-msgs p.mine { align-self: flex-end; border-radius: 12px 12px 4px 12px; background: rgba(197, 164, 109, .18); border-color: rgba(197, 164, 109, .45); }
.pack .pack-msgs p.mine b { color: #f0d38a; }
.pack .pack-msgs p.muted { max-width: none; background: none; border: 0; }
.pack-send { display: flex; gap: 8px; }
.pack-send input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #151820; color: var(--text); font: inherit; }
.pack-send .btn { width: auto; flex: none; padding: 10px 16px; }
/* Thiết lập: khung đếm vai của ván */
.role-count .rc-team { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.role-count .rc-team > span:first-child { min-width: 100%; font-weight: 700; }
.role-count .rc-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: rgba(216, 196, 154, .08); border: 1px solid var(--line); font-size: .8rem; font-weight: 600; }
.role-count .rc-chip b { margin-left: 2px; }
/* Phòng chờ: chọn màu nhân vật */
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 32px; height: 32px; padding: 0; border-radius: 50%; background: var(--c); border: 2px solid rgba(0, 0, 0, .55); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22); cursor: pointer; }
.swatch.on { outline: 3px solid #f0d38a; outline-offset: 2px; }
.swatch:disabled { opacity: .25; cursor: not-allowed; }
/* Đầu ván: vai của mình phủ kín màn hình, úp sẵn, chạm để lật */
.role-cover { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(10, 11, 16, .82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.role-cover .rc-card { width: min(340px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 18px 18px; text-align: center; border-radius: var(--radius); background: var(--paper); color: var(--ink); text-shadow: none; border: 1px solid #8a7550; box-shadow: inset 0 0 30px rgba(120, 90, 40, .35), 0 16px 40px rgba(0, 0, 0, .6); }
.role-cover .rc-face { animation: rc-flip .45s ease-out both; }
.role-cover .rc-back { min-height: min(440px, 70dvh); justify-content: center; cursor: pointer; background: repeating-linear-gradient(45deg, #30241F 0 10px, #3a2c25 10px 20px); color: var(--text); border: 3px double #C5A46D; font: inherit; }
.role-cover .rc-back .rc-mark { font-size: 4rem; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .6)); }
.role-cover .rc-back b { font: 800 1.8rem/1.1 "Grenze Gotisch", Georgia, serif; color: #D8C49A; }
.role-cover .rc-back .small { color: var(--muted); }
.role-cover .rc-name { font: 800 2.2rem/1 "Grenze Gotisch", Georgia, serif; }
.role-cover .rc-team { font-weight: 700; font-size: .9rem; }
.role-cover .rc-card p { margin: 0; }
.role-cover .rc-card .muted { color: #6b5638; }
.role-cover .role-art { width: 150px; }
.role-cover .rc-card .rl-wolf { color: #8F2929; }
.role-cover .rc-card .rl-special { color: #7a5a1e; }
.role-cover .rc-card .rl-villager { color: #3f5a3f; }
body.salem .role-cover .btn { width: 100%; background: #30241F; color: var(--text); border-color: #1c1512; box-shadow: 0 3px 0 #120e0c; }
@keyframes rc-flip { from { opacity: 0; transform: perspective(800px) rotateY(80deg); } to { opacity: 1; transform: none; } }
@media (max-width: 600px) {
  .hud-top { gap: 6px; }
  .hud-top .phase { padding: 6px 10px; gap: 8px; }
  .phase-icon { font-size: 1.4rem; }
  .phase-big { font-size: 1.55rem; white-space: nowrap; }
  .phase-sub { font-size: .8rem; line-height: 1.2; }
  .hud-right { padding: 4px; gap: 4px; }
  .hud-top .ring { width: 46px; height: 46px; }
  .hud-top .ring span { font-size: .85rem; }
  .hud-right .ios span { display: none; }
  .hud-event { top: calc(max(10px, env(safe-area-inset-top, 0px)) + 70px); max-height: 26dvh; }
  .hud-dock { gap: 4px; }
  .hud-dock button { flex: 1 1 auto; justify-content: center; padding: 7px 8px; font-size: .75rem; gap: 4px; }
}
@media (min-width: 1024px) {
  .hud-event { left: auto; right: 16px; translate: none; width: 380px; max-height: calc(100vh - 220px); }
  .hud-panel { left: 16px; right: auto; top: 96px; bottom: auto; width: 360px; max-height: calc(100vh - 230px); }
  .hud-toast { top: 100px; }
}

/* Bảng gỗ: Dân làng, Danh sách vai, Vai của bạn, Nhật ký */
.board { display: flex; flex-direction: column; gap: 6px; }
.board h3 { margin-bottom: 10px; padding-bottom: 6px; text-align: center; font-size: 1.35rem; color: var(--gold); border-bottom: 1px solid var(--line); }
.board h3 small { display: block; font: 600 .75rem/1.3 var(--font); color: var(--muted); letter-spacing: 0; }
.board ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: .92rem; }
.board .btn { margin-top: 10px; }
.info ul.hl { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.plist { display: flex; flex-direction: column; gap: 4px; }
.prow {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px;
  border-radius: 4px; border: 1px solid transparent; background: rgba(216, 196, 154, .06);
  color: var(--text); text-align: left; transition: background .15s, border-color .15s;
}
.prow .pnum { width: 1.5em; flex: none; text-align: center; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
.prow .avatar.sm { width: 32px; height: 32px; font-size: .72rem; box-shadow: 0 0 0 1.5px rgba(197, 164, 109, .5); }
.prow .avatar.grave { background: #3a3633; color: #a9a39a; }
.prow .pinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.prow .pinfo b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .92rem; }
.prow .pinfo em { font-style: normal; font-weight: 600; color: var(--gold); }
.prow .pinfo small { font-size: .75rem; color: var(--muted); }
.prow.dead { opacity: .65; }
.prow.dead .pinfo b { text-decoration: line-through; }
.prow.can { border-color: rgba(216, 196, 154, .3); }
.prow.can:hover { background: rgba(216, 196, 154, .16); }
.prow.sel { border-color: var(--gold); background: rgba(197, 164, 109, .28); }
.prow.ally .pinfo b { color: var(--spy); }
.prow .pcount { flex: none; min-width: 1.9em; padding: 1px 6px; border-radius: 999px; background: var(--blood); color: #fff; font-weight: 800; font-size: .85rem; text-align: center; }
.rolecard { gap: 10px; }
.rolecard .rc-top { display: flex; align-items: center; gap: 12px; }
.rolecard .rc-name { font: 800 1.5rem/1.1 "Grenze Gotisch", Georgia, serif; }
.rolecard .rc-uses { padding: 8px 10px; border-radius: 4px; background: rgba(216, 196, 154, .08); border: 1px dashed var(--line); }
.log { font-size: .88rem; }
.log .log-head { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font: 800 1.05rem/1.2 "Grenze Gotisch", Georgia, serif; color: var(--gold); }
.log .log-head:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.log .log-head.night { color: #b9c4e6; }

/* Hết ván */
.victory { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--radius); border: 2px solid #30241F; box-shadow: inset 0 0 0 1px rgba(197, 164, 109, .35), 0 8px 20px rgba(0, 0, 0, .55); animation: phase-in .9s ease-out; }
.victory.wolf { background: linear-gradient(120deg, rgba(143, 41, 41, .55), #211F24 70%); }
.victory.village { background: linear-gradient(120deg, rgba(82, 107, 82, .6), #211F24 70%); }
.victory .v-big { font: 800 2.2rem/1 "Grenze Gotisch", Georgia, serif; color: var(--gold); }
.victory .v-me { margin: 4px 0; font-weight: 800; }
.victory .v-me.win { color: var(--civ); }
.victory .v-me.lose { color: var(--spy); }
.stats { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; }
.stats div { display: flex; flex-direction: column; align-items: center; padding: 10px; border-radius: var(--radius); background: var(--card); border: 1px solid #30241F; box-shadow: inset 0 0 0 1px rgba(197, 164, 109, .2); }
.stats b { font: 800 1.8rem/1 "Grenze Gotisch", Georgia, serif; color: var(--gold); }
.stats span { font-size: .8rem; color: var(--muted); }

/* Cảnh làng 2.5D (mwwStageInit): thế giới 1000 × 900 phủ kín màn hình ngang; màn hình dọc thì thế giới rộng hơn màn
   hình một chút để dân làng to rõ. Hai lớp .world trùng khít nhau: lớp dưới là đất, nhà, người (che nhau theo độ sâu),
   lớp trên là tên, vòng chọn và ánh đèn, nằm trên màu trời (.tint) nên không bị tối đi. Máy quay trôi rất chậm. */
#stage { position: fixed; inset: 0; z-index: 1; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #4f5d38, #252d1d 80%); --win: #2d3540; --lamp: #8f8460; }
#stage[hidden] { display: none; }
#stage::after { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0, 0, 0, .55)); }
#stage .world { position: absolute; left: 50%; top: 50%; width: min(max(100vw, 112dvh), 118dvh); aspect-ratio: 1000 / 900; translate: -50% -50%; container-type: inline-size; animation: cam 46s ease-in-out infinite alternate; transform-origin: 50% 52%; }
@media (orientation: portrait) { #stage .world { width: 150vw; top: 62%; } }
@keyframes cam { to { transform: scale(1.04) translate(-.6%, -.8%); } }
/* Chốt chọn ban đêm: camera zoom vào nhà được chọn (mwwZoom đặt scale, translate, transform-origin) */
#stage .world { transition: scale 1.1s ease-in-out, translate 1.1s ease-in-out; }
#stage .world.over { pointer-events: none; z-index: 3; }
#stage .ground { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
#stage .obj { position: absolute; translate: -50% -100%; pointer-events: none; }
#stage .obj svg, #stage .vil svg { display: block; width: 100%; height: auto; overflow: visible; }
#stage .cast { display: contents; }
#stage .vil, #stage .spot, #stage .ntag { --cw: clamp(30px, 4.6cqw, 74px); }
#stage .vil {
  position: absolute; width: calc(var(--cw) * 1.3); padding: 0; border: 0; background: none;
  translate: -50% -100%; scale: var(--s); transform-origin: 50% 100%; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
#stage .vil svg { animation: vil-bob 2.8s ease-in-out var(--d, 0s) infinite; transform-origin: 50% 100%; }
#stage .vil.dead svg { animation: none; }
/* Nhà của từng người: ban đêm bấm vào nhà để chọn người đó */
#stage .home { position: absolute; translate: -50% -100%; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#stage .home svg { display: block; width: 100%; height: auto; overflow: visible; }
#stage .home.dead svg { filter: grayscale(.8) brightness(.6); }
#stage .home:hover svg, #stage .home.focus svg { filter: brightness(1.12) drop-shadow(0 0 5px rgba(255, 230, 170, .8)); }
#stage.night .home.can svg { filter: brightness(1.5) drop-shadow(0 0 8px rgba(255, 220, 140, 1)); }
#stage.night .home.sel svg { filter: brightness(1.5) drop-shadow(0 0 8px #ff5a4a); }
#stage .htag {
  position: absolute; translate: -50% -100%; padding: 2px 8px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: rgba(15, 18, 30, .72); color: #f3ead6; font: 700 clamp(10px, 1.35cqw, 14px)/1.25 var(--font); text-shadow: none;
}
#stage .htag.me { color: #f0d38a; }
#stage .htag.ally { color: #ff8a7a; }
#stage .htag.dead { opacity: .6; }
#stage .htag.can { border: 1.5px dashed #f0d38a; color: #f0d38a; }
#stage .htag.sel, #stage .htag.focus { background: #C5A46D; color: #2a1d14; border-style: solid; }
/* Người được gọi dậy ban đêm: đi qua đi lại trước cửa nhà mình */
#stage .walk { animation: walk 9s ease-in-out var(--w, 0s) infinite; }
#stage .vil.walk svg { animation-duration: .7s; }
@keyframes walk { 0%, 100% { transform: translateX(-2.4cqw); } 50% { transform: translateX(2.4cqw); } }
#stage .vil:hover svg, #stage .vil.focus svg { filter: brightness(1.15) drop-shadow(0 0 4px rgba(255, 230, 170, .8)); }
@keyframes vil-bob { 50% { transform: translateY(-3%) scaleY(1.015); } }
/* Vòng dưới chân: nét đứt là bấm được, vàng là đang chọn, sáng là đang xem */
#stage .spot { position: absolute; width: calc(var(--cw) * 1.35 * var(--s)); aspect-ratio: 3 / 1; translate: -50% -50%; border-radius: 50%; }
#stage .spot.can { border: 2px dashed rgba(255, 244, 214, .85); }
#stage .spot.sel { border: 2.5px solid #f0d38a; background: rgba(240, 211, 138, .3); box-shadow: 0 0 12px rgba(240, 211, 138, .7); }
#stage .spot.focus { border: 2.5px solid #fff; box-shadow: 0 0 14px rgba(255, 255, 255, .7); }
#stage .ntag {
  position: absolute; display: flex; flex-direction: column; align-items: center; gap: 3px;
  translate: -50% calc(-100% - var(--cw) * 1.45 * var(--s) - 2px);
  font: 700 clamp(10px, 1.45cqw, 15px)/1.2 var(--font); color: #fffaf0; white-space: nowrap;
  text-shadow: 0 1px 2px #000, 0 0 5px rgba(0, 0, 0, .9);
}
#stage .ntag b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
/* Số phiếu đang bầu người này (ban đêm: số Sói đang chọn), nổi trên nóc nhà của họ */
#stage .hcount { position: absolute; z-index: 1000; translate: -50% -100%; min-width: 1.9em; padding: 1px 7px; border-radius: 999px; background: #8F2929; border: 2px solid #f3e6c8; color: #fff; font: 800 clamp(13px, 2cqw, 22px)/1.2 var(--font); font-style: normal; text-align: center; box-shadow: 0 2px 6px rgba(0, 0, 0, .6); animation: fx-pop-in .25s ease-out; }
#stage .hcount.night { translate: -50% calc(-100% - clamp(18px, 2.4cqw, 26px)); }
@keyframes fx-pop-in { from { scale: .4; } to { scale: 1; } }
#stage .ntag.me { color: #f0d38a; }
#stage .ntag.ally { color: #ff8a7a; }
#stage .ntag.dead { opacity: .7; translate: -50% calc(-100% - var(--cw) * .95 * var(--s) - 2px); }
/* Màu trời theo bước: ngày nắng ấm, đêm xanh tối có sương và đèn, phán xử tối quanh giàn như rọi đèn, hết ván theo phe thắng */
#stage .tint { position: absolute; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 1.8s ease; }
#stage .t-day { background: linear-gradient(155deg, rgba(255, 214, 150, .26), rgba(255, 190, 120, 0) 45%, rgba(50, 26, 8, .22)); }
#stage .t-night { background: radial-gradient(ellipse at 70% 10%, rgba(120, 140, 220, .18), transparent 45%), radial-gradient(ellipse at 50% 55%, rgba(16, 24, 70, .55), rgba(4, 7, 26, .88) 75%); }
#stage .t-trial { background: radial-gradient(ellipse 26% 30% at 50% 47%, rgba(255, 220, 160, .1), rgba(12, 6, 4, .66) 100%); }
#stage .t-wolf { background: radial-gradient(ellipse at 50% 45%, rgba(130, 12, 12, .28), rgba(36, 0, 0, .8)); }
#stage .t-village { background: linear-gradient(180deg, rgba(255, 214, 140, .38), rgba(255, 200, 120, .06) 60%); }
#stage.day .t-day, #stage.lobby .t-day, #stage.night .t-night, #stage.trial .t-trial, #stage.end-wolf .t-wolf, #stage.end-village .t-village { opacity: 1; }
#stage.night { --win: #ffcf70; --lamp: #ffe09a; }
#stage.night .vil svg { filter: brightness(.9); }
#stage .glow { position: absolute; width: 3.4cqw; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: radial-gradient(circle, rgba(255, 214, 120, .9) 0 12%, rgba(255, 180, 70, .3) 40%, transparent 70%); opacity: 0; transition: opacity 1.8s; }
#stage .glow.lantern { width: 9cqw; }
#stage .glow.hall { width: 4.5cqw; }
#stage.night .glow { opacity: 1; }
#stage .fog { position: absolute; z-index: 3; left: -30%; width: 95%; height: 30%; border-radius: 50%; pointer-events: none; background: radial-gradient(closest-side, rgba(190, 205, 235, .2), transparent); opacity: 0; transition: opacity 2.5s; animation: fog-drift 34s ease-in-out infinite alternate; }
#stage .fog.f1 { top: 30%; }
#stage .fog.f2 { top: 60%; left: 35%; animation-duration: 45s; animation-direction: alternate-reverse; }
#stage.night .fog { opacity: 1; }
#stage.trial .fog, #stage.end-wolf .fog { opacity: .45; }
@keyframes fog-drift { to { transform: translateX(32%); } }

#stage .vil.moving svg { animation-duration: .45s; }
#stage .vil.flip svg { scale: -1 1; }

/* Hoạt ảnh của vai ở nhà người được chọn, hồn ma của người chết */
#stage .fx { position: absolute; translate: -50% -50%; aspect-ratio: 1; pointer-events: none; }
#stage .fx > * { position: absolute; inset: 0; animation-delay: var(--t, 0s) !important; animation-fill-mode: both !important; }
#stage .fx b { display: grid; place-items: center; font-size: clamp(22px, 3.4cqw, 54px); text-shadow: 0 2px 8px rgba(0, 0, 0, .6); animation: fx-pop 2.8s ease-out; }
#stage .fx b svg { width: 58%; height: auto; overflow: visible; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, .55)); }
#stage .fx .fx-a { border-radius: 50%; background: radial-gradient(circle, var(--c) 0 30%, transparent 70%); animation: fx-glow 2.8s ease-out; }
@keyframes fx-pop { 0% { opacity: 0; transform: scale(.3) translateY(25%); } 18% { opacity: 1; transform: scale(1.3); } 32% { transform: scale(1); } 78% { opacity: 1; transform: translateY(-22%); } 100% { opacity: 0; transform: translateY(-50%); } }
@keyframes fx-glow { 0% { opacity: 0; transform: scale(.4); } 25% { opacity: 1; transform: scale(1.15); } 65% { opacity: .85; } 100% { opacity: 0; transform: scale(1.5); } }
#stage .fx-wolf { --c: rgba(230, 30, 30, .8); }
#stage .fx-wolf .fx-b { animation: fx-claw 2.8s ease-out; }
#stage .fx-wolf svg { width: 100%; height: 100%; overflow: visible; }
#stage .fx-wolf path { fill: none; stroke: #e02424; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; filter: drop-shadow(0 0 3px rgba(0, 0, 0, .8)); animation: claw-draw 2.8s ease-out both; animation-delay: calc(var(--t, 0s) + var(--o)); }
#stage .fx-wolf path:nth-child(1) { --o: 0s; }
#stage .fx-wolf path:nth-child(2) { --o: .08s; }
#stage .fx-wolf path:nth-child(3) { --o: .16s; }
@keyframes fx-claw { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
/* Nét ẩn hẳn tới lúc bắt đầu rạch, kẻo đầu nét bo tròn hiện thành chấm trước */
@keyframes claw-draw { 0%, 8% { stroke-dashoffset: 100; opacity: 0; } 9% { stroke-dashoffset: 97; opacity: 1; } 22%, 100% { stroke-dashoffset: 0; opacity: 1; } }
#stage .fx-hunter { --c: rgba(255, 160, 60, .7); }
#stage .fx-hunter .fx-b { inset: 12%; border-radius: 50%; border: 3px solid rgba(255, 196, 120, .95); background: linear-gradient(rgba(255, 196, 120, .95), rgba(255, 196, 120, .95)) center / 3px 100% no-repeat, linear-gradient(90deg, rgba(255, 196, 120, .95), rgba(255, 196, 120, .95)) center / 100% 3px no-repeat; box-shadow: 0 0 12px rgba(255, 160, 60, .7); animation: fx-aim 2.8s ease-out; }
@keyframes fx-aim { 0% { opacity: 0; transform: scale(2) rotate(-90deg); } 30% { opacity: 1; transform: scale(1) rotate(0); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(.8); } }
#stage .fx-curse { --c: rgba(120, 40, 180, .85); }
#stage .fx-curse .fx-b { border-radius: 50%; background: conic-gradient(from 0deg, transparent, rgba(150, 60, 220, .8), transparent 40%, rgba(90, 20, 140, .8), transparent 75%); animation: fx-spin 2.8s ease-in-out; }
@keyframes fx-spin { 0% { opacity: 0; transform: scale(.2) rotate(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3) rotate(540deg); } }
#stage .fx-seer { --c: rgba(170, 120, 255, .85); }
#stage .fx-seer .fx-b { border-radius: 50%; background: radial-gradient(circle at 20% 30%, #fff 0 2%, transparent 3%), radial-gradient(circle at 75% 25%, #e9d8ff 0 2.5%, transparent 3.5%), radial-gradient(circle at 60% 75%, #fff 0 2%, transparent 3%), radial-gradient(circle at 30% 70%, #d8c4ff 0 2%, transparent 3%); animation: fx-spin 2.8s ease-in-out; }
#stage .fx-guard { --c: rgba(255, 214, 120, .55); }
#stage .fx-guard .fx-b { top: 8%; bottom: 18%; border-radius: 50% 50% 8% 8% / 70% 70% 8% 8%; border: 3px solid rgba(255, 224, 150, .95); background: rgba(255, 224, 150, .2); box-shadow: 0 0 18px rgba(255, 214, 120, .8), inset 0 0 18px rgba(255, 214, 120, .6); transform-origin: 50% 100%; animation: fx-dome 2.8s ease-out; }
@keyframes fx-dome { 0% { opacity: 0; transform: scaleY(0); } 25% { opacity: 1; transform: scaleY(1.05); } 35% { transform: scaleY(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
#stage .fx-poison { --c: rgba(70, 200, 70, .8); }
#stage .fx-heal { --c: rgba(255, 120, 170, .75); }
#stage .fx-poison .fx-b, #stage .fx-heal .fx-b { background: radial-gradient(circle at 30% 80%, rgba(120, 230, 120, .9) 0 5%, transparent 6%), radial-gradient(circle at 55% 70%, rgba(120, 230, 120, .9) 0 4%, transparent 5%), radial-gradient(circle at 70% 85%, rgba(120, 230, 120, .9) 0 6%, transparent 7%); animation: fx-rise 2.8s ease-out; }
#stage .fx-heal .fx-b { filter: hue-rotate(220deg); }
@keyframes fx-rise { 0% { opacity: 0; transform: translateY(20%); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-60%); } }
#stage .fx-death, #stage .fx-hang { --c: rgba(210, 214, 225, .55); }
#stage .fx-death .fx-b, #stage .fx-hang .fx-b { border-radius: 50%; background: radial-gradient(ellipse at 50% 80%, rgba(120, 120, 130, .7), transparent 60%); animation: fx-rise 2.8s ease-out; }
#stage .home.shake svg { animation: house-shake .45s ease-in-out var(--t, 0s) 5 both; }
@keyframes house-shake { 25% { transform: translateX(-2.5%) rotate(-1.2deg); } 75% { transform: translateX(2.5%) rotate(1.2deg); } }
#stage .vil.inside { opacity: 0; transition: opacity .35s; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>

<body>
<!-- Nền thị trấn của Ma Sói: trời, nhà, giàn treo cổ; đổi ngày/đêm bằng class trên body (xem mwwStage) -->
<svg id="town" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky-d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3a5c"/><stop offset=".55" stop-color="#8c5a3a"/><stop offset=".85" stop-color="#d08a4a"/></linearGradient>
    <linearGradient id="sky-n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03050f"/><stop offset=".6" stop-color="#101a3a"/><stop offset=".9" stop-color="#25305a"/></linearGradient>
  </defs>

<script>
// Phần dùng chung của DMI Boardgame: lưu trữ, bàn chơi (danh sách thành viên), bảng điểm, khung giao diện.
// Mỗi game tự đăng ký vào GAMES, views, modals, actions, forms.
const MAX_PLAYERS = 20;
// Danh sách dự phòng, chỉ dùng khi chưa lấy được danh sách nhân viên từ DMI Workspace (xem phần Dữ liệu online)
const DEFAULT_ROSTER = [
  'Aeris', 'Alfie', 'Annie', 'Arthur', 'Bang', 'Brian', 'Duke', 'Dylan', 'Ed', 'Editor',
  'Fender', 'Jason', 'Jesse', 'Kris', 'Maelyn', 'Maxx', 'Ryan', 'Steve', 'Vincent',
];
const AVATAR_COLORS = ['#6b5bc2', '#b5551d', '#2456c8', '#8a3a6e', '#45506b', '#3f8457', '#35657d', '#a2342a'];
const NEW_NAME = '__new';
const LOG_LIMIT = 50;

const app = document.querySelector('#app');
const modalEl = document.querySelector('#modal');

const load = (key, fallback) => {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v ?? fallback;
  } catch {
    return fallback;
  }
};
const save = (key, value) => {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch {}
};

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const rand = (n) => Math.floor(Math.random() * n);
const shuffle = (arr) => {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = rand(i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
};

const GAMES = [];
const views = {};
const modals = {};
const actions = {};
const forms = {};
// Việc cần làm mỗi khi mở một màn (tải dữ liệu mới nhất), theo tên màn
const ENTER = {};
let view = 'home';
let modal = null;

/* ---------- Dữ liệu dùng chung ---------- */

// Chuyển dữ liệu từ bản Gián Điệp cũ (khóa gd.*) sang hệ thống mới
const oldCfg = load('gd.cfg', null);
const oldScores = load('gd.scores', {});
let table = load('dmi.table', null) || { n: oldCfg?.n || 5, names: oldCfg?.names || [], extra: oldCfg?.extra || [] };
// stats[gameId][tên] = { p: điểm, g: số ván, w: số ván thắng }
let stats = load('dmi.stats', null) || {
  spy: Object.fromEntries(Object.entries(oldScores).map(([name, p]) => [name, { p, g: 0, w: 0 }])),
};
let gameLog = load('dmi.log', []);

// Danh sách nhân viên DMI Workspace (null khi chưa lấy được), cộng thêm các tên khác thêm trên máy này
let sharedRoster = null;
const baseRoster = () => sharedRoster || DEFAULT_ROSTER;
const roster = () => [...new Set([...baseRoster(), ...table.extra])];
const seatName = (i) => table.names[i] || `Người ${i + 1}`;
const tableNames = () => Array.from({ length: table.n }, (_, i) => seatName(i));

function fixTable(min) {
  table.n = Math.min(MAX_PLAYERS, Math.max(min, table.n));
  save('dmi.table', table);
}

// Gán tên cho một ghế; nếu tên đang ở ghế khác thì ghế đó bị bỏ trống
function assignName(seat, name) {
  table.names = Array.from({ length: MAX_PLAYERS }, (_, i) => (table.names[i] === name ? '' : table.names[i] || ''));
  table.names[seat] = name;
  save('dmi.table', table);
}

// results: [{ name, pts, win }]
function addResults(gameId, results) {
  const board = (stats[gameId] ||= {});
  results.forEach(({ name, pts, win }) => {
    const row = (board[name] ||= { p: 0, g: 0, w: 0 });
    row.p += pts;
    row.g += 1;
    row.w += win ? 1 : 0;
  });
}

function recordGame(gameId, text, results) {
  const t = Date.now();
  addResults(gameId, results);
  gameLog.unshift({ t, game: gameId, text, n: results.length });
  gameLog = gameLog.slice(0, LOG_LIMIT);
  // Có bảng xếp hạng online thì ghi lên đó, không thì chỉ lưu trên máy này
  if (online) return void saveGame({ t, game: gameId, text, results });
  save('dmi.stats', stats);
  save('dmi.log', gameLog);
}

// Số ghế trong phòng Ma Sói (người và bot), dùng để tính số vai
const seatCount = () => (mp?.room ? Math.max(mpCount(), WW_MIN) : WW_MIN);

const pointsOf = (gameId, name) => stats[gameId]?.[name]?.p || 0;

/* ---------- Thành phần giao diện ---------- */

const stepper = (act, key, value, min, max) => `
  <div class="stepper">
    <button data-act="${act}" data-key="${key}" data-d="-1" ${value <= min ? 'disabled' : ''}>−</button>
    <b>${value}</b>
    <button data-act="${act}" data-key="${key}" data-d="1" ${value >= max ? 'disabled' : ''}>+</button>
  </div>`;

// Mỗi tên một màu cố định (avatar và áo của nhân vật 3D)
const avatarColor = (name) => AVATAR_COLORS[[...name].reduce((h, c) => (h * 31 + c.codePointAt(0)) >>> 0, 7) % AVATAR_COLORS.length];

function avatar(name, cls = '', color = avatarColor(name)) {
  const initials = /^Người \d+$/.test(name) ? name.slice(6) : name.slice(0, 2).toUpperCase();
  return `<span class="avatar ${cls}" style="background:${color}">${esc(initials)}</span>`;
}

// Thẻ người chơi trong lưới: số thứ tự, avatar, tên và phần phụ (vai, điểm...)
function playerCard(name, { seat = 0, cls = '', extra = '', act = '', i = '' } = {}) {
  const tag = act ? 'button' : 'div';
  return `
    <${tag} class="pcard ${cls}" ${act ? `data-act="${act}" data-i="${i}"` : ''}>
      ${seat ? `<span class="seat">#${seat}</span>` : ''}
      ${avatar(name)}
      <span class="pname">${esc(name)}</span>
      ${extra}
    </${tag}>`;
}

function seatCard(i) {
  const current = table.names[i] || '';
  const taken = table.names.slice(0, table.n).filter((name, k) => name && k !== i);
  const options = roster().filter((name) => !taken.includes(name));
  if (current && !options.includes(current)) options.unshift(current);
  return `
    <div class="pcard ${current ? '' : 'empty'}">
      <span class="seat">#${i + 1}</span>
      ${avatar(seatName(i))}
      <select id="seat-${i}" data-seat="${i}" aria-label="Tên người chơi ${i + 1}">
        <option value="">Chọn tên</option>
        ${options.map((name) => `<option ${name === current ? 'selected' : ''}>${esc(name)}</option>`).join('')}
        <option value="${NEW_NAME}">＋ Tên khác…</option>
      </select>
    </div>`;
}

// Khối chọn số người và tên từng ghế, dùng chung cho màn thiết lập của mọi game
function tableSection(min) {
  fixTable(min);
  return `
    <div class="card row between"><b>Số người chơi</b>${stepper('tstep', 'n', table.n, min, MAX_PLAYERS)}</div>
    <div class="pgrid">${Array.from({ length: table.n }, (_, i) => seatCard(i)).join('')}</div>
    <p class="muted small center">Danh sách thành viên được lưu lại cho các ván sau.</p>`;
}

function go(name) {
  view = name;
  window.scrollTo(0, 0);
  ENTER[name]?.();
}

// Việc cần làm sau mỗi lần vẽ lại (nền, nhạc, vòng đếm ngược)
const AFTER_RENDER = [];

// Đang nhấn thì hoãn vẽ lại (tối đa 1,5 giây): thay nút ngay dưới ngón tay làm lần bấm đó mất.
// Nội dung không đổi thì giữ nguyên trang, khỏi giật và khỏi mất chỗ đang cuộn.
let pressedAt = 0;
let redraw = false;
let drawn = { app: null, modal: null };

function render() {
  if (pressedAt && performance.now() - pressedAt < 1500) return void (redraw = true);
  redraw = false;
  const html = views[view]();
  const sheet = modal ? `<div class="sheet">${modals[modal.type]()}</div>` : '';
  if (html !== drawn.app) {
    // Khung có data-scroll (bảng nổi, thẻ tin của Ma Sói) giữ chỗ đang cuộn khi vẽ lại, ví dụ lúc bấm + trong Thiết lập
    const kept = [...app.querySelectorAll('[data-scroll]')].map((el) => [el.dataset.scroll, el.scrollTop]);
    app.innerHTML = drawn.app = html;
    kept.forEach(([key, top]) => {
      const el = app.querySelector(`[data-scroll="${key}"]`);
      if (el) el.scrollTop = top;
    });
  }
  modalEl.hidden = !modal;
  if (sheet !== drawn.modal) modalEl.innerHTML = drawn.modal = sheet;
  AFTER_RENDER.forEach((fn) => fn());
}

document.addEventListener('pointerdown', () => (pressedAt = performance.now()), true);
['pointerup', 'pointercancel'].forEach((type) =>
  document.addEventListener(type, () => {
    pressedAt = 0;
    // Bấm trúng nút thì click tự vẽ lại; không thì vẽ phần đã hoãn
    if (redraw) setTimeout(() => redraw && render());
  }, true));

/* ---------- Modal & action dùng chung ---------- */

modals.rules = () => `
  ${GAMES.find((game) => game.id === modal.game).rules()}
  <button class="btn" data-act="close">Đã hiểu</button>`;

// modal = { type: 'confirm', title, text, yes, act }: act là action chạy khi đồng ý
modals.confirm = () => `
  <h2>${modal.title}</h2>
  <p class="muted">${modal.text}</p>
  <button class="btn" data-act="${modal.act}">${modal.yes}</button>
  <button class="btn ghost" data-act="close">Hủy</button>`;

modals.newname = () => `
  <h2>Thêm tên mới</h2>
  <p class="muted">Tên sẽ được lưu vào danh sách để chọn cho các ván sau.</p>
  <form class="guess" data-form="newname">
    <input id="newname-input" name="name" type="text" maxlength="16" autocomplete="off" placeholder="Tên người chơi">
    <button class="btn">Thêm</button>
  </form>
  <button class="btn ghost" data-act="close">Hủy</button>`;

actions.go = (el) => go(el.dataset.view);
actions.close = () => (modal = null);
actions.rules = (el) => (modal = { type: 'rules', game: el.dataset.game });
actions.tstep = (el) => {
  table.n += Number(el.dataset.d);
  save('dmi.table', table);
};

forms.newname = (form) => {
  const typed = form.elements.name.value.trim();
  if (!typed) return;
  // Trùng tên có sẵn (không phân biệt hoa/thường) thì dùng lại tên đó
  const name = roster().find((r) => r.toLowerCase() === typed.toLowerCase()) || typed;
  if (!roster().includes(name)) table.extra.push(name);
  assignName(modal.seat, name);
  modal = null;
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  actions[el.dataset.act](el);
  render();
});

document.addEventListener('change', (e) => {
  const seat = e.target.dataset.seat;
  if (seat === undefined) return;
  if (e.target.value === NEW_NAME) modal = { type: 'newname', seat: Number(seat) };
  else assignName(Number(seat), e.target.value);
  // Ô chọn đã tự đổi trên trang, vẽ lại cả trang để khớp với tên đã lưu
  drawn.app = null;
  render();
  if (modal) document.querySelector('#newname-input')?.focus();
});

document.addEventListener('submit', (e) => {
  const handler = forms[e.target.dataset.form];
  if (!handler) return;
  e.preventDefault();
  handler(e.target);
  render();
});

</script>

<script>
// Game Gián Điệp: Dân và Gián điệp nhận 2 từ khóa na ná nhau, Mũ trắng không có từ.
const SPY_MIN = 3;
const SPY_ROLES = {
  civ: { label: 'Dân thường', emoji: '🧑‍🌾' },
  spy: { label: 'Gián điệp', emoji: '🕵️' },
  white: { label: 'Mũ trắng', emoji: '🎩' },
};
const SPY_POINTS = { civ: 2, spy: 10, white: 6 };
const SPY_CATS = WORD_PACKS.map((p) => p.id);
const SPY_TOTAL = WORD_PACKS.reduce((sum, p) => sum + p.pairs.length, 0);

let spyCfg = {
  spies: oldCfg?.spies ?? 1,
  whites: oldCfg?.whites ?? 0,
  cats: oldCfg?.cats || SPY_CATS,
  ...load('dmi.spy', {}),
};
let spyUsed = load('gd.used', []);
let sg = null;

// So khớp lời đoán của Mũ trắng: bỏ dấu, hoa/thường, khoảng trắng
const spyNorm = (s) =>
  s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]/g, '');
const spyMaxHidden = (n) => Math.floor((n - 1) / 2);

function fixSpy() {
  const max = spyMaxHidden(table.n);
  spyCfg.spies = Math.min(max, Math.max(0, spyCfg.spies));
  spyCfg.whites = Math.min(max - spyCfg.spies, Math.max(0, spyCfg.whites));
  if (spyCfg.spies + spyCfg.whites === 0) spyCfg.spies = 1;
  spyCfg.cats = spyCfg.cats.filter((id) => SPY_CATS.includes(id));
  if (!spyCfg.cats.length) spyCfg.cats = [...SPY_CATS];
  save('dmi.spy', spyCfg);
}

/* ---------- Game logic ---------- */

// Không ra lại cặp đã chơi (danh sách đồng bộ online, xem loadSpyUsed) cho tới khi dùng hết các chủ đề đang chọn.
// Ưu tiên cặp mà cả 2 từ chưa từng xuất hiện, vì một từ có thể nằm trong nhiều cặp (Ổi|Cóc và Ếch|Cóc).
function spyPickPair() {
  const all = WORD_PACKS.filter((p) => spyCfg.cats.includes(p.id)).flatMap((p) => p.pairs);
  const usedWords = new Set(spyUsed.flatMap((pair) => pair.split('|')));
  const fresh = all.filter((pair) => !spyUsed.includes(pair));
  let pool = fresh.filter((pair) => pair.split('|').every((word) => !usedWords.has(word)));
  if (!pool.length) pool = fresh;
  let forget = [];
  if (!pool.length) {
    forget = all;
    spyUsed = spyUsed.filter((pair) => !all.includes(pair));
    pool = all;
  }
  const pair = pool[rand(pool.length)];
  spyUsed.push(pair);
  save('gd.used', spyUsed);
  saveSpyUsed(pair, forget);
  return pair;
}

function spyNewGame() {
  fixTable(SPY_MIN);
  fixSpy();
  const n = table.n;
  const words = spyPickPair().split('|');
  if (Math.random() < 0.5) words.reverse();
  const roles = shuffle([
    ...Array(spyCfg.spies).fill('spy'),
    ...Array(spyCfg.whites).fill('white'),
    ...Array(n - spyCfg.spies - spyCfg.whites).fill('civ'),
  ]);
  // Mũ trắng không bao giờ phải nói đầu tiên
  const starters = roles.map((r, i) => (r === 'white' ? -1 : i)).filter((i) => i >= 0);
  sg = {
    names: tableNames(),
    civWord: words[0],
    spyWord: words[1],
    roles,
    alive: Array(n).fill(true),
    start: starters[rand(starters.length)],
    dealIdx: 0,
    shown: false,
    round: 1,
    sel: null,
    out: null,
    guess: null,
    winner: null,
    winnerIdx: null,
  };
  go('spy.deal');
}

const spyWordOf = (i) => (sg.roles[i] === 'civ' ? sg.civWord : sg.roles[i] === 'spy' ? sg.spyWord : null);
const spyAlive = (...roles) => sg.roles.filter((r, i) => sg.alive[i] && roles.includes(r)).length;
const spyOrder = () => sg.roles.map((_, k) => (sg.start + k) % sg.roles.length).filter((i) => sg.alive[i]);

function spyCheckWin() {
  if (spyAlive('spy', 'white') === 0) return 'civ';
  if (spyAlive('civ') <= 1) return 'inf';
  return null;
}

function spyFinish(winner, winnerIdx = null) {
  sg.winner = winner;
  sg.winnerIdx = winnerIdx;
  const results = sg.roles.map((role, i) => {
    const win =
      (winner === 'civ' && role === 'civ') || (winner === 'inf' && role !== 'civ') || (winner === 'white' && i === winnerIdx);
    return { name: sg.names[i], pts: win ? SPY_POINTS[role] : 0, win };
  });
  const who = { civ: 'Phe Dân thắng', inf: 'Phe Gián điệp thắng', white: `Mũ trắng ${sg.names[winnerIdx]} thắng` }[winner];
  recordGame('spy', `${who} · ${sg.civWord} / ${sg.spyWord}`, results);
  go('spy.end');
}

/* ---------- Views ---------- */

const spyTag = (role) => `<span class="tag ${role}">${SPY_ROLES[role].label}</span>`;

views['spy.setup'] = () => {
  const tableHtml = tableSection(SPY_MIN);
  fixSpy();
  const max = spyMaxHidden(table.n);
  const civs = table.n - spyCfg.spies - spyCfg.whites;
  const selected = WORD_PACKS.filter((p) => spyCfg.cats.includes(p.id)).reduce((s, p) => s + p.pairs.length, 0);
  // Số cặp chưa chơi (danh sách cặp đã ra đồng bộ online, xem loadSpyUsed)
  const used = new Set(spyUsed);
  const leftOf = (p) => p.pairs.filter((pair) => !used.has(pair)).length;
  const left = WORD_PACKS.filter((p) => spyCfg.cats.includes(p.id)).reduce((s, p) => s + leftOf(p), 0);
  return `
    <div class="topbar">
      <button class="back" data-act="go" data-view="home">←</button>
      <h2>🕵️ Gián Điệp</h2>
      <button class="link small" data-act="rules" data-game="spy">Luật chơi</button>
    </div>
    ${tableHtml}

    <div class="card stack">
      <div class="row between">
        <span><i class="role-dot civ"></i><b>Dân thường</b></span><b>${civs}</b>
      </div>
      <div class="row between">
        <span><i class="role-dot spy"></i><b>Gián điệp</b><br><span class="muted small">Nhận từ khóa na ná phe Dân</span></span>
        ${stepper('spy.step', 'spies', spyCfg.spies, spyCfg.whites ? 0 : 1, max - spyCfg.whites)}
      </div>
      <div class="row between">
        <span><i class="role-dot white"></i><b>Mũ trắng</b><br><span class="muted small">Không có từ khóa, phải đoán mò</span></span>
        ${stepper('spy.step', 'whites', spyCfg.whites, spyCfg.spies ? 0 : 1, max - spyCfg.spies)}
      </div>
    </div>

    <div class="card stack">
      <div class="row between">
        <b>Chủ đề</b>
        <button class="link small" data-act="spy.allcats">Chọn tất cả</button>
      </div>
      <div class="chips">
        ${WORD_PACKS.map((p) => `
          <button class="chip ${spyCfg.cats.includes(p.id) ? 'on' : ''}" data-act="spy.cat" data-id="${p.id}">
            ${p.icon} ${p.name} · ${leftOf(p)}/${p.pairs.length}
          </button>`).join('')}
      </div>
      <p class="muted small">Đang chọn ${selected} cặp từ khóa · còn <b>${left}</b> cặp chưa chơi${left ? '' : ' (đã chơi hết, ván sau bắt đầu lại từ đầu)'}</p>
    </div>

    <button class="btn" data-act="spy.start">Bắt đầu chia từ</button>`;
};

views['spy.deal'] = () => {
  const i = sg.dealIdx;
  const n = sg.roles.length;
  const name = sg.names[i];
  const word = spyWordOf(i);
  const body = !sg.shown
    ? `<p class="muted">Đưa máy cho</p>
       ${avatar(name, 'big')}
       <div class="who">${esc(name)}</div>
       <p class="muted small">Đừng để ai khác nhìn thấy màn hình!</p>`
    : word
      ? `<p class="muted">Từ khóa của ${esc(name)}</p>
         <div class="word">${esc(word)}</div>
         <p class="muted small">Ghi nhớ rồi bấm ẩn trước khi chuyền máy.</p>`
      : `<div class="emoji">🎩</div>
         <div class="word">MŨ TRẮNG</div>
         <p class="muted">Bạn không có từ khóa. Hãy lắng nghe, nói thật mơ hồ và đoán từ của mọi người!</p>`;
  return `
    <div class="topbar">
      <h2>Chia từ khóa</h2>
      <span class="muted">${i + 1}/${n}</span>
      <button class="back" data-act="spy.quit">✕</button>
    </div>
    <div class="progress"><i style="width:${(i / n) * 100}%"></i></div>
    <div class="secret">${body}</div>
    ${sg.shown
      ? `<button class="btn ghost" data-act="spy.hide">Đã nhớ, ẩn đi</button>`
      : `<button class="btn" data-act="spy.show">Xem từ khóa</button>`}`;
};

views['spy.discuss'] = () => {
  const order = spyOrder();
  const outs = sg.roles.map((_, i) => i).filter((i) => !sg.alive[i]);
  const spies = spyAlive('spy');
  const whites = spyAlive('white');
  const hidden = [spies && `${spies} gián điệp`, whites && `${whites} mũ trắng`].filter(Boolean).join(', ');
  return `
    <div class="topbar">
      <h2>Vòng ${sg.round} · Mô tả</h2>
      <button class="back" data-act="spy.quit">✕</button>
    </div>
    <div class="card stack">
      <p>Lần lượt mỗi người mô tả từ của mình bằng <b>một từ hoặc một câu ngắn</b>, không nói thẳng từ khóa.</p>
      <p class="small muted">Còn ẩn nấp: <b>${hidden}</b></p>
    </div>
    <div class="pgrid grow">
      ${order.map((i, k) => playerCard(sg.names[i], {
        seat: k + 1,
        cls: k === 0 ? 'first' : '',
        extra: k === 0 ? '<span class="tag first">Nói trước</span>' : '',
      })).join('')}
      ${outs.map((i) => playerCard(sg.names[i], { cls: 'out', extra: spyTag(sg.roles[i]) })).join('')}
    </div>
    <button class="btn" data-act="spy.tovote">🗳️ Bỏ phiếu</button>
    <button class="btn ghost" data-act="spy.peek">👁️ Quên từ? Xem lại</button>`;
};

views['spy.vote'] = () => `
  <div class="topbar">
    <button class="back" data-act="go" data-view="spy.discuss">←</button>
    <h2>Ai bị loại?</h2>
  </div>
  <div class="card"><p>Cả nhóm đếm 3-2-1 rồi cùng chỉ tay. Chọn người nhận nhiều phiếu nhất.</p></div>
  <div class="pgrid grow">
    ${sg.roles.map((_, i) => (sg.alive[i]
      ? playerCard(sg.names[i], { seat: i + 1, cls: sg.sel === i ? 'sel' : '', act: 'spy.select', i })
      : '')).join('')}
  </div>
  <button class="btn" data-act="spy.eliminate" ${sg.sel === null ? 'disabled' : ''}>
    ${sg.sel === null ? 'Chọn một người' : `Loại ${esc(sg.names[sg.sel])}`}
  </button>`;

views['spy.reveal'] = () => {
  const i = sg.out;

  const canGuess = role === 'white' && !sg.guess;
  return `

};

modals['spy.peek'] = () => {

    return `

        ${sg.roles.map((_, i) => (sg.alive[i] ? playerCard(sg.names[i], { act: 'spy.peekwho', i }) : '')).join('')}

      <button class="btn ghost" data-act="close">Đóng</button>`;
  }
  const word = spyWordOf(modal.idx);
  return `
    <div class="secret" style="min-height:220px">
      <p class="muted">${esc(sg.names[modal.idx])}</p>
      <div class="word">${word ? esc(word) : '🎩 MŨ TRẮNG'}</div>
    </div>
    <button class="btn" data-act="close">Ẩn đi</button>`;
};

/* ---------- Actions ---------- */

Object.assign(actions, {
  'spy.step': (el) => {
    spyCfg[el.dataset.key] += Number(el.dataset.d);
    fixSpy();
  },
  'spy.cat': (el) => {
    const id = el.dataset.id;
    const on = spyCfg.cats.includes(id);
    if (on && spyCfg.cats.length === 1) return;
    spyCfg.cats = on ? spyCfg.cats.filter((c) => c !== id) : [...spyCfg.cats, id];
    save('dmi.spy', spyCfg);
  },
  'spy.allcats': () => {
    spyCfg.cats = [...SPY_CATS];
    save('dmi.spy', spyCfg);
  },
  'spy.start': () => spyNewGame(),
  'spy.quit': () =>
    (modal = {
      type: 'confirm',
      title: 'Thoát ván đang chơi?',
      text: 'Ván này sẽ bị hủy và không tính điểm.',
      yes: 'Thoát ván',
      act: 'spy.quitnow',
    }),
  'spy.quitnow': () => {
    modal = null;
    sg = null;
    go('spy.setup');
  },
  'spy.show': () => (sg.shown = true),
  'spy.hide': () => {
    sg.shown = false;
    if (++sg.dealIdx >= sg.roles.length) go('spy.discuss');
  },
  'spy.peek': () => (modal = { type: 'spy.peek', idx: null }),
  'spy.peekwho': (el) => (modal.idx = Number(el.dataset.i)),
  'spy.tovote': () => {
    sg.sel = null;
    go('spy.vote');
  },
  'spy.select': (el) => (sg.sel = Number(el.dataset.i)),
  'spy.eliminate': () => {
    sg.out = sg.sel;
    sg.alive[sg.out] = false;
    sg.sel = null;
    sg.guess = null;
    go('spy.reveal');
  },
  'spy.continue': () => {
    const winner = spyCheckWin();
    if (winner) return spyFinish(winner);
    sg.round++;
    go('spy.discuss');
  },
});

forms['spy.guess'] = (form) => {
  const text = form.elements.guess.value.trim();
  if (!text) return;
  if (spyNorm(text) === spyNorm(sg.civWord)) spyFinish('white', sg.out);
  else sg.guess = text;
};

GAMES.push({
  id: 'spy',
  name: 'Gián Điệp',
  icon: '🕵️',
  desc: 'Ai đang giữ từ khóa khác với mọi người?',
  meta: `${SPY_MIN}–${MAX_PLAYERS} người · ${SPY_TOTAL} cặp từ khóa`,
  setup: 'spy.setup',
  rules: () => `
