  render();
});

// Mỗi người một ngôi nhà (nhà nào cũng như nhau) xếp quanh quảng trường; ban ngày người chơi đứng vòng quanh giàn treo
// cổ, máy mình đứng gần mắt nhất. Ban đêm ai cũng về nhà: chỉ còn nhà, cửa sổ sáng đèn; người được gọi dậy (o.walkers,
// chỉ có trên máy của chính họ, Sói thì thấy cả bầy) ra trước cửa đi lại, và bấm vào nhà để chọn người.
// Thân người và nhà nằm trong cảnh (che nhau theo độ sâu); tên, số phiếu, vòng chọn, ánh đèn ở lớp trên, không bị trời
// tối che.
// seats: [{ uid, name, alive, bot }]
// o: { act, can(k), sel, counts, accused, mates, host, night, walkers }
function mwwCastOf(seats, o = {}) {
  const n = Math.max(1, seats.length);
  const me = Math.max(0, seats.findIndex((s) => s.uid === myId));
  mwwHere = { seats, me, o, n };
  const fx = mwwFx.map((f) => ({ ...f, t: Date.now() - f.at })).filter((f) => f.t < MWW_FX_MS && seats[f.k]);
  const { ring, homes } = mwwLayout();
  const { cx, cy, rx, ry } = ring;
  const round = (r1, r2) => 2 * Math.PI * Math.sqrt((r1 * r1 + r2 * r2) / 2);
  const gap = (round(rx, ry) / n / 10).toFixed(1);
  const hw = Math.min(homes.house, (round(homes.rx, homes.ry) / n) * 0.9);
  const [sw, sh] = MWW_SPRITES.house;
  const hh = (hw * sh) / sw;
  const now = Date.now() / 1000;
  const at = (x, y) => `left:${(x / 10).toFixed(2)}%;top:${(y / 9).toFixed(2)}%`;
  const cast = [];
  const tags = [];
  seats.forEach((s, k) => {
    const a = Math.PI / 2 + ((k - me) / n) * 2 * Math.PI;
    const cos = Math.cos(a);
    const sin = Math.sin(a);
    const can = Boolean(o.act && o.can?.(k));
    const cls = [!s.alive && 'dead', can && 'can', o.sel === k && 'sel', mwwFocus === k && 'focus', s.uid === myId && 'me', o.mates?.includes(k) && 'ally']
      .filter(Boolean).join(' ');
    const label = `${o.host === s.uid ? '👑 ' : ''}${s.alive ? '' : '✝ '}${o.mates?.includes(k) && s.uid !== myId ? '🐺 ' : ''}${esc(s.name)}`;
    // Nhà: ban đêm bấm vào nhà để chọn người đó
    const [hx, hy] = [cx + homes.rx * cos, cy + homes.ry * sin];
    // Sói cắn, nguyền, đầu độc: nhà rung trong lúc hoạt ảnh chạy
    const hit = fx.find((f) => f.k === k && !f.gallows && MWW_FX_SHAKE.includes(f.kind));
    cast.push(`
      <button class="home ${cls} ${hit ? 'shake' : ''}" style="${at(hx, hy)};width:${(hw / 10).toFixed(2)}%;z-index:${Math.round(hy)};${hit ? `--t:-${hit.t}ms` : ''}" data-act="mww.focus" data-i="${k}" aria-label="Nhà của ${esc(s.name)}">
        <svg viewBox="0 0 ${sw} ${sh}" style="color:${mwwColor(s)}"><use href="#mww-house"/></svg>
      </button>`);
    // Số phiếu (ban ngày) hay số Sói đang chọn (ban đêm, trên máy của Sói) hiện trên nóc nhà người đó
    if (o.counts?.[k]) tags.push(`<i class="hcount ${o.night ? 'night' : ''}" style="${at(hx, hy - hh - 4)}" aria-label="${o.counts[k]} phiếu">${o.counts[k]}</i>`);
    // Ban đêm người được gọi dậy đứng ngoài quảng trường, có tên trên đầu: tên trên nóc nhà thì thôi để khỏi đè
    const walking = o.night && o.walkers?.includes(k);
    if (o.night) {
      if (s.alive) {
        tags.push(MWW_LIGHTS.house.map(([lx, ly]) => `<i class="glow house" style="${at(hx - hw / 2 + (lx * hw) / sw, hy - ((sh - ly) * hw) / sw)}"></i>`).join(''));
      }
      if (!walking) tags.push(`<span class="htag ${cls}" style="${at(hx, hy - hh - 4)};max-width:${(hw / 10 + 2).toFixed(1)}cqw"><b>${label}</b></span>`);
    }
    // Người: ban ngày đứng quanh giàn (người bị buộc tội đứng trên giàn); ban đêm chỉ người được gọi dậy, đi lại trước cửa
    if (o.night && !walking) return;
    const [x, y] = mwwWhere(k);
    // Đi qua đi lại trước cửa cho tới khi chính mình cầm cần gạt đi
    const patrol = walking && !(k === me && mwwWalk.pos) ? 'walk' : '';
    const pos = `${at(x, y)};--s:${mwwScale(y)}`;
    // Nhịp nhún, nhịp đi theo đồng hồ chung nên vẽ lại không làm người giật về đầu nhịp
    const beat = `--d:-${((now + k * 0.7) % 2.8).toFixed(2)}s;--w:-${((now + k * 1.3) % 9).toFixed(2)}s`;
    // Người trên giàn đứng trên sàn nên phải nằm trước giàn
    const z = k === o.accused ? MWW_GALLOWS_Z + 1 : Math.round(y) + 1;
    // Ban đêm, trên máy của Sói: mình và đồng bọn hiện hình con sói (máy khác không thấy ai đi lại ban đêm)
    // Mình đang làm việc trong nhà người khác thì khuất vào trong nhà
    const inside = k === me && fx.some((f) => f.mine);
    cast.push(`
      <button class="vil ${cls} ${patrol} ${k === me && mwwWalk.face < 0 ? 'flip' : ''} ${inside ? 'inside' : ''}" style="${pos};${beat};z-index:${z}" data-act="mww.focus" data-i="${k}" data-seat="${k}" aria-label="${esc(s.name)}">
        <svg viewBox="0 0 52 56" style="color:${mwwColor(s)}"><use href="#mww-${!s.alive ? 'tomb' : o.night && o.mates?.includes(k) ? 'wolf' : k === o.accused ? 'scared' : 'villager'}"/></svg>
      </button>`);
    tags.push(`
      <span class="spot ${cls} ${patrol}" style="${pos};${beat}" data-seat="${k}"></span>
      <span class="ntag ${cls} ${patrol}" style="${pos};${beat};max-width:${k === o.accused ? 30 : gap}cqw" data-seat="${k}">
        <b>${label}</b>
      </span>`);
  });
  // Hoạt ảnh: ở giữa nhà người được chọn, hay trên giàn với người bị treo cổ
  fx.forEach((f) => {
    const [hx, hy] = mwwHomeOf(f.k);
    const [x, y] = f.gallows ? [MWW_GALLOWS_SPOT[0], MWW_GALLOWS_SPOT[1] - 45] : [hx, hy - hh * 0.55];
    tags.push(`
      <div class="fx fx-${f.kind}" style="${at(x, y)};width:${((hw / 10) * 1.25).toFixed(1)}cqw;--t:-${f.t}ms" aria-hidden="true">
        <i class="fx-a"></i><i class="fx-b">${f.kind === 'wolf' ? MWW_CLAWS : ''}</i><b>${MWW_FX[f.kind]}</b>
      </div>`);
  });
  return { cast: cast.join(''), tags: tags.join('') };
}

// Hoạt ảnh trong làng. Vai làm việc ở nhà người được chọn: chỉ chạy trên máy người làm (mine), rồi người đó đi về nhà
// mình. Người chết đêm qua (ở nhà họ) và người bị treo cổ (trên giàn): chạy trên mọi máy. Vẽ lại giữa chừng thì chạy
// tiếp đúng chỗ, vì độ trễ của hoạt ảnh tính từ lúc bắt đầu (--t âm).
const MWW_FX_MS = 2800;
// Hình to giữa hoạt ảnh của từng việc (cùng nét viền đậm với nhân vật)
const MWW_ICON = (body) => `<svg viewBox="0 0 40 40" stroke="#14110f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${body}</svg>`;
const MWW_BOTTLE = (color, mark) => MWW_ICON(`<path d="M15 4H25V8H23.6V13Q32 16 32 25Q32 35.4 20 35.4Q8 35.4 8 25Q8 16 16.4 13V8H15Z" fill="#e9f3f6"/><path d="M9.4 23Q20 20 30.6 23Q31 34 20 34Q9 34 9.4 23Z" fill="${color}" stroke="none"/><path d="M15 4H25V8H15Z" fill="#8d5a3b"/>${mark}`);
const MWW_FX = {
  wolf: MWW_ICON('<ellipse cx="20" cy="27" rx="8" ry="6.6" fill="#8F2929"/><ellipse cx="9.6" cy="17.6" rx="3.2" ry="4.2" fill="#8F2929"/><ellipse cx="16" cy="11" rx="3.2" ry="4.4" fill="#8F2929"/><ellipse cx="24" cy="11" rx="3.2" ry="4.4" fill="#8F2929"/><ellipse cx="30.4" cy="17.6" rx="3.2" ry="4.2" fill="#8F2929"/>'),
  curse: MWW_ICON('<path d="M25 5A15 15 0 1 0 35 27A11.6 11.6 0 1 1 25 5Z" fill="#9b5de5"/><circle cx="29" cy="12" r="1.4" fill="#e3d2ff" stroke="none"/><circle cx="33" cy="19" r="1" fill="#e3d2ff" stroke="none"/>'),
  seer: MWW_ICON('<path d="M3 20Q20 5 37 20Q20 35 3 20Z" fill="#fff"/><circle cx="20" cy="20" r="7" fill="#8a5cf0"/><circle cx="20" cy="20" r="3" fill="#14110f" stroke="none"/><circle cx="22.4" cy="17.6" r="1.3" fill="#fff" stroke="none"/>'),
  guard: MWW_ICON('<path d="M20 3L34 8.4V19Q34 31 20 37Q6 31 6 19V8.4Z" fill="#f0c75a"/><path d="M20 7.6L30 11.4V19Q30 28 20 32.6Q10 28 10 19V11.4Z" fill="#e0a93a" stroke="#b5862b" stroke-width="1.4"/><path d="M20 12V28M13.6 18H26.4" stroke="#fff6d8" stroke-width="2.6"/>'),
  hunter: MWW_ICON('<path d="M8 32L30 10" stroke="#8d5a3b" stroke-width="3"/><path d="M34 6L24 8.6L31.4 16Z" fill="#c9cdd6"/><path d="M8 32L5 28.6M8 32L11.4 35M11 29L8 25.6M11 29L14.4 32" stroke="#d64541" stroke-width="2.2"/>'),
  poison: MWW_BOTTLE('#5fd068', '<circle cx="16" cy="27" r="1.6" fill="#e9f3f6" stroke="none"/><circle cx="22.6" cy="29.4" r="1.2" fill="#e9f3f6" stroke="none"/><circle cx="20" cy="24.6" r="1" fill="#e9f3f6" stroke="none"/>'),
  heal: MWW_BOTTLE('#ff7aa8', '<path d="M20 31Q14 27 14.6 24Q15.4 21.6 17.6 22Q19.2 22.4 20 24Q20.8 22.4 22.4 22Q24.6 21.6 25.4 24Q26 27 20 31Z" fill="#fff" stroke="none"/>'),
  death: MWW_ICON('<path d="M9 35V18Q9 5 20 5Q31 5 31 18V35L27.4 31.6L23.6 35L20 31.6L16.4 35L12.6 31.6Z" fill="#eef1f6"/><ellipse cx="16" cy="17" rx="2" ry="2.8" fill="#14110f" stroke="none"/><ellipse cx="24" cy="17" rx="2" ry="2.8" fill="#14110f" stroke="none"/><ellipse cx="20" cy="24" rx="2" ry="2.6" fill="#14110f" stroke="none"/>'),
};
MWW_FX.hang = MWW_FX.death;
const MWW_FX_SHAKE = ['wolf', 'curse', 'hunter', 'poison'];
// Ba vết móng vuốt cong, song song, chéo từ trên phải xuống dưới trái
const MWW_CLAWS = '<svg viewBox="0 0 100 100"><path pathLength="100" d="M58 8 Q44 40 20 74"/><path pathLength="100" d="M73 15 Q58 50 34 86"/><path pathLength="100" d="M88 24 Q72 58 50 94"/></svg>';
let mwwFx = []; // { k, kind, at, gallows, mine }
function mwwPlay(k, kind, { gallows = false, mine = false } = {}) {
  mwwFx.push({ k, kind, at: Date.now(), gallows, mine });
  setTimeout(() => {
    mwwFx = mwwFx.filter((f) => Date.now() - f.at < MWW_FX_MS);
    // Làm xong việc thì ra khỏi nhà, camera lùi ra, đi về trước cửa nhà mình
    if (mine) mwwZoom(null);
    if (mine && mwwHere && mwwCanWalk()) mwwWalk.to = { k: null, at: mwwDoorOf(mwwHere.me) };
    render();
  }, MWW_FX_MS + 30);
}

/* ---------- Đi lại trong làng ---------- */

// Bấm vào nhà hay người nào thì mở ngay thẻ người đó. Ban đêm chốt chọn trên thẻ rồi nhân vật của mình mới đi tới trước
// cửa nhà người đó, camera zoom vào nhà, tới nơi thì vào nhà làm việc của vai (hoạt ảnh), xong thì lùi ra và đi về nhà
// mình; chuyến đi chạy nốt kể cả khi lượt của vai đã qua (mwwTrip). Ban ngày mọi người đứng yên quanh giàn.
// Vị trí ban ngày gửi cho cả phòng qua WebSocket (server/boardgame-live.ts), khoảng 10 lần một giây; ban đêm không gửi
// để không lộ ai đang thức. Mỗi máy xoay làng cho mình đứng gần mắt nhất và bố cục màn dọc khác màn ngang, nên vị trí
// gửi đi quy về khung chung: trên vùng đi lại (hình bầu dục) với ghế 0 ở dưới cùng, toạ độ trong khoảng ±50.
let mwwHere = null; // { seats, me, o, n } của lần vẽ cảnh gần nhất
let mwwTrip = null; // { k, fx: [{ k, kind }] } chuyến đi sau khi chốt chọn
const mwwWalk = { pos: null, to: null, face: 1, raf: 0, last: 0, sent: 0, sentKey: '', moving: false };
const mwwLive = new Map(); // mã người chơi -> { x, z, r, t } người khác báo
let mwwLiveWs = null;
let mwwLiveRoom = '';
let mwwLiveRetry = 0;
let mwwLiveTimer = 0;

const mwwScale = (y) => {
  const { cy, ry } = mwwLayout().ring;
  return (0.8 + (0.32 * (y - (cy - ry))) / (2 * ry)).toFixed(3);
};
const mwwAngle = (k) => Math.PI / 2 + ((k - mwwHere.me) / mwwHere.n) * 2 * Math.PI;
function mwwHomeOf(k) {
  const { ring, homes } = mwwLayout();
  const a = mwwAngle(k);
  return [ring.cx + homes.rx * Math.cos(a), ring.cy + homes.ry * Math.sin(a)];
}
// Vùng đi lại: bên trong vòng nhà
function mwwWalkArea() {
  const { ring, homes } = mwwLayout();
  return { cx: ring.cx, cy: ring.cy, rx: homes.rx - 35, ry: homes.ry - 30 };
}
// Không đi xuyên giàn treo cổ
// Giàn treo cổ chắn đường (tính cả phần bục vẽ cao lên, để không ai trông như đứng trên giàn)
const MWW_GALLOWS_BOX = { x0: 395, x1: 605, y0: 400, y1: 515 };
const mwwBlocked = (x, y) => x > MWW_GALLOWS_BOX.x0 && x < MWW_GALLOWS_BOX.x1 && y > MWW_GALLOWS_BOX.y0 && y < MWW_GALLOWS_BOX.y1;
const mwwCrosses = ([ax, ay], [bx, by]) => {
  for (let k = 1; k < 40; k++) if (mwwBlocked(ax + ((bx - ax) * k) / 40, ay + ((by - ay) * k) / 40)) return true;
  return false;
};
// Đường đi từ a tới b: thẳng nếu không cắt giàn; không thì vòng qua một góc ngoài giàn, hay hai góc cùng phía, chọn
// đường ngắn nhất
function mwwRoute(a, b) {
  if (!mwwCrosses(a, b)) return [b];
  const { x0, x1, y0, y1 } = MWW_GALLOWS_BOX;
  const m = 14;
  const c = { tl: [x0 - m, y0 - m], tr: [x1 + m, y0 - m], bl: [x0 - m, y1 + m], br: [x1 + m, y1 + m] };
  const len = (pts) => pts.reduce((sum, p, k) => sum + (k ? Math.hypot(p[0] - pts[k - 1][0], p[1] - pts[k - 1][1]) : 0), 0);
  const ok = (pts) => pts.every((p, k) => !k || !mwwCrosses(pts[k - 1], p));
  const routes = [
    ...Object.values(c).map((p) => [p]),
    [c.tl, c.tr], [c.tr, c.tl], [c.bl, c.br], [c.br, c.bl], [c.tl, c.bl], [c.bl, c.tl], [c.tr, c.br], [c.br, c.tr],
  ].map((via) => [a, ...via, b]).filter(ok);
  routes.sort((r1, r2) => len(r1) - len(r2));
  return routes.length ? routes[0].slice(1) : [b];
}

// Người ở ghế k đang đứng đâu (toạ độ thế giới): trên giàn, chỗ mình đã đi tới, chỗ người khác báo qua mạng, hay chỗ
// đứng sẵn (ban ngày quanh giàn, ban đêm trước cửa nhà)
function mwwWhere(k) {
  const { seats, me, o } = mwwHere;
  const { ring, homes } = mwwLayout();
  const a = mwwAngle(k);
  if (k === o.accused) return MWW_GALLOWS_SPOT;
  if (k === me && mwwWalk.pos && mwwCanWalk()) return mwwWalk.pos;
  const live = !o.night && seats[k]?.alive && mwwLive.get(seats[k].uid);
  if (live && Date.now() - live.t < 20000) return mwwFromShared(live);
  // Ban đêm người được gọi dậy cũng đứng ở chỗ ban ngày trên quảng trường, không đứng sát nhà kẻo bị mái nhà che
  return [ring.cx + ring.rx * Math.cos(a), ring.cy + ring.ry * Math.sin(a)];
}

// Mình đi được không: có ghế, còn sống, không đứng trên giàn; ban đêm chỉ khi được gọi dậy
function mwwCanWalk() {
  const { seats, me, o } = mwwHere || {};
  const s = seats?.[me];
  if (!s || s.uid !== myId || !s.alive || me === o.accused) return false;
  return !o.night || Boolean(o.walkers?.includes(me)) || Boolean(mwwTrip);
}

// Chốt chọn xong: đi tới cửa nhà ghế k; fx chạy khi tới nơi; zoom: camera tới nhà đó luôn
function mwwGo(k, fx = [], zoom = false) {
  if (!mwwHere || k === mwwHere.me) return;
  mwwTrip = { k, fx };
  mwwWalk.to = { k, at: mwwDoorOf(k) };
  if (zoom) mwwZoom(k);
}

// Camera zoom vào nhà ghế k (đưa nhà ra giữa màn hình), null thì lùi về như cũ
function mwwZoom(k) {
  const worlds = [...document.querySelectorAll('#stage .world')];
  if (!worlds.length) return;
  if (k === null) {
    worlds.forEach((w) => {
      w.style.scale = '';
      w.style.translate = '';
    });
    return;
  }
  const r = worlds[0].getBoundingClientRect();
  const [hx, hy] = mwwHomeOf(k);
  const y0 = hy - 50;
  const dx = innerWidth / 2 - (r.left + (hx / 1000) * r.width);
  const dy = innerHeight / 2 - (r.top + (y0 / 900) * r.height);
  worlds.forEach((w) => {
    w.style.transformOrigin = `${hx / 10}% ${y0 / 9}%`;
    w.style.translate = `calc(-50% + ${dx.toFixed(1)}px) calc(-50% + ${dy.toFixed(1)}px)`;
    w.style.scale = '1.8';
  });
}

function mwwToShared([x, y]) {
  const w = mwwWalkArea();
  const u = (x - w.cx) / w.rx;
  const v = (y - w.cy) / w.ry;
  const r = Math.min(1, Math.hypot(u, v));
  const t = Math.atan2(v, u) + (mwwHere.me / mwwHere.n) * 2 * Math.PI;
  return { x: r * Math.cos(t) * 50, z: r * Math.sin(t) * 50 };
}
function mwwFromShared({ x, z }) {
  const w = mwwWalkArea();
  const r = Math.min(1, Math.hypot(x, z) / 50);
  const t = Math.atan2(z, x) - (mwwHere.me / mwwHere.n) * 2 * Math.PI;
  return [w.cx + w.rx * r * Math.cos(t), w.cy + w.ry * r * Math.sin(t)];
}

// Dời người ở ghế k tới chỗ của họ ngay trên cảnh, không vẽ lại cả trang
function mwwPlace(k) {
  const [x, y] = mwwWhere(k);
  const left = `${(x / 10).toFixed(2)}%`;
  const top = `${(y / 9).toFixed(2)}%`;
  const mine = k === mwwHere.me;
  const remote = mwwLive.get(mwwHere.seats[k]?.uid);
  document.querySelectorAll(`#stage [data-seat="${k}"]`).forEach((el) => {
    el.style.left = left;
    el.style.top = top;
    el.style.setProperty('--s', mwwScale(y));
    if (mine) el.classList.remove('walk');
    if (!el.classList.contains('vil')) return;
    el.style.zIndex = Math.round(y) + 1;
    el.classList.toggle('moving', mine && mwwWalk.moving);
    el.classList.toggle('flip', mine ? mwwWalk.face < 0 : remote?.r < 0);
  });
}

function mwwWalkLoop(t) {
  mwwWalk.raf = requestAnimationFrame(mwwWalkLoop);
  const dt = Math.min(0.05, (t - (mwwWalk.last || t)) / 1000);
  mwwWalk.last = t;
  if (!mwwHere) return;
  const to = mwwWalk.to;
  if (to && mwwCanWalk()) {
    const [x0, y0] = mwwWalk.pos || mwwWhere(mwwHere.me);
    // Đi theo từng chặng (vòng qua giàn treo cổ nếu cần), tính một lần khi bắt đầu đi
    to.path ||= mwwRoute([x0, y0], to.at);
    let step = 300 * dt;
    let [x, y] = [x0, y0];
    while (step > 0 && to.path.length) {
      const [tx, ty] = to.path[0];
      const dist = Math.hypot(tx - x, ty - y);
      if (Math.abs(tx - x) > 4) mwwWalk.face = tx < x ? -1 : 1;
      if (dist <= step) {
        [x, y] = [tx, ty];
        step -= dist;
        to.path.shift();
      } else {
        x += ((tx - x) / dist) * step;
        y += ((ty - y) / dist) * step;
        step = 0;
      }
    }
    mwwWalk.pos = [x, y];
    mwwWalk.moving = to.path.length > 0;
    mwwPlace(mwwHere.me);
    // Tới nơi: vào nhà làm việc của vai; không có việc gì (bỏ phiếu) hay đã về tới nhà mình thì hết chuyến
    if (!mwwWalk.moving) {
      mwwWalk.to = null;
      const fx = to.k !== null && mwwTrip?.k === to.k ? mwwTrip.fx : [];
      fx.forEach((f, n) => mwwPlay(f.k, f.kind, { mine: n === 0 }));
      if (!fx.length) mwwTrip = null;
      render();
    }
  } else if (to) {
    mwwWalk.to = null;
  } else if (mwwWalk.moving) {
    mwwWalk.moving = false;
    mwwPlace(mwwHere.me);
  }
  mwwSend(t);
}

// Chỗ đứng trước cửa nhà ghế k, trong vùng đi lại
function mwwDoorOf(k) {
  const [hx, hy] = mwwHomeOf(k);
  const w = mwwWalkArea();
  return [w.cx + (hx - w.cx) * 0.9, w.cy + (hy - w.cy) * 0.9 + 12];
}

// Gửi chỗ mình đứng (ban ngày, khi có đổi, nhắc lại mỗi 3 giây cho người mới vào)
function mwwSend(t) {
  if (t - mwwWalk.sent < 100 || mwwHere.o.night || !mwwWalk.pos || !mwwCanWalk() || mwwLiveWs?.readyState !== 1) return;
  const p = mwwToShared(mwwWalk.pos);
  const key = `${p.x.toFixed(1)},${p.z.toFixed(1)}`;
  if (key === mwwWalk.sentKey && t - mwwWalk.sent < 3000) return;
  mwwWalk.sent = t;
  mwwWalk.sentKey = key;
  mwwLiveWs.send(JSON.stringify({ type: 'pos', x: p.x, z: p.z, r: mwwWalk.face }));
}

// Mở kết nối khi vào phòng, đóng khi ra. Mất kết nối thì thử lại, lâu dần (tối đa 10 giây); máy chủ chạy trên máy
// (npm run dev) không có kết nối này nên mỗi người chỉ thấy mình đi
function mwwLiveSync() {
  const room = view === 'mp.room' && mp?.room ? mp.id : '';
  if (room === mwwLiveRoom) return;
  mwwLiveRoom = room;
  mwwLive.clear();
  clearTimeout(mwwLiveTimer);
  const old = mwwLiveWs;
  mwwLiveWs = null;
  old?.close();
  mwwLiveRetry = 0;
  if (room) mwwLiveConnect();
}
function mwwLiveConnect() {
  const room = mwwLiveRoom;
  if (!room) return;
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/boardgame/rooms/${room}/live?pid=${encodeURIComponent(myId)}`);
  mwwLiveWs = ws;
  ws.onopen = () => {
    mwwLiveRetry = 0;
    mwwWalk.sentKey = '';
  };
  ws.onmessage = (e) => {
    let m;
    try {
      m = JSON.parse(e.data);
    } catch {
      return;
    }
    if (m.type === 'leave') mwwLive.delete(m.id);
    (m.type === 'all' ? m.spots : m.type === 'pos' ? [m] : []).forEach((spot) => {
      if (spot.id !== myId) mwwLive.set(spot.id, { x: spot.x, z: spot.z, r: spot.r, t: Date.now() });
    });
    const id = m.type === 'all' ? null : m.id;
    mwwHere?.seats.forEach((s, k) => (id === null || s.uid === id) && s.uid !== myId && !mwwHere.o.night && mwwPlace(k));
  };
  ws.onclose = () => {
    if (mwwLiveWs !== ws) return;
    mwwLiveWs = null;
    if (mwwLiveRoom === room) mwwLiveTimer = setTimeout(mwwLiveConnect, Math.min(10000, 1000 * 2 ** mwwLiveRetry++));
  };
}

// Bước vừa đổi (chưa vẽ lần nào): bảng tên bước hiện ra từ từ, thẻ tin mở lại, các bảng nổi đóng lại
let mwwSeenStep = '';
const mwwStepKey = (g) => `${g.id}:${g.night}:${g.step}`;
const mwwFresh = (g) => mwwStepKey(g) !== mwwSeenStep;
AFTER_RENDER.push(() => {
  const g = mp?.room?.phase === 'play' ? mp.room.g : null;
  mwwSeenStep = g && view === 'mp.room' ? mwwStepKey(g) : '';
});

// Bảng nổi đang mở (people | log | role | reveal | settings), người đang được bấm xem, thẻ tin thu gọn hay không
let mwwPanel = null;
let mwwFocus = null;
let mwwEventMin = false;
// Cách bấm người của màn đang vẽ, để nút trên thẻ người làm đúng việc khi được bấm
let mwwTownNow = {};

function mwwMood(g) {
  if (g.step === 'night') return 'night';
  if (g.step === 'end') return `end-${g.winner === 'wolf' ? 'wolf' : 'village'}`;
  if (g.step === 'trial' || (g.step === 'reveal' && g.out !== null)) return 'trial';
  return 'day';
}

// Bảng tên bước: Ngày / Đêm thật to, việc đang diễn ra và đồng hồ đếm ngược
function mwwBanner(big, sub, ring, { night = false, fresh = false, icon = night ? '🌙' : '☀️' } = {}) {
  return `
    <div class="phase ${night ? 'night' : 'day'} ${fresh ? 'fresh' : ''}" role="status">
      <span class="phase-icon" aria-hidden="true">${icon}</span>
      <div class="grow"><div class="phase-big">${big}</div><div class="phase-sub">${sub}</div></div>
      ${ring}
    </div>`;
}

// Khung giao diện nổi trên cảnh làng: thanh trên (rời phòng, bước, nhạc), thẻ tin, bảng nổi đang mở, thẻ người đang xem,
// rồi dưới đáy là các nút mở bảng và thanh hành động
function mwwOverlay({ banner, event, eventTitle, panels, panel, focus = '', bar = '', cover = '', side = '' }) {
  const room = mp.room;
  const hostGone = mpJoined() && !mpMembers().some(([uid]) => uid === room.host);
  const quit = mpIsHost() && room.phase === 'play' && room.g?.step !== 'end';
  const open = panels.find(([k]) => k === mwwPanel);
  return `
    <header class="hud-top">
      <button class="hud-btn" data-act="mp.leave" aria-label="Rời phòng">✕</button>
      ${banner}
      <div class="hud-right">
        ${mwwMusicSwitch()}
        ${quit ? '<button class="hud-btn small" data-act="mp.quit" aria-label="Hủy ván" title="Hủy ván">⏹</button>' : ''}
      </div>
    </header>
    ${hostGone || mpMsg ? `
      <div class="hud-toast">
        ${hostGone ? '<button class="btn ghost" data-act="mp.takehost">Chủ phòng đã rời, nhận làm chủ phòng</button>' : ''}
        ${mpMsg ? `<p class="small">${esc(mpMsg)}</p>` : ''}
      </div>` : ''}
    <section class="hud-event ${mwwEventMin ? 'min' : ''}" aria-label="${eventTitle}">
      <button class="hud-event-head" data-act="mww.event" aria-expanded="${!mwwEventMin}"><b>${eventTitle}</b><span aria-hidden="true">${mwwEventMin ? '▾' : '▴'}</span></button>
      <div class="hud-event-body stack" data-scroll="event">${event}</div>
    </section>
    ${open ? `
      <aside class="hud-panel" aria-label="${open[2]}" data-scroll="panel-${open[0]}">
        <button class="hud-close" data-act="mww.panel" data-panel="${open[0]}" aria-label="Đóng">✕</button>
        ${open[3]()}
      </aside>` : ''}
    ${side}
    <footer class="hud-foot">
      ${focus}
      <nav class="hud-dock" aria-label="Các bảng">
        ${panels.map(([k, icon, label]) => `
          <button class="${mwwPanel === k ? 'on' : ''}" data-act="mww.panel" data-panel="${k}" aria-pressed="${mwwPanel === k}"><span aria-hidden="true">${icon}</span>${label}</button>`).join('')}
      </nav>
      ${bar ? `<div class="hud-bar">${bar}</div>` : ''}
    </footer>
    ${cover}`;
}

// Chat ban đêm của bầy Sói: mỗi Sói ghi tin của mình vào dữ liệu người chơi (chat, giữ 12 tin gần nhất của ván), máy
// của Sói gom tin của cả bầy trong đêm nay. Chỉ máy của Sói hiện khung này.
function mwwPackMsgs(g) {
  return mp.room.seats
    .flatMap((s, k) => (wwIsWolf(g, k) && !s.bot
      ? (mp.players[s.uid]?.chat || []).filter((m) => m.g === g.id && m.n === g.night).map((m) => ({ ...m, k }))
      : []))
    .sort((a, b) => a.at - b.at);
}

// Ban đêm trên máy của Sói: mỗi nhà bị bao nhiêu Sói chọn cắn
function mwwPackCounts(g, i, acts) {
  if (i < 0 || !mpShow || !wwIsWolf(g, i)) return null;
  const counts = {};
  acts.forEach((a, k) => {
    if (a && a.pick !== null && g.alive[k] && wwIsWolf(g, k)) counts[a.pick] = (counts[a.pick] || 0) + 1;
  });
  return counts;
}

const mwwPackOpen = (g, i) => g.step === 'night' && i >= 0 && g.alive[i] && mpShow && wwIsWolf(g, i);

function mwwPackLines(g, i) {
  const names = mpNames();
  const msgs = mwwPackMsgs(g);
  return msgs.length
    ? msgs.map((m) => `<p class="${m.k === i ? 'mine' : ''}"><b>${esc(names[m.k])}</b>${esc(String(m.t))}</p>`).join('')
    : '<p class="muted small center">Chưa ai nói gì. Bàn nhau xem đêm nay cắn ai.</p>';
}

function mwwPackChat(g, i) {
  return `
    <section class="board pack">
      <h3>🐺 Bầy sói <small>chỉ Sói thấy</small></h3>
      <div class="pack-msgs" data-scroll="pack">${mwwPackLines(g, i)}</div>
      <form class="pack-send" data-form="mww.pack">
        <input name="t" maxlength="120" placeholder="Nhắn cho bầy…" autocomplete="off" aria-label="Nhắn cho bầy sói">
        <button class="btn">Gửi</button>
      </form>
    </section>`;
}

forms['mww.pack'] = (form) => {
  const t = form.t.value.trim().slice(0, 120);
  if (!t) return;
  const g = mp.room.g;
  const me = mp.players[myId];
  mpWritePlayer({ ...me, chat: [...(me.chat || []).filter((m) => m.g === g.id).slice(-11), { g: g.id, n: g.night, at: Date.now(), t }] });
  setTimeout(() => document.querySelector('.pack-send input')?.focus());
};

// Có tin mới thì cuộn khung chat xuống cuối
let mwwPackSeen = 0;
function mwwPackScroll() {
  const el = document.querySelector('.pack-msgs');
  const n = el?.querySelectorAll('b').length || 0;
  if (el && n !== mwwPackSeen) el.scrollTop = el.scrollHeight;
  mwwPackSeen = n;
}
AFTER_RENDER.push(mwwPackScroll);

// Đang gõ trong chat của bầy: chỉ thay các tin nhắn, giữ nguyên ô đang gõ (vẽ lại cả trang thì mất chữ và điện thoại đóng
// bàn phím). Hết đêm hay không còn là Sói thì vẽ lại cả trang.
function mwwPackRefresh() {
  const g = mp?.room?.g;
  const el = document.querySelector('.pack-msgs');
  if (!g || !el || !mwwPackOpen(g, mpSeat())) {
    document.activeElement?.blur();
    return render();
  }
  const html = mwwPackLines(g, mpSeat());
  if (el.innerHTML !== html) el.innerHTML = html;
  mwwPackScroll();
}

// Đầu ván: vai của mình phủ kín màn hình, úp sẵn để người ngồi cạnh khỏi thấy; chạm để lật, bấm Đã nhớ thì đóng (ghi
// seen vào người chơi để quản trò biết mà bắt đầu đêm đầu tiên). Chưa bấm thì còn hiện tới hết ván.
let mwwFlipped = { id: null, at: 0 }; // ván đã lật vai trên máy này, lúc lật (vẽ lại không chạy lại hoạt ảnh lật)
function mwwRoleCover(g, i) {
  if (i < 0 || g.step === 'end' || mp.players[myId]?.seen === g.id) return '';
  if (mwwFlipped.id !== g.id) {
    return `
      <div class="role-cover" role="dialog" aria-label="Vai của bạn">
        <button class="rc-card rc-back" data-act="mww.flip">
          <span class="rc-mark" aria-hidden="true">🌙</span>
          <b>Vai của bạn</b>
          <span class="small">Che màn hình rồi chạm để lật</span>
        </button>
      </div>`;
  }
  const role = WW_ROLES[g.roles[i]];
  const wolf = wwIsWolf(g, i);
  const mates = wolf ? wwSeats(g).filter((k) => k !== i && wwIsWolf(g, k)).map((k) => esc(mpNames()[k])) : [];
  return `
    <div class="role-cover" role="dialog" aria-label="Vai của bạn">
      <div class="rc-card rc-face" style="animation-delay:-${Date.now() - mwwFlipped.at}ms">
        ${wwArt(g.roles[i])}
        <div class="rc-name rl-${role.tag}">${role.label}</div>
        <div class="rc-team">Phe ${wolf ? '<span class="rl-wolf">Ma Sói</span>' : '<span class="rl-villager">Dân làng</span>'}</div>
        <p>${role.desc}.</p>
        ${wolf ? `<p><b>Đồng bọn:</b> ${mates.join(', ') || 'chỉ mình bạn'}</p>` : ''}
        <p class="muted small"><b>Mục tiêu:</b> ${wolf ? 'Cắn dần dân làng cho tới khi số Sói bằng số dân.' : 'Tìm ra và treo cổ hết Ma Sói.'}</p>
        <button class="btn" data-act="mww.seen">✓ Đã nhớ vai</button>
      </div>
    </div>`;
}

// Màn của một bước trong ván: cảnh làng với người chơi, bảng tên bước, thẻ tin (body), thanh hành động (bar).
// town: cách bấm người (xem mwwCastOf); bấm một người thì hiện thẻ của người đó với việc làm được (bỏ phiếu, chọn, bắn).
function mwwFrame({ sub, ring = '', town = {}, body, bar = '', title = 'Tin của làng', cover = '' }) {
  const g = mp.room.g;
  const i = mpSeat();
  const fresh = mwwFresh(g);
  if (fresh) {
    mwwPanel = null;
    mwwFocus = null;
    mwwEventMin = false;
    mwwWalk.pos = null;
    mwwWalk.to = null;
    mwwTrip = null;
    mwwZoom(null);
    // Sáng ra: hồn ma bay lên ở nhà người chết đêm qua; bị treo cổ: hồn ma bay lên trên giàn
    if (g.step === 'day') g.deaths.forEach((k) => mwwPlay(k, 'death'));
    if (g.step === 'reveal' && g.out !== null) mwwPlay(g.out, 'hang', { gallows: true });
  }
  // Sói nhận ra đồng bọn cả ngày lẫn đêm (ban đêm thì khi đã mở máy, xem mwwNightView)
  if (!town.mates && i >= 0 && wwIsWolf(g, i)) town = { ...town, mates: wwSeats(g).filter((k) => wwIsWolf(g, k)) };
  mwwTownNow = town;
  mwwCast = { mood: mwwMood(g), ...mwwCastOf(mp.room.seats.map((s, k) => ({ ...s, alive: g.alive[k] })), { night: g.step === 'night', accused: g.step === 'trial' ? g.accused : null, ...town }) };
  const panels = [
    ['people', '👥', `Dân làng ${wwAlive(g).length}/${g.roles.length}`, () => `${mwwPeople(g, town)}${mwwRoleList(g)}`],
    ['log', '📜', 'Nhật ký', () => mwwLog(g)],
    ['role', '🎭', 'Vai', () => (i >= 0 ? mwwMyRole(g, i) : '<section class="board"><h3>Vai của bạn</h3><p class="muted small center">Bạn đang xem ván này, sẽ được chia vai ở ván sau.</p></section>')],
    ...(g.step === 'end' ? [['reveal', '⚜️', 'Lật vai', () => mwwReveal(g)]] : []),
  ];
  // Ban đêm Sói còn sống (đã mở máy) có thêm khung chat riêng của bầy: màn hình rộng thì luôn mở ở góc dưới bên trái,
  // điện thoại thì là một bảng trên thanh dưới
  const pack = mwwPackOpen(g, i);
  const side = pack && matchMedia('(min-width: 1280px)').matches;
  if (pack && !side) {
    const n = mwwPackMsgs(g).length;
    panels.unshift(['pack', '🐺', `Bầy sói${n ? ` ${n}` : ''}`, () => mwwPackChat(g, i)]);
  }
  return mwwOverlay({
    cover: mwwRoleCover(g, i) || cover,
    side: side ? `<aside class="pack-side" aria-label="Chat của bầy sói">${mwwPackChat(g, i)}</aside>` : '',
    banner: mwwBanner(g.step === 'end' ? 'Hết ván' : `${g.step === 'night' ? 'Đêm' : 'Ngày'} ${g.night}`, sub, ring, { night: g.step === 'night', fresh, icon: g.step === 'end' ? '⚜️' : undefined }),
    event: body,
    eventTitle: title,
    panels,
    focus: mwwFocusCard(g, town),
    bar,
  });
}

// Thẻ của người đang được bấm: tên, số ghế, còn sống hay đã chết (vai khi được lật), số phiếu; nút làm việc của bước này
// với người đó (thẻ này là bước xác nhận trước khi làm)
function mwwFocusCard(g, o) {
  const k = mwwFocus;
  if (k === null || !mp.room.seats[k]) return '';
  const s = mp.room.seats[k];
  const name = esc(s.name);
  const role = WW_ROLES[g.roles[k]];
  const status = !g.alive[k]
    ? `✝ Đã chết${g.shown[k] ? ` · <span class="rl-${role.tag}">${role.label}</span>` : ''}`
    : g.step === 'trial' && k === g.accused ? '<span class="rl-wolf">Đang trên giàn treo cổ</span>' : 'Còn sống';
  let doIt = '';
  if (o.act && o.can?.(k)) {
    const mine = mpSeat();
    const verb = o.act === 'mww.vote'
      ? mwwVotes()[mine] === k ? '' : `🗳️ Treo cổ ${name}`
      : `${o.verb || ''} ${name}`;
    doIt = verb
      ? `<button class="btn ${o.act === 'mww.vote' || ['🐺 Cắn', '🌑 Nguyền', '🏹 Bắn', '☠️ Đầu độc'].includes(o.verb) ? 'blood' : ''}" data-act="mww.do" data-i="${k}">${verb}</button>`
      : '<button class="btn" disabled>✓ Bạn đã bầu người này</button>';
  }
  return `
    <div class="hud-focus" role="dialog" aria-label="${name}">
      <div class="row">
        ${g.alive[k] ? avatar(s.name, '', mwwColor(s)) : '<span class="avatar grave" aria-hidden="true">✝</span>'}
        <div class="grow">
          <b class="f-name">${name}${s.uid === myId ? ' <em>(bạn)</em>' : ''}</b>
          <div class="small muted">#${k + 1}${s.bot ? ' · Bot' : ''}${s.uid === mp.room.host ? ' · 👑 Chủ phòng' : ''}</div>
          <div class="small">${status}${o.counts?.[k] ? ` · ${o.counts[k]} phiếu` : ''}</div>
        </div>
        <button class="hud-close" data-act="mww.focus" data-i="-1" aria-label="Đóng">✕</button>
      </div>
      ${doIt}
    </div>`;
}

// Danh sách người chơi: số ghế, tên, còn sống hay đã chết (vai khi được lật), ai đã bỏ phiếu hay phán xử, số phiếu đang
// nhận. Bấm một người thì mở thẻ người đó như khi bấm trong làng.
function mwwPeople(g, o) {
  const names = mpNames();
  const votes = g.step === 'vote' ? mwwVotes() : null;
  const verdicts = g.step === 'trial' ? mwwVerdicts() : null;
  const status = (k) => {
    if (!g.alive[k]) return g.shown[k] ? `<span class="rl-${WW_ROLES[g.roles[k]].tag}">${WW_ROLES[g.roles[k]].label}</span>` : 'Đã chết';
    if (verdicts && k === g.accused) return '<span class="rl-wolf">Trên giàn treo cổ</span>';
    if (votes) return votes[k] === undefined ? 'Chưa bỏ phiếu' : '<span class="rl-villager">✓ Đã bỏ phiếu</span>';
    if (verdicts) return verdicts[k] === undefined ? 'Chưa phán xử' : '<span class="rl-villager">✓ Đã phán xử</span>';
    return 'Còn sống';
  };
  const rows = mp.room.seats.map((s, k) => {
    const cls = ['prow', !g.alive[k] && 'dead', o.act && o.can?.(k) && 'can', o.sel === k && 'sel', o.mates?.includes(k) && 'ally'].filter(Boolean).join(' ');
    return `
      <button class="${cls}" data-act="mww.focus" data-i="${k}">
        <span class="pnum">${k + 1}</span>
        ${g.alive[k] ? avatar(names[k], 'sm', mwwColor(s)) : '<span class="avatar sm grave" aria-hidden="true">✝</span>'}
        <span class="pinfo"><b>${esc(names[k])}${s.uid === myId ? ' <em>(bạn)</em>' : ''}${s.uid === mp.room.host ? ' 👑' : ''}</b><small>${status(k)}</small></span>
        ${o.counts?.[k] ? `<span class="pcount" aria-label="${o.counts[k]} phiếu">${o.counts[k]}</span>` : ''}
      </button>`;
  }).join('');
  return `
    <section class="board">
      <h3>Dân làng <small>${wwAlive(g).length}/${g.roles.length} còn sống</small></h3>
      <div class="plist">${rows}</div>
    </section>`;
}

// Các vai được chia đầu ván (người bị nguyền tính theo vai cũ), mỗi vai một dòng, màu theo phe
function mwwRoleList(g) {
  const count = {};
  g.roles.forEach((r, i) => {
    const role = g.turned?.[i] || r;
    count[role] = (count[role] || 0) + 1;
  });
  return `
    <section class="board">
      <h3>Danh sách vai</h3>
      <ul>${Object.keys(WW_ROLES).filter((r) => count[r]).map((r) =>
        `<li class="rl-${WW_ROLES[r].tag}">${WW_ROLES[r].emoji} ${WW_ROLES[r].label}${count[r] > 1 ? ` × ${count[r]}` : ''}</li>`).join('')}</ul>
    </section>`;
}

// Phép còn lại của vai mình
function mwwUses(g, i) {
  const left = (used) => (used ? '<span class="muted">đã dùng</span>' : '<b>còn 1 lần</b>');
  const role = g.roles[i];
  if (role === 'witch') return `<li>💚 Thuốc cứu: ${left(g.healUsed)}</li><li>☠️ Thuốc độc: ${left(g.poisonUsed)}</li>`;
  if (role === 'cursewolf') return `<li>🌑 Lời nguyền: ${left(g.curseUsed)}</li>`;
  if (role === 'guard' && g.lastGuard !== null) return `<li>🛡️ Đêm trước đã bảo vệ <b>${esc(mpNames()[g.lastGuard])}</b>, đêm nay không chọn lại được</li>`;
  return '';
}

// Thẻ nhân vật của mình: ẩn sẵn, bấm mới hiện để người ngồi cạnh khỏi nhìn thấy
let mwwPeek = false;
function mwwMyRole(g, i) {
  if (!mwwPeek) {
    return `
      <section class="board">
        <h3>Vai của bạn</h3>
        <p class="muted small center">Vai được giấu để người ngồi cạnh không nhìn thấy.</p>
        <button class="btn ghost" data-act="mww.peek">👁 Xem vai (che màn hình)</button>
      </section>`;
  }
  const role = WW_ROLES[g.roles[i]];
  const wolf = wwIsWolf(g, i);
  const mates = wolf ? wwSeats(g).filter((k) => k !== i && wwIsWolf(g, k)).map((k) => esc(mpNames()[k])) : [];
  const uses = mwwUses(g, i);
  return `
    <section class="board rolecard stack">
      <h3>Vai của bạn</h3>
      <div class="rc-top">
        ${wwArt(g.roles[i], 'small')}
        <div class="grow">
          <div class="rc-name rl-${role.tag}">${role.label}</div>
          <div class="small">#${i + 1} · ${esc(mpNames()[i])}</div>
          <div class="small">${g.alive[i] ? 'Còn sống' : '✝ Đã chết'} · Phe ${wolf ? '<span class="rl-wolf">Ma Sói</span>' : '<span class="rl-villager">Dân làng</span>'}</div>
        </div>
      </div>
      <p class="small">${role.desc}.</p>
      ${uses ? `<ul class="rc-uses small">${uses}</ul>` : ''}
      ${g.turned?.[i] ? `<p class="small">Bạn từng là ${WW_ROLES[g.turned[i]].label}, đã bị nguyền hóa Sói.</p>` : ''}
      ${wolf ? `<p class="small"><b>Đồng bọn:</b> ${mates.join(', ') || 'không còn ai'}</p>` : ''}
      <p class="small"><b>Mục tiêu:</b> ${wolf ? 'Cắn dần dân làng cho tới khi số Sói bằng số dân.' : 'Tìm ra và treo cổ hết Ma Sói.'}</p>
      <button class="link small" data-act="mww.peek">Ẩn vai</button>
    </section>`;
}

// Ghi vào nhật ký những gì cả làng vừa được biết (máy chủ phòng ghi khi ván đi tiếp)
const mwwRecord = (g, entry) => (g.log ||= []).push({ night: g.night, ...entry });

// Nhật ký ván: đêm và ngày mới nhất ở trên. Chỉ ghi những gì quản trò đã công bố.
function mwwLog(g) {
  const names = mpNames();
  const who = (i) => `<b>${esc(names[i])}</b>${g.shown[i] ? ` <span class="rl-${WW_ROLES[g.roles[i]].tag}">(${WW_ROLES[g.roles[i]].label})</span>` : ''}`;
  const line = (e) => {
    if (e.kind === 'night') return `<li class="log-head night">🌙 Đêm ${e.night}</li>`;
    if (e.kind === 'day') {
      return `<li class="log-head">☀️ Ngày ${e.night}</li>${e.deaths.length
        ? e.deaths.map((i) => `<li>💀 ${who(i)} chết trong đêm.</li>`).join('')
        : '<li>🌤️ Đêm bình yên, không ai chết.</li>'}`;
    }
    if (e.kind === 'accused') return `<li>⚖️ ${who(e.who)} bị đưa lên giàn với ${e.votes} phiếu.</li>`;
    if (e.kind === 'nohang') return '<li>🤝 Phiếu hòa hoặc bỏ qua, không ai lên giàn.</li>';
    if (e.kind === 'hanged') return `<li>🪢 ${who(e.who)} bị treo cổ (Treo ${e.kill} · Tha ${e.save}).</li>`;
    if (e.kind === 'spared') return `<li>🙏 ${who(e.who)} được tha (Treo ${e.kill} · Tha ${e.save}).</li>`;
    if (e.kind === 'end') return `<li class="log-head">⚜️ ${e.winner === 'wolf' ? 'Ma Sói' : 'Dân làng'} thắng</li>`;
    return '';
  };
  // Mỗi đêm, mỗi ngày là một nhóm; nhóm mới nhất lên trên, trong nhóm giữ thứ tự xảy ra
  const groups = [];
  (g.log || []).forEach((e) => {
    if (['night', 'day', 'end'].includes(e.kind) || !groups.length) groups.push([]);
    groups.at(-1).push(line(e));
  });
  return `
    <section class="board">
      <h3>Nhật ký</h3>
      ${groups.length
        ? `<ul class="log">${groups.reverse().map((lines) => lines.join('')).join('')}</ul>`
        : '<p class="muted small center">Ván này bắt đầu trước khi có nhật ký.</p>'}
    </section>`;
}

const mwwSay = (text) => `<div class="decree">${text}</div>`;

// Timeline ngang của đêm: lời dẫn, từng vai theo thứ tự gọi (vòng tròn là ảnh của vai), trời sáng
function mwwTimeline(g) {
  const steps = [
    ['🌙', 'Màn đêm'],
    ...g.calls.map((role) => [`<img src="${WW_ROLES[role].img}" alt="">`, WW_ROLES[role].label]),
    ['☀️', 'Trời sáng'],
  ];
  const at = g.turn + 1;
  return `
    <ol class="timeline ${steps.length > 5 ? 'crowded' : ''}" aria-label="Thứ tự gọi vai đêm nay">
      ${steps.map(([icon, label], k) => `
        <li class="${k < at ? 'done' : k === at ? 'now' : ''}" ${k === at ? 'aria-current="step"' : ''} title="${label}">
          <span class="dot">${k < at ? '✓' : icon}</span><span class="tl-label">${label}</span>
        </li>`).join('')}
    </ol>`;
}

views['mp.home'] = () => {
  const bar = `
    <div class="topbar">
      <button class="back" data-act="go" data-view="home">←</button>
      <h2>🐺 Ma Sói</h2>
      <button class="link small" data-act="rules" data-game="ww">Luật chơi</button>
      ${mwwMusicSwitch()}
    </div>`;
  if (!onlineDone) return `${bar}<div class="card"><p class="muted">Đang kết nối…</p></div>`;
  if (!online) {
    return `${bar}
      <div class="card"><p>Không kết nối được máy chủ DMI Workspace. Kiểm tra mạng rồi mở lại trang.</p></div>`;
  }
  return `${bar}
    <div class="ww-title"><h1>Ma Sói</h1><p>Mỗi người một điện thoại. Máy chủ phòng làm quản trò, gọi từng vai thức dậy; thiếu người thì thêm bot.</p></div>
    <div class="card stack">${mpNamePicker()}</div>
    ${mpMsg ? `<p class="small" style="color:var(--spy)">${esc(mpMsg)}</p>` : ''}
    ${wsUser ? mwwRoomList() : ''}`;
};

function mwwRoomList() {
  return `
    <h3>Phòng đang mở</h3>
    <div class="list">
      ${openRooms.length ? openRooms.map((r) => `
        <button class="lrow" data-act="mp.enter" data-id="${esc(r.id)}">
          <span class="rank">🐺</span>
          <span class="lname"><b>Phòng ${esc(r.id)}</b><span class="muted small">Chủ phòng ${esc(r.hostName || '')} · ${r.phase === 'play' ? 'Đang chơi' : 'Đang chờ'}</span></span>
          <span class="pts">Vào ›</span>
        </button>`).join('')
      : '<div class="card"><p class="muted">Chưa có phòng nào đang mở.</p></div>'}
    </div>
    <button class="btn" data-act="mp.create">＋ Tạo phòng mới</button>`;
}

// Phòng chờ: cả làng tụ họp ở quảng trường. Thẻ tin là mã phòng và lời mời; bảng Dân làng (sẵn sàng chưa, chủ phòng,
// bot) và Thiết lập (chủ phòng chỉnh vai, giờ thảo luận); dưới đáy là nút Sẵn sàng.
function mpLobby() {
  const members = mpMembers();
  const bots = mpBots();
  const need = wwNeed();
  const missing = need - mpCount();
  const round = mpRound();
  const host = mpIsHost();
  const seats = [...members.map(([uid, p]) => ({ uid, name: p.name, alive: true })), ...bots.map((b) => ({ uid: b.id, name: b.name, alive: true, bot: true }))];
  mwwTownNow = {};
  mwwCast = { mood: 'lobby', ...mwwCastOf(seats, { host: mp.room.host }) };
  const row = (k, name, note, extra = '', color) => `
    <div class="prow">
      <span class="pnum">${k + 1}</span>${avatar(name, 'sm', color)}
      <span class="pinfo"><b>${esc(name)}${extra}</b><small>${note}</small></span>
    </div>`;
  const people = () => `
    <section class="board">
      <h3>Dân làng <small>${mpCount()} người · cần ít nhất ${need}</small></h3>
      <div class="plist">
        ${members.map(([uid, p], k) => row(k, p.name, p.ready === round ? '<span class="rl-villager">✓ Sẵn sàng</span>' : 'Đang chờ',
          `${uid === myId ? ' <em>(bạn)</em>' : ''}${uid === mp.room.host ? ' 👑' : ''}`, mwwColor({ uid, name: p.name }))).join('')}
        ${bots.map((b, k) => row(members.length + k, b.name, 'Bot', '', mwwColor({ uid: b.id, name: b.name }))).join('')}
      </div>
      ${host && missing > 0 ? `<button class="btn ghost" data-act="mp.fillbots">🤖 Thêm ${missing} bot cho đủ ${need} người</button>` : ''}
    </section>`;
  const settings = () => (host ? `<div class="stack">${wwCfgCards()}</div>` : `
    <section class="board">
      <h3>Thiết lập</h3>
      <p class="muted small center">Chủ phòng ${esc(mp.room.hostName || '')} đang chọn vai và giờ thảo luận. Vai được chia khi ván bắt đầu.</p>
    </section>`);
  return mwwOverlay({
    banner: mwwBanner('Ma Sói', `Phòng chờ · ${mpCount()} người`, '', { icon: '🐺' }),
    eventTitle: `Phòng ${esc(mp.id)}`,
    event: `
      ${mpJoined() ? mpColorPicker() : `<div class="stack">${mpNamePicker()}${wsUser ? '<button class="btn" data-act="mp.join">Vào phòng</button>' : ''}</div>`}
      <div class="row lobby-code">
        <div class="grow"><span class="muted small">Mã phòng</span><div class="code">${esc(mp.id)}</div></div>
        <button class="btn ghost" data-act="mp.invite">✉️ Mời bạn</button>
      </div>
      <p class="muted small">Cả làng tụ họp ở quảng trường trước khi màn đêm buông xuống. Mọi người mở DMI Boardgame → 🐺 Ma Sói → bấm vào phòng này.</p>
      ${host && missing > 0 ? `<button class="btn ghost" data-act="mp.fillbots">🤖 Thêm ${missing} bot cho đủ ${need} người</button>` : ''}`,
    panels: [
      ['people', '👥', `Dân làng ${mpCount()}`, people],
      ['settings', '⚙️', 'Thiết lập', settings],
    ],
    focus: mpLobbyFocus(seats),
    bar: mpReadyBar('bắt đầu'),
  });
}

// Thẻ người đang xem ở phòng chờ: tên, số, chủ phòng hay bot, đã sẵn sàng chưa
function mpLobbyFocus(seats) {
  const s = seats[mwwFocus];
  if (!s) return '';
  const ready = s.bot ? 'Bot' : mp.players[s.uid]?.ready === mpRound() ? '<span class="rl-villager">✓ Sẵn sàng</span>' : 'Đang chờ';
  return `
    <div class="hud-focus" role="dialog" aria-label="${esc(s.name)}">
      <div class="row">
        ${avatar(s.name, '', mwwColor(s))}
        <div class="grow">
          <b class="f-name">${esc(s.name)}${s.uid === myId ? ' <em>(bạn)</em>' : ''}</b>
          <div class="small muted">#${mwwFocus + 1}${s.uid === mp.room.host ? ' · 👑 Chủ phòng' : ''}</div>
          <div class="small">${ready}</div>
        </div>
        <button class="hud-close" data-act="mww.focus" data-i="-1" aria-label="Đóng">✕</button>
      </div>
    </div>`;
}

// Thanh Sẵn sàng (phòng chờ và hết ván): đếm người đã bấm, vòng đếm ngược khi quá nửa đã sẵn sàng
function mpReadyBar(what) {
  const all = mpMembers().length;
  const ready = mpReadyCount();
  const mine = mp.players[myId]?.ready === mpRound();
  const at = mp.room.startAt;
  return `
    ${at ? mwwRing(at, WW_TIMES.ready) : ''}
    <span class="bar-note"><b>${ready}/${all} sẵn sàng</b><br>${at ? 'Hết giờ thì bắt đầu với những người đang trong phòng.' : 'Ai cũng sẵn sàng thì bắt đầu ngay; quá nửa thì 20 giây sau.'}</span>
    ${mpJoined() ? `<button class="btn ${mine ? 'ghost' : ''}" data-act="mp.ready">${mine ? '✓ Đã sẵn sàng' : `✋ Sẵn sàng ${what}`}</button>` : ''}`;
}

// Lượt đêm của mình: biết thêm gì (đồng bọn, ai bị cắn, thuốc còn lại) và phải chọn gì; chọn bằng cách bấm người trong làng
function mwwActInfo(g, i, acts, names) {
  const role = g.roles[i];
  const targets = wwTargets(g, i);
  let prompt = '';
  let extra = '';
  if (wwIsWolf(g, i)) {
    const mates = wwAlive(g).filter((k) => k !== i && wwIsWolf(g, k));
    const picked = mates.filter((k) => acts[k]).map((k) => `${esc(names[k])} → ${esc(names[acts[k].pick])}`);
    prompt = 'Chọn người để cắn đêm nay.';
    extra = `
      <p>Đồng bọn: <b>${mates.length ? mates.map((k) => esc(names[k])).join(', ') : 'không còn ai'}</b></p>
      ${picked.length ? `<p>Đồng bọn đã chọn: <b>${picked.join(', ')}</b>. Nếu hòa phiếu, Sói chọn sau cùng quyết định.</p>` : ''}`;
  } else if (role === 'seer') {
    prompt = 'Chọn một người để soi.';
  } else if (role === 'hunter') {
    prompt = 'Chọn một người để bắn: sáng ra người đó chết. Không chắc ai là Sói thì có thể không bắn.';
  } else if (role === 'guard') {
    prompt = 'Chọn một người để bảo vệ (có thể là chính bạn).';
    if (g.lastGuard !== null && g.alive[g.lastGuard]) {
      extra = `<p>Đêm trước bạn đã bảo vệ <b>${esc(names[g.lastGuard])}</b> nên đêm nay không chọn lại được.</p>`;
    }
  } else if (role === 'witch') {
    const victim = mwwVictim(g, acts);
    prompt = g.poisonUsed ? 'Bạn đã hết thuốc độc.' : 'Muốn đầu độc ai thì bấm vào người đó (không bắt buộc).';
    extra = g.healUsed
      ? '<p>Bạn đã hết thuốc cứu.</p>'
      : victim === null
        ? '<p>Đêm nay không ai bị Sói cắn.</p>'
        : `<p>Đêm nay Sói cắn <b>${esc(names[victim])}</b>.${mpHeal ? ' Bạn đã chọn cứu.' : ''}</p>`;
  }
  return { prompt, extra, targets };
}

function mwwActBody(g, i, acts, names) {
  const info = WW_ROLES[g.roles[i]];
  const { prompt, extra, targets } = mwwActInfo(g, i, acts, names);
  return `
    <div class="calling ${info.tag}">${wwArt(g.roles[i], 'small')}<b class="grow">Bạn là ${info.label}</b></div>
    <div class="info stack">${extra}<p><b>${prompt}</b></p>
      <p class="muted small">Chọn chức năng, rồi bấm vào nhà người đó (nhà sáng lên là chọn được) và bấm nút trên thẻ của họ.</p></div>`;
}

// Đến lượt vai mình trong đêm: lớp phủ để chọn chức năng của vai (Cắn, Nguyền, Soi, Bảo vệ, Bắn, Cứu, Đầu độc…). Chọn xong
// thì về làng, bấm vào nhà người muốn làm rồi bấm nút trên thẻ của họ; nhân vật đi tới nhà đó như mọi khi. Nút "Chức
// năng" trên thanh dưới mở lại lớp phủ.
let mwwTurnShut = '';
const mwwTurnKey = () => `${mp.room.g.id}:${mp.room.g.night}:${mp.room.g.turn}`;
const mwwTurnAt = {};
let mwwMode = { key: '', fn: null };
const mwwFn = () => (mwwMode.key === mwwTurnKey() ? mwwMode.fn : null);
// Chức năng: [mã, nhãn nút, động từ trên thẻ người]; mã null là làm ngay không cần chọn nhà
const MWW_FNS = {
  bite: ['Cắn', '🐺 Cắn'],
  curse: ['Nguyền (1 lần/ván)', '🌑 Nguyền'],
  see: ['Soi', '🔮 Soi'],
  guard: ['Bảo vệ', '🛡️ Bảo vệ'],
  shoot: ['Bắn', '🏹 Bắn'],
  heal: ['Cứu', '💚 Cứu'],
  poison: ['Đầu độc', '☠️ Đầu độc'],
};
function mwwFnsOf(g, i, acts) {
  const role = g.roles[i];
  if (wwIsWolf(g, i)) return role === 'cursewolf' && !g.curseUsed ? ['bite', 'curse'] : ['bite'];
  if (role === 'seer') return ['see'];
  if (role === 'guard') return ['guard'];
  if (role === 'hunter') return ['shoot'];
  if (role === 'witch') {
    const victim = mwwVictim(g, acts);
    return [!g.healUsed && victim !== null && !mpHeal && 'heal', !g.poisonUsed && 'poison'].filter(Boolean);
  }
  return [];
}

function mwwTurnCover(g, i, acts, names) {
  const key = mwwTurnKey();
  if (mwwTurnShut === key) return '';
  const at = (mwwTurnAt[key] ||= Date.now());
  const role = g.roles[i];
  const info = WW_ROLES[role];
  const { extra } = mwwActInfo(g, i, acts, names);
  const fns = mwwFnsOf(g, i, acts);
  // Mỗi chức năng một nút riêng; nút cuối là không làm gì (Phù thủy đã cứu thì là Xong): máy ghi nhận, vài giây sau đi tiếp
  const tile = (act, fn, icon, label, cls = '') => `
    <button class="tc-fn ${cls}" data-act="${act}" ${fn ? `data-fn="${fn}"` : ''} style="animation-delay:-${Date.now() - at}ms">
      <span class="tc-icon">${icon}</span><b>${label}</b>
    </button>`;
  return `
    <div class="role-cover turn-cover" role="dialog" aria-label="Lượt của ${info.label}">
      <div class="tc-head">
        ${wwArt(role, 'small')}
        <div><div class="rc-name rl-${info.tag}">${info.label}</div><span>Đến lượt bạn · đêm ${g.night}</span></div>
      </div>
      ${extra ? `<div class="tc-info">${extra}</div>` : ''}
      <div class="tc-fns">
        ${fns.map((fn) => tile('mww.fn', fn, MWW_FX[MWW_FN_FX[fn]], MWW_FNS[fn][0], ['bite', 'curse', 'shoot', 'poison'].includes(fn) ? 'hot' : '')).join('')}
        ${tile('mww.pass', '', mpHeal ? '✓' : '🌙', mpHeal ? 'Xong, chỉ cứu' : 'Không làm gì', 'idle')}
      </div>
    </div>`;
}
// Hình trên nút chức năng: dùng lại hình của hoạt ảnh
const MWW_FN_FX = { bite: 'wolf', curse: 'curse', see: 'seer', guard: 'guard', shoot: 'hunter', heal: 'heal', poison: 'poison' };

// Kết quả hành động đêm của chính mình
function mwwResult(g, i, acts, names) {
  const act = acts[i];
  const role = g.roles[i];
  const name = act.pick === null ? '' : `<b>${esc(names[act.pick])}</b>`;
  if (wwIsWolf(g, i)) {
    const victim = mwwVictim(g, acts);
    const curse = act.curse ? ' Bạn đã chọn nguyền: nếu không ai cứu, người đó sẽ hóa Sói.' : '';
    return victim === null ? 'Đã ghi nhận.' : `Bầy sói đang nhắm vào <b>${esc(names[victim])}</b>.${curse}`;
  }
  if (act.pick === null && !act.heal && ['seer', 'guard'].includes(role)) return 'Đêm nay bạn không làm gì.';
  if (role === 'seer') return wwIsWolf(g, act.pick) ? `${name} LÀ MA SÓI 🐺` : `${name} không phải Sói ✅`;
  if (role === 'guard') return `Đêm nay bạn bảo vệ ${name}.`;
  if (role === 'hunter') return act.pick === null ? 'Đêm nay bạn không bắn ai.' : `Bạn đã bắn ${name}. Sáng ra người đó sẽ chết.`;
  const done = [act.heal && 'đã dùng thuốc cứu', act.pick !== null && `đã đầu độc ${name}`].filter(Boolean);
  return done.length ? `Bạn ${done.join(' và ')}.` : 'Đêm nay bạn không dùng thuốc.';
}

function mwwNightView() {
  const g = mp.room.g;
  const names = mpNames();
  const i = mpSeat();
  const acts = mwwActs();
  const role = g.roles[i];
  const calling = g.calls[g.turn];
  const sub = calling ? `${WW_ROLES[calling].label} thức dậy` : g.turn >= 0 ? 'Trời sắp sáng' : g.night === 1 && !mwwAllSeen(g) ? 'Mọi người đang xem vai' : 'Màn đêm buông xuống';
  const ring = calling && g.deadline ? mwwRing(g.deadline, WW_TIMES.turn) : '';
  // Đến lượt mình: bấm người muốn chọn; Sói đã mở máy thì thấy tên đồng bọn màu đỏ
  const acting = g.alive[i] && mpShow && !acts[i] && wwWakes(role) === calling;
  // Nhà chọn được theo chức năng đang chọn (Cứu thì chỉ nhà người bị cắn); chưa chọn chức năng thì chưa chọn được nhà
  const fn = acting ? mwwFn() : null;
  const targets = !fn ? [] : fn === 'heal' ? [mwwVictim(g, acts)] : wwTargets(g, i);
  const mates = mpShow && wwIsWolf(g, i) ? wwSeats(g).filter((k) => wwIsWolf(g, k)) : [];
  // Đến lượt vai mình (đã mở máy): mình ra khỏi nhà đi lại; Sói thì cả bầy còn sống cùng ra
  const awake = g.alive[i] && mpShow && wwWakes(role) === calling;
  // Đã chốt chọn mà chưa đi xong chuyến (lượt đã qua) thì mình vẫn đi nốt
  const walkers = awake ? (calling === 'wolf' ? wwAlive(g).filter((k) => wwIsWolf(g, k)) : [i]) : g.alive[i] && mwwTrip ? [i] : [];
  const hide = '<button class="btn ghost" data-act="mww.show">🙈 Ẩn đi</button>';
  let body;
  let bar = hide;
  let cover = '';
  if (!g.alive[i]) {
    bar = '';
    body = '<div class="secret night"><div class="emoji">👻</div><div class="who">Bạn đã bị loại</div><p class="muted">Giữ im lặng và chờ trời sáng nhé.</p></div>';
  } else if (!mpShow) {
    bar = '<button class="btn" data-act="mww.show">👁 Mở máy</button>';
    body = `
      <div class="secret night">
        <div class="emoji">🌙</div>
        <div class="who">Nhắm mắt lại</div>
        <p class="muted">Khi quản trò gọi vai của bạn, che màn hình rồi bấm mở máy.</p>
      </div>`;
  } else if (acts[i]) {
    body = `<div class="secret night">${wwArt(role, 'small')}<div class="result">${mwwResult(g, i, acts, names)}</div></div>`;
  } else if (acting) {
    body = mwwActBody(g, i, acts, names);
    bar = `${hide}<button class="btn" data-act="mww.fns">↩ Chức năng</button>${fn ? `<span class="bar-note">Bấm vào nhà để <b>${MWW_FNS[fn][1]}</b>.</span>` : ''}`;
    cover = mwwTurnCover(g, i, acts, names);
  } else {
    const k = g.calls.indexOf(wwWakes(role));
    const when = k < 0 ? 'Vai của bạn không thức dậy ban đêm.' : k < g.turn ? 'Lượt của bạn đêm nay đã qua.' : 'Chưa đến lượt của bạn.';
    body = `<div class="secret night">${wwArt(role, 'small')}<div class="who">Bạn là ${WW_ROLES[role].label}</div><p class="muted">${when} Nhắm mắt nhé.</p></div>`;
  }
  return mwwFrame({
    sub,
    ring,
    title: 'Ban đêm',
    town: { act: 'mww.pick', can: (k) => targets.includes(k), sel: acting ? mpPick : null, mates, walkers, counts: mwwPackCounts(g, i, acts), verb: fn && MWW_FNS[fn][1] },
    body: `
      ${mwwTimeline(g)}
      ${body}
      ${mpIsHost() && g.turn < g.calls.length ? '<button class="link small" data-act="mww.skip">Quản trò: bỏ qua lượt này</button>' : ''}`,
    bar,
    cover,
  });
}

const mwwTag = (g, i) => (g.shown[i] ? wwTag(g.roles[i]) : '');

// Chủ phòng đi ngay sang bước sau thay vì chờ hết giờ
const mwwGoNow = (label) => (mpIsHost() ? `<button class="btn" data-act="mww.after">${label} ›</button>` : '');

// Ban ngày: báo ai đã chết, rồi thảo luận theo giờ đã đặt; hết giờ tự sang bỏ phiếu
function mwwDayView() {
  const g = mp.room.g;
  const names = mpNames();
  const i = mpSeat();
  const blocked = Boolean(wwCheckWin(g));
  const next = mwwAfterLabel(g, '');
  const people = mp.room.seats.map((s, k) => [s, k]).filter(([s, k]) => !s.bot && g.alive[k]);
  const done = people.filter(([s]) => mp.players[s.uid]?.done === mwwDoneKey(g)).length;
  const mine = mp.players[myId]?.done === mwwDoneKey(g);
  let bar = '';
  if (blocked) bar = mwwGoNow(next);
  else if (g.talking && i >= 0 && g.alive[i]) {
    bar = `<span class="bar-note">${done}/${people.length} người muốn bỏ phiếu luôn</span>
      <button class="btn ${mine ? 'ghost' : ''}" data-act="mww.done">${mine ? '✓ Đã xong (bấm để hủy)' : '🗳️ Xong thảo luận'}</button>`;
  }
  return mwwFrame({
    sub: blocked ? next : g.talking ? 'Thảo luận: ai là Sói?' : 'Tin buổi sáng',
    ring: g.deadline ? mwwRing(g.deadline, g.talking ? g.talk : WW_TIMES.next) : '',
    title: 'Cáo thị buổi sáng',
    body: `
      ${mwwSay(`
        ${g.deaths.length
          ? g.deaths.map((k) => `<p>💀 Đêm qua <b>${esc(names[k])}</b> đã chết. ${mwwTag(g, k)}</p>`).join('')
          : '<p>🌤️ Đêm qua bình yên, không ai chết.</p>'}
        ${g.talking ? `<p class="small">Còn ${wwAlive(g).length} người sống. Bàn bạc xem ai là Sói; hết giờ, cả làng bỏ phiếu treo cổ trên máy của mình. Ai cũng bấm Xong thì bỏ phiếu ngay.</p>` : ''}`)}
      ${g.turned?.[i] ? '<div class="info">🌑 Bạn đã bị nguyền: giờ bạn là <b>Ma Sói</b>, thắng cùng bầy Sói và thức dậy cùng bầy mỗi đêm. Giữ bí mật nhé!</div>' : ''}
      ${mpIsHost() && !blocked ? '<button class="link small" data-act="mww.votenow">Chủ phòng: bỏ phiếu ngay</button>' : ''}`,
    bar,
  });
}

// Bỏ phiếu: ai còn sống cũng bấm chọn trên máy mình (đổi được tới khi hết 30 giây), số phiếu hiện ngay cho mọi người
function mwwVoteView() {
  const g = mp.room.g;
  const names = mpNames();
  const i = mpSeat();
  const votes = mwwVotes();
  const count = {};
  votes.forEach((t) => t >= 0 && (count[t] = (count[t] || 0) + 1));
  const mine = votes[i];
  const canVote = i >= 0 && g.alive[i];
  const done = votes.filter((v, k) => g.alive[k] && v !== undefined).length;
  const tip = !canVote
    ? 'Bạn đã bị loại nên không bỏ phiếu.'
    : mine === undefined
      ? 'Bấm vào người bạn muốn treo cổ trong làng.'
      : 'Đã bỏ phiếu. Bạn đổi được tới khi hết giờ.';
  const choice = mine === undefined ? 'Chưa bỏ phiếu' : mine < 0 ? 'Bạn chọn bỏ qua' : `Bạn bầu <b>${esc(names[mine])}</b>`;
  return mwwFrame({
    sub: 'Bỏ phiếu treo cổ',
    ring: mwwRing(g.deadline, WW_TIMES.turn),
    title: 'Phiên bỏ phiếu',
    town: { act: 'mww.vote', can: (k) => canVote && k !== i && g.alive[k], sel: mine, counts: g.hideVotes ? null : count },
    body: `
      ${mwwSay(`
        <p><b>${tip}</b></p>
        <p class="small">${done}/${wwAlive(g).length} người đã bỏ phiếu.${g.hideVotes ? ' Phiếu được giữ kín tới khi có kết quả.' : ''} Nhiều phiếu nhất sẽ lên giàn treo cổ để cả làng phán xử; hòa thì không ai lên giàn.</p>`)}
      ${mpIsHost() ? '<button class="link small" data-act="mww.tally">Chủ phòng: kết thúc bỏ phiếu ngay</button>' : ''}`,
    bar: canVote
      ? `<span class="bar-note">${choice}</span>
        <button class="btn ghost" data-act="mww.vote" data-i="-1" ${mine === -1 ? 'disabled' : ''}>${mine === -1 ? '✓ Đã bỏ qua' : 'Bỏ qua, không treo ai'}</button>`
      : '',
  });
}

// Ai bỏ phiếu cho ai, để cả làng cùng xem lại
function mwwBallots(g, names) {
  const by = {};
  g.ballots.forEach((t, k) => t !== null && (by[t] ||= []).push(esc(names[k])));
  const rows = Object.entries(by)
    .sort(([a, x], [b, y]) => (a < 0) - (b < 0) || y.length - x.length)
    .map(([t, who]) => `<p><b>${t < 0 ? 'Bỏ qua' : esc(names[t])}</b>: ${who.length} phiếu${g.hideVotes ? '' : ` <span class="muted small">(${who.join(', ')})</span>`}</p>`);
  return `<div class="info small"><b>Phiếu bầu</b>${rows.join('') || '<p class="muted">Không ai bỏ phiếu.</p>'}</div>`;
}

// Ai treo, ai tha người trên giàn
function mwwVerdictList(g, names) {
  const who = (kill) => g.verdicts.map((v, k) => (v === kill ? esc(names[k]) : null)).filter(Boolean);
  const row = (label, list) => `<p><b>${label}</b>: ${list.length} <span class="muted small">${list.length && !g.hideVotes ? `(${list.join(', ')})` : ''}</span></p>`;
  return `<div class="info small">${row('☠️ Treo', who(true))}${row('🙏 Tha', who(false))}</div>`;
}

// Phán xử: người nhiều phiếu nhất đứng trên giàn treo cổ, mọi người còn lại chọn Treo hay Tha trong 30 giây
function mwwTrialView() {
  const g = mp.room.g;
  const names = mpNames();
  const i = mpSeat();
  const a = g.accused;
  const verdicts = mwwVerdicts();
  const kill = verdicts.filter((v) => v === true).length;
  const save = verdicts.filter((v) => v === false).length;
  const mine = verdicts[i];
  const canVote = i >= 0 && g.alive[i] && i !== a;
  const tip = i === a
    ? 'Bạn đang đứng trên giàn treo cổ. Thanh minh đi!'
    : !canVote
      ? 'Bạn đã bị loại nên không phán xử.'
      : mine === undefined
        ? `Treo hay tha ${esc(names[a])}?`
        : 'Đã chọn. Bạn đổi được tới khi hết giờ.';
  return mwwFrame({
    sub: `Phán xử ${esc(names[a])}`,
    ring: mwwRing(g.deadline, WW_TIMES.turn),
    title: 'Trên giàn treo cổ',
    body: `
      ${mwwSay(`
        <p><b>${esc(names[a])}</b> bị cả làng đưa lên giàn. <b>${tip}</b></p>
        <p class="small">${g.hideVotes ? `${kill + save} người đã chọn, phiếu được giữ kín.` : `☠️ Treo: ${kill} · 🙏 Tha: ${save}.`} Treo nhiều hơn Tha thì bị treo cổ; hòa thì được tha.</p>`)}
      ${mpIsHost() ? '<button class="link small" data-act="mww.judge">Chủ phòng: kết thúc phán xử ngay</button>' : ''}`,
    bar: canVote
      ? `<button class="btn ${mine === true ? 'blood' : 'ghost'}" data-act="mww.verdict" data-kill="1">${mine === true ? '✓ ' : ''}☠️ Treo</button>
        <button class="btn ${mine === false ? '' : 'ghost'}" data-act="mww.verdict" data-kill="0">${mine === false ? '✓ ' : ''}🙏 Tha</button>`
      : '',
  });
}

function mwwRevealView() {
  const g = mp.room.g;
  const names = mpNames();
  const i = g.out;
  const role = i === null ? null : WW_ROLES[g.roles[i]];
  const next = mwwAfterLabel(g, '🌙 Sang đêm tiếp theo');
  return mwwFrame({
    sub: next,
    ring: g.deadline ? mwwRing(g.deadline, WW_TIMES.next) : '',
    title: 'Kết quả',
    body: `
      <div class="secret reveal">
        ${i === null && g.spared !== null && g.spared !== undefined
          ? `<div class="emoji">🙏</div><p class="muted">Dân làng tha cho <b>${esc(names[g.spared])}</b></p><p class="muted small">${esc(names[g.spared])} xuống giàn và chơi tiếp.</p>`
          : i === null
          ? '<div class="emoji">🤝</div><p class="muted">Không ai bị treo cổ</p><p class="muted small">Phiếu hòa hoặc không ai bị chọn.</p>'
          : `${g.shown[i] ? wwArt(g.roles[i], 'small') : '<div class="emoji">⚰️</div>'}
            <p class="muted">${esc(names[i])} bị treo cổ</p>
            ${g.shown[i] ? `<div class="role ${role.tag}">${role.label.toUpperCase()}</div>` : '<p class="muted">Vai trò được giữ kín.</p>'}`}
      </div>
      ${g.verdicts ? mwwVerdictList(g, names) : ''}
      ${g.ballots ? mwwBallots(g, names) : ''}`,
    bar: g.deadline ? mwwGoNow(next) : '',
  });
}

// Điểm nhấn của ván, rút từ nhật ký và vai đã lật
function mwwHighlights(g) {
  const names = mpNames();
  const items = [];
  (g.log || []).forEach((e) => {
    if (e.kind === 'hanged') {
      items.push(wwIsWolf(g, e.who) ? `🎯 Cả làng treo đúng Sói <b>${esc(names[e.who])}</b> ở ngày ${e.night}.` : `😢 <b>${esc(names[e.who])}</b> (${WW_ROLES[g.roles[e.who]].label}) bị treo oan ở ngày ${e.night}.`);
    }
  });
  (g.shots || []).forEach(({ hunter, target, night }) => {
    if (wwIsWolf(g, target)) items.push(`🏹 Thợ săn <b>${esc(names[hunter])}</b> bắn trúng Sói <b>${esc(names[target])}</b> ở đêm ${night}.`);
  });
  Object.entries(g.turned || {}).forEach(([k, was]) => items.push(`🌑 <b>${esc(names[k])}</b> từng là ${WW_ROLES[was].label}, bị nguyền hóa Sói.`));
  const winners = wwAlive(g).filter((k) => wwIsWolf(g, k) === (g.winner === 'wolf')).map((k) => `<b>${esc(names[k])}</b>`);
  if (winners.length) items.push(`🛡️ Sống sót tới cuối: ${winners.join(', ')}.`);
  return items.length ? `<div class="info"><b>Điểm nhấn</b><ul class="hl">${items.map((t) => `<li>${t}</li>`).join('')}</ul></div>` : '';
}

const mwwWon = (g, k) => (wwWakes(g.roles[k]) === 'wolf') === (g.winner === 'wolf');

// Lật vai cả làng khi hết ván, kèm thắng thua và điểm
function mwwReveal(g) {
  const names = mpNames();
  return `
    <section class="board">
      <h3>Lật vai</h3>
      <div class="pgrid">
        ${g.roles.map((role, k) => playerCard(names[k], {
          seat: k + 1,
          cls: g.alive[k] ? '' : 'out',
          extra: `${wwTag(role)}${g.turned?.[k] ? `<span class="muted small">từng là ${WW_ROLES[g.turned[k]].label}</span>` : ''}
            <span class="score">${mwwWon(g, k) ? `Thắng +${WW_POINTS[g.winner]}` : 'Thua'}</span>
            ${mp.room.seats[k].bot ? '' : `<span class="muted small">${pointsOf('ww', names[k])} điểm</span>`}`,
        })).join('')}
      </div>
    </section>`;
}

function mwwEndView() {
  const g = mp.room.g;
  const i = mpSeat();
  const wolfWin = g.winner === 'wolf';
  const minutes = g.endedAt ? Math.max(1, Math.round((g.endedAt - g.id) / 60000)) : null;
  return mwwFrame({
    sub: wolfWin ? 'Ma Sói thắng' : 'Dân làng thắng',
    title: 'Hết ván',
    body: `
      <div class="victory ${wolfWin ? 'wolf' : 'village'}">
        ${wwArt(wolfWin ? 'wolf' : 'villager', 'small')}
        <div class="grow">
          <div class="v-big">${wolfWin ? 'Ma Sói thắng' : 'Dân làng thắng'}</div>
          ${i >= 0 ? `<div class="v-me ${mwwWon(g, i) ? 'win' : 'lose'}">${mwwWon(g, i) ? '⚜️ Bạn chiến thắng' : '✝ Bạn thất bại'}</div>` : ''}
          <p class="small">${wolfWin ? 'Bầy sói đã áp đảo dân làng.' : 'Con sói cuối cùng đã bị tiêu diệt.'}</p>
        </div>
      </div>
      <div class="stats">
        <div><b>${g.night}</b><span>đêm</span></div>
        ${minutes ? `<div><b>${minutes}</b><span>phút</span></div>` : ''}
        <div><b>${wwAlive(g).length}/${g.roles.length}</b><span>sống sót</span></div>
      </div>
      ${mwwHighlights(g)}
      <button class="btn ghost" data-act="mww.panel" data-panel="reveal">⚜️ Xem lật vai cả làng</button>
      ${mpIsHost() ? '<button class="link small" data-act="mp.lobby">Về phòng chờ, đổi thiết lập</button>' : ''}`,
    bar: mpReadyBar('chơi ván mới'),
  });
}

const MWW_VIEWS = { night: mwwNightView, day: mwwDayView, vote: mwwVoteView, trial: mwwTrialView, reveal: mwwRevealView, end: mwwEndView };
const MWW_SUBS = { night: 'Ban đêm', day: 'Ban ngày', vote: 'Bỏ phiếu treo cổ', trial: 'Phán xử', reveal: 'Kết quả', end: 'Hết ván' };

views['mp.room'] = () => {
  mwwCast = null;
  if (!mp) return views['mp.home']();
  if (!mp.ready) return `${mpBar('Đang vào phòng…')}<div class="card"><p class="muted">Đang tải phòng ${esc(mp.id)}…</p></div>`;
  if (!mp.room) {
    return `${mpBar('Phòng đã đóng')}
      <div class="card"><p>Chủ phòng đã đóng phòng này.</p></div>
      <button class="btn" data-act="mp.leavenow">Về danh sách phòng</button>`;
  }
  const g = mp.room.g;
  if (mp.room.phase !== 'play' || !g) return mpLobby();
  if (mpSeat() < 0) {
    return mwwFrame({
      sub: MWW_SUBS[g.step],
      body: `
        <p>Ván đang diễn ra. Bạn sẽ được chia vai ở ván sau.</p>
        ${g.step === 'night' ? mwwTimeline(g) : ''}`,
    });
  }
  return MWW_VIEWS[g.step]();
};

// Làng 3D (village.js): ở trong phòng thì vào làng, đưa sang đó ai đang chơi, ai còn sống, số phiếu và ngày/đêm.
// Ngoài phòng thì ra khỏi làng.
function mwwScene() {
  const village = window.Village;
  if (!village) return;
  if (view !== 'mp.room' || !mp?.ready || !mp.room || !mww3d) {
    mwwHud(null);
    document.body.classList.remove('v-night', 'v-roam', 'sheet-min');
    return village.leave();
  }
  const room = mp.room;
  const g = room.phase === 'play' ? room.g : null;
  const seats = g
    ? room.seats
    : [...mpMembers().map(([uid, p]) => ({ uid, name: p.name })), ...mpBots().map((b) => ({ uid: b.id, name: b.name, bot: true }))];
  const votes = {};
  if (g?.step === 'vote') mwwVotes().forEach((t) => t >= 0 && (votes[t] = (votes[t] || 0) + 1));
  const night = g?.step === 'night';
  const roam = mwwRoam();
  // Sói biết nhau: máy của Sói thấy đồng bọn đi lại ban đêm và hiện hình người sói
  const iWolf = Boolean(g) && mpSeat() >= 0 && wwIsWolf(g, mpSeat());
  village.enter(mp.id, myId);
  village.sync({
    night,
    roam: roam && { picks: roam, picked: mpPick },
    accused: g ? room.seats[g.step === 'trial' ? g.accused : g.step === 'reveal' ? g.out ?? g.spared ?? -1 : -1]?.uid ?? null : null,
    players: seats.map((s, i) => ({
      id: s.uid,
      name: s.name,
      color: mwwColor(s),
      seat: i,
      bot: Boolean(s.bot),
      alive: g ? g.alive[i] : true,
      votes: votes[i] || 0,
      isMe: s.uid === myId,
      ally: s.uid === myId || (iWolf && wwIsWolf(g, i)),
      wolf: iWolf && wwIsWolf(g, i),
    })),
  });
  // Ban đêm chỉ vai đang được gọi đi lại được; còn lại bảng mở rộng để xem vai
  document.body.classList.toggle('v-night', night);
  // Hồn ma bay được cả ban đêm
  document.body.classList.toggle('v-roam', Boolean(roam) || (night && !g.alive[mpSeat()] && mpSeat() >= 0));
  mwwHud(roam);
}

// Nút hành động trên làng: đến lượt vai của mình thì chọn người (đi tới cửa nhà, hoặc bấm ‹ ›) và bấm làm ngay trên cảnh
function mwwHud(roam) {
  const hud = document.getElementById('hud');
  hud.hidden = !roam;
  if (!roam) return void (hud.innerHTML = '');
  const g = mp.room.g;
  const names = mpNames();
  const role = g.roles[mpSeat()];
  const who = mpPick === null ? '' : esc(names[mpPick]);
  const target = roam.length
    ? `<div class="v-target">
        <button class="v-round" data-act="mww.cycle" data-d="-1" aria-label="Người trước">‹</button>
        <b>${mpPick === null ? '👣 Đi tới cửa nhà ai đó' : `🎯 ${who}`}</b>
        <button class="v-round" data-act="mww.cycle" data-d="1" aria-label="Người sau">›</button>
      </div>`
    : '';
  let buttons = '';
  if (role === 'witch') {
    const victim = mwwVictim(g, mwwActs());
    const heal = !g.healUsed && victim !== null;
    if (heal) buttons += iosSwitch(mpHeal, 'mww.heal', { label: `💚 Cứu ${esc(names[victim])}` });
    const label = mpPick !== null ? `☠️ Đầu độc ${who}` : mpHeal ? '✓ Xong, chỉ cứu' : '🌙 Không dùng thuốc';
    buttons += `<button class="btn" data-act="mww.confirm">${label}</button>`;
  } else {
    const verb = { wolf: mpCurse ? '🌑 Nguyền' : '🐺 Cắn', seer: '🔮 Soi', guard: '🛡️ Bảo vệ', hunter: '🏹 Bắn' }[wwWakes(role)];
    if (role === 'cursewolf' && !g.curseUsed) buttons += iosSwitch(mpCurse, 'mww.curse', { label: '🌑 Nguyền' });
    buttons += `<button class="btn" data-act="mww.confirm" ${mpPick === null ? 'disabled' : ''}>${verb} ${who}</button>`;
  }
  hud.innerHTML = target + buttons;
}

// Ban đêm, đến lượt vai của mình (còn sống, đã mở máy, chưa chọn): những ghế chọn được, không thì null
function mwwRoam() {
  const g = mp?.room?.phase === 'play' ? mp.room.g : null;
  if (g?.step !== 'night' || !mpShow) return null;
  const i = mpSeat();
  if (i < 0 || !g.alive[i]) return null;
  if (wwWakes(g.roles[i]) !== g.calls[g.turn] || mwwActs()[i]) return null;
  return wwTargets(g, i);
}
AFTER_RENDER.push(mwwScene, mwwStage);

// Nền thị trấn và nhạc nền theo bước của ván: đêm tối trời và nhạc đêm; bỏ phiếu, phán xử thì nhạc dồn dập;
// có người trên giàn treo cổ thì hiện giàn
function mwwStage() {
  const here = view === 'mp.home' || view === 'mp.room';
  const g = here && mp?.room?.phase === 'play' ? mp.room.g : null;
  const step = g?.step;
  document.body.classList.toggle('salem', here);
  document.body.classList.toggle('salem-play', Boolean(g));
  document.body.classList.toggle('salem-night', step === 'night');
  document.body.classList.toggle('salem-gallows', step === 'trial' || (step === 'reveal' && g.out !== null));
  Music.mood(!here ? null : step === 'night' ? 'night' : ['vote', 'trial'].includes(step) ? 'tense' : 'day');
}
addEventListener('village-ready', () => render());
// Đi tới cửa nhà ai trong làng thì chọn người đó
addEventListener('village-pick', (e) => {
  if (!mwwRoam()?.includes(e.detail)) return;
  mpPick = e.detail;
  render();
});
actions['v.sheet'] = () => document.body.classList.toggle('sheet-min');
actions['v.mode'] = () => {
  mww3d = !mww3d;
  save('dmi.3d', mww3d);
};

/* ---------- Actions ---------- */

const needName = () => !wsUser && (mpMsg = 'Hãy đăng nhập DMI Workspace để chơi.');

// Bot mới lấy số nhỏ nhất chưa dùng: 🤖 Bot 1, 🤖 Bot 2…
function mpNewBot(bots) {
  let k = 1;
  while (bots.some((b) => b.id === `bot-${k}`)) k++;
  return { id: `bot-${k}`, name: `🤖 Bot ${k}` };
}

function mpStart() {
  mpUpdate((r) => {
    r.bots ||= [];
    while (mpMembers().length + r.bots.length < wwNeed()) r.bots.push(mpNewBot(r.bots));
    r.round = (r.round || 0) + 1;
    r.startAt = null;
    r.seats = [
      ...mpMembers().map(([uid, p]) => ({ uid, name: p.name })),
      ...(r.bots || []).map((b) => ({ uid: b.id, name: b.name, bot: true })),
    ];
    r.phase = 'play';
    r.g = mwwNew(r.seats);
  });
  // Đọc ngay trong lúc bấm để trình duyệt cho phép phát tiếng các lượt sau
  mwwNarrate();
  renderIfIdle();
}

Object.assign(actions, {
  'ww.step': (el) => {
    wwCfg.wolves = Math.max(1, wwCfg.wolves + Number(el.dataset.d));
    fixWW();
  },
  'ww.toggle': (el) => {
    wwCfg[el.dataset.key] = !wwCfg[el.dataset.key];
    fixWW();
  },
  'ww.num': (el) => {
    wwCfg[el.dataset.key] = Math.min(10, Math.max(1, wwCfg[el.dataset.key] + Number(el.dataset.d)));
    fixWW();
  },
  'mww.music': () => {
    wwMusicOn = !wwMusicOn;
    save('dmi.music', wwMusicOn);
    Music.enable(wwMusicOn);
  },
  'mww.voice': () => {
    wwVoiceOn = !wwVoiceOn;
    save('dmi.voice', wwVoiceOn);
    if (!wwVoiceOn) wwSay([], wwDone);
  },
  'mp.create': () => {
    if (!needName()) mpCreate();
  },
  'mp.enter': (el) => {
    if (needName()) return;
    mpEnter(el.dataset.id, true);
  },
  'mp.join': () => {
    if (!needName()) mpJoin();
  },
  'mp.bot': (el) =>
    mpUpdate((r) => {
      const bots = r.bots || [];
      r.bots = Number(el.dataset.d) > 0 ? [...bots, mpNewBot(bots)] : bots.slice(0, -1);
    }),
  'mp.fillbots': () =>
    mpUpdate((r) => {
      r.bots ||= [];
      while (mpMembers().length + r.bots.length < wwNeed()) r.bots.push(mpNewBot(r.bots));
    }),
  'mp.takehost': () =>
    mpUpdate((r) => {
      r.host = myId;
      r.hostName = mpName;
    }),
  'mp.leave': () =>
    (modal = {
      type: 'confirm',
      title: 'Rời phòng?',
      text: mpLast()
        ? 'Bạn là người cuối cùng trong phòng nên phòng sẽ được đóng.'
        : 'Những người còn lại chơi tiếp; nếu bạn là chủ phòng, máy người khác tự nhận làm chủ phòng.',
      yes: 'Rời phòng',
      act: 'mp.leavenow',
    }),
  'mp.leavenow': () => {
    modal = null;
    if (mp?.room) {
      const path = mpLast() ? `/rooms/${mp.id}` : `/rooms/${mp.id}/players/me`;
      mpWriting.then(() => api('DELETE', path)).catch(() => {});
    }
    mpStop();
    mpMsg = '';
    go('mp.home');
  },
  'mp.start': mpStart,
  'mp.quit': () =>
    (modal = {
      type: 'confirm',
      title: 'Hủy ván đang chơi?',
      text: 'Ván này sẽ bị hủy và không tính điểm. Mọi người quay về phòng chờ.',
      yes: 'Hủy ván',
      act: 'mp.lobby',
    }),
  'mp.lobby': () => {
    modal = null;
    wwSay([]);
    mpUpdate((r) => {
      r.phase = 'lobby';
      r.g = null;
      r.round = (r.round || 0) + 1;
      r.startAt = null;
    });
  },
  'mp.sel': (el) => (mpSel = Number(el.dataset.i)),
  // Ẩn máy thì giấu luôn thẻ vai
  'mww.show': () => {
    mpShow = !mpShow;
    if (!mpShow) mwwPeek = false;
  },
  // Bấm một người trong làng hoặc trong danh sách: mở thẻ người đó (bấm lại, hay -1, thì đóng). Bấm nhà người khác
  // mà mình đi được thì đi tới cửa nhà đó trước, tới nơi mới mở thẻ (mwwWalkLoop).
  'mww.focus': (el) => {
    const k = Number(el.dataset.i);
    mwwPanel = null;
    if (k < 0 || k === mwwFocus) return void (mwwFocus = null);
    mwwFocus = k;
  },
  // Nút trên thẻ người: làm việc của bước này với người đó (bỏ phiếu, chọn ban đêm); ban đêm chốt xong nhân vật mới đi tới
  // nhà đó, ban ngày không ai đi lại
  'mww.do': (el) => {
    const k = Number(el.dataset.i);
    const o = mwwTownNow;
    mwwFocus = null;
    if (!o.can?.(k)) return;
    if (o.act === 'mww.vote') actions['mww.vote'](el);
    if (o.act === 'mww.pick') {
      const fn = mwwFn();
      // Phù thủy cứu: ghi nhớ rồi mở lại chức năng (còn có thể đầu độc, hoặc bấm Xong)
      if (fn === 'heal') {
        mpHeal = true;
        mwwTurnShut = '';
        return;
      }
      mpPick = k;
      mpCurse = fn === 'curse';
      actions['mww.confirm']();
    }
  },
  'mww.panel': (el) => {
    mwwPanel = mwwPanel === el.dataset.panel ? null : el.dataset.panel;
    mwwFocus = null;
  },
  'mww.event': () => (mwwEventMin = !mwwEventMin),
  // Mời bạn: chia sẻ (điện thoại) hoặc chép lời mời có địa chỉ trang và mã phòng
  'mp.invite': () => {
    const text = `Vào chơi Ma Sói với mình: mở ${location.origin}/boardgame/ → 🐺 Ma Sói → phòng ${mp.id}`;
    if (navigator.share) return void navigator.share({ title: 'Ma Sói · DMI Boardgame', text }).catch(() => {});
    navigator.clipboard?.writeText(text).then(() => {
      mpMsg = 'Đã chép lời mời, dán gửi cho bạn bè nhé.';
      renderIfIdle();
    }, () => {});
  },
  'mww.peek': () => (mwwPeek = !mwwPeek),
  'mww.pick': (el) => {
    const k = Number(el.dataset.i);
    // Phù thủy được bỏ chọn vì thuốc độc không bắt buộc
    mpPick = mpPick === k && mp.room.g.roles[mpSeat()] === 'witch' ? null : k;
  },
  'mww.heal': () => (mpHeal = !mpHeal),
  'mww.curse': () => (mpCurse = !mpCurse),
  'mww.confirm': () => {
    const g = mp.room.g;
    mpWritePlayer({ ...mp.players[myId], act: { game: g.id, night: g.night, pick: mpPick, heal: mpHeal, curse: mpCurse, at: Date.now() } });
    // Đi tới nhà người được chọn, camera zoom vào, tới nơi thì chạy hoạt ảnh của vai (Phù thủy cứu thì ở nhà người bị cắn)
    const role = wwWakes(g.roles[mpSeat()]);
    const victim = role === 'witch' && mpHeal ? mwwVictim(g, mwwActs()) : null;
    const fx = [];
    if (mpPick !== null) fx.push({ k: mpPick, kind: role === 'wolf' ? (mpCurse ? 'curse' : 'wolf') : role === 'witch' ? 'poison' : role });
    if (victim !== null) fx.push({ k: victim, kind: 'heal' });
    if (fx.length) mwwGo(fx[0].k, fx, true);
  },
  'mww.flip': () => (mwwFlipped = { id: mp.room.g.id, at: Date.now() }),
  'mp.color': (el) => {
    mpColor = el.dataset.c;
    save('dmi.ww.color', mpColor);
    mpWritePlayer({ ...mp.players[myId], color: mpColor });
  },
  'mww.seen': () => mpWritePlayer({ ...mp.players[myId], seen: mp.room.g.id }),
  'mww.fn': (el) => {
    mwwMode = { key: mwwTurnKey(), fn: el.dataset.fn };
    mwwTurnShut = mwwTurnKey();
    mwwFocus = null;
  },
  'mww.fns': () => {
    mwwTurnShut = '';
    mwwFocus = null;
  },
  'mww.pass': () => {
    mwwTurnShut = mwwTurnKey();
    mpPick = null;
    actions['mww.confirm']();
  },
  'mww.skip': () => {
    const g = mp.room.g;
    if (g.turn < 0) wwSay([], () => mwwTurn(g, 0));
    else mwwSleep(g);
  },
  'mww.after': () => mpUpdate(mwwAfter),
  'mp.ready': () => mpWritePlayer({ ...mp.players[myId], ready: mp.players[myId]?.ready === mpRound() ? null : mpRound() }),
  'mww.done': () => {
    const key = mwwDoneKey(mp.room.g);
    mpWritePlayer({ ...mp.players[myId], done: mp.players[myId]?.done === key ? null : key });
  },
  // Nút ‹ › trên làng: đổi người đang chọn mà không cần đi tới nhà
  'mww.cycle': (el) => {
    const picks = mwwRoam() || [];
    if (!picks.length) return;
    const k = picks.indexOf(mpPick);
    mpPick = picks[(k < 0 ? 0 : k + Number(el.dataset.d) + picks.length) % picks.length];
  },
  'mww.votenow': () => mwwStartVote(),
  'mww.tally': () => mwwTally(),
  'mww.judge': () => mwwJudge(),
  'mww.verdict': (el) => {
    const g = mp.room.g;
    mpWritePlayer({ ...mp.players[myId], verdict: { game: g.id, night: g.night, kill: el.dataset.kill === '1', at: Date.now() } });
  },
  'mww.vote': (el) => {
    const g = mp.room.g;
    mpWritePlayer({ ...mp.players[myId], vote: { game: g.id, night: g.night, target: Number(el.dataset.i), at: Date.now() } });
  },
});
