<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132238"/>
      <stop offset=".6" stop-color="#3a2a4e"/>
      <stop offset="1" stop-color="#120c1c"/>
    </linearGradient>
    <radialGradient id="moon" cx=".45" cy=".4" r=".6">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="1" stop-color="#ffd9a8"/>
    </radialGradient>
    <clipPath id="left"><rect x="0" y="0" width="150" height="400"/></clipPath>
    <clipPath id="right"><rect x="150" y="0" width="150" height="400"/></clipPath>
  </defs>
  <rect width="300" height="400" rx="22" fill="url(#sky)"/>
  <g fill="#fffbea" opacity=".75">
    <circle cx="40" cy="40" r="1.4"/><circle cx="262" cy="56" r="1.2"/><circle cx="270" cy="160" r="1.6"/><circle cx="28" cy="170" r="1.2"/>
  </g>
  <!-- Trăng bán nguyệt: nửa sáng nửa tối -->
  <circle cx="150" cy="92" r="46" fill="#1c1428"/>
  <path d="M150 46 A46 46 0 0 0 150 138 Z" fill="url(#moon)"/>
  <!-- Mặt đất -->
  <path d="M0 340 C70 324 150 322 230 330 C260 334 284 338 300 342 L300 400 L0 400 Z" fill="#0e0a16"/>
  <!-- Nửa trái: dân làng -->
  <g clip-path="url(#left)">
    <path d="M150 340 L104 340 C104 290 112 252 150 240 Z" fill="#7a5a3a"/>
    <circle cx="150" cy="206" r="34" fill="#f2c9a0"/>
    <path d="M114 196 L150 150 L186 196 Z" fill="#b5652e"/>
    <circle cx="136" cy="208" r="4" fill="#2a1a10"/>
    <path d="M136 226 C142 230 148 230 150 229" stroke="#8a4a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Nửa phải: hóa sói -->
  <g clip-path="url(#right)">
    <path d="M150 340 L198 340 C198 290 190 252 150 240 Z" fill="#2a2234"/>
    <path d="M150 172 C176 172 190 188 194 204 L222 214 L192 222 C186 236 170 242 150 242 Z" fill="#3a3046"/>
    <path d="M160 176 L176 138 L184 182 Z" fill="#3a3046"/>
    <circle cx="166" cy="200" r="6" fill="#ff5a5a"/>
    <circle cx="166" cy="200" r="2" fill="#fff"/>
    <path d="M196 222 L190 230 L184 222 Z" fill="#f4f0e6"/>
  </g>
  <path d="M150 140 L150 344" stroke="#ffd9a8" stroke-width="2" stroke-dasharray="6 6" opacity=".5"/>
  <rect x="9" y="9" width="282" height="382" rx="16" fill="none" stroke="#ffd9a8" stroke-opacity=".35" stroke-width="2"/>
</svg>
