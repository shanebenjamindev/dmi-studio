# Every push and pull request: types, the Node tests and the Worker bundle in the Workers runtime (Miniflare).
# The Worker test is the one that catches a bundle that cannot start; deploy only when this is green.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:worker
